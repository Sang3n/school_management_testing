<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pathaibhara</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 50: '#eef2ff', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca', 900: '#1e1b4b' }
          }
        }
      }
    }
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- React 18 & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body { font-family: 'Inter', sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 9999px; }
    .dark ::-webkit-scrollbar-thumb { background: #334155; }
  </style>
</head>
<body class="bg-slate-100 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen transition-colors duration-200">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const ROLE_USER_PROFILES = {
      SUPER_ADMIN: { name: 'Alexander Vance', email: 'superadmin@sms.edu', avatar: 'A' },
      SCHOOL_ADMIN: { name: 'Sarah Jenkins', email: 'admin@sms.edu', avatar: 'S' },
      PRINCIPAL: { name: 'Dr. Robert Langdon', email: 'principal@sms.edu', avatar: 'R' },
      VICE_PRINCIPAL: { name: 'Elena Rostova', email: 'viceprincipal@sms.edu', avatar: 'E' },
      ACCOUNTANT: { name: 'Marcus Goldman', email: 'accountant@sms.edu', avatar: 'M' },
      TEACHER: { name: 'Emily Watson', email: 'teacher@sms.edu', avatar: 'E' },
      LIBRARIAN: { name: 'Arthur Pendelton', email: 'librarian@sms.edu', avatar: 'A' },
      RECEPTIONIST: { name: 'Clara Oswald', email: 'receptionist@sms.edu', avatar: 'C' },
      STUDENT: { name: 'Ethan Hunt', email: 'student@sms.edu', avatar: 'E' },
      PARENT: { name: 'Jonathan Hunt', email: 'parent@sms.edu', avatar: 'J' },
    };

    const ROLES = [
      { code: 'SUPER_ADMIN', name: 'Super Admin' },
      { code: 'SCHOOL_ADMIN', name: 'School Admin' },
      { code: 'PRINCIPAL', name: 'Principal' },
      { code: 'VICE_PRINCIPAL', name: 'Vice Principal' },
      { code: 'ACCOUNTANT', name: 'Accountant' },
      { code: 'TEACHER', name: 'Teacher' },
      { code: 'LIBRARIAN', name: 'Librarian' },
      { code: 'RECEPTIONIST', name: 'Receptionist' },
      { code: 'STUDENT', name: 'Student' },
      { code: 'PARENT', name: 'Parent' },
    ];

    const INITIAL_STUDENTS = [
      { id: 's1', name: 'Ethan Hunt', email: 'ethan@sms.edu', roll: '1001', admission: 'ADM-10045', class: 'Grade 10-A', house: 'Gryffindor', status: 'ACTIVE', allergies: 'Peanuts', emergency: '+1 555-999-8888' },
      { id: 's2', name: 'Sophia Miller', email: 'sophia@sophia.edu', roll: '1002', admission: 'ADM-10046', class: 'Grade 10-A', house: 'Ravenclaw', status: 'ACTIVE', allergies: 'None', emergency: '+1 555-888-7777' },
      { id: 's3', name: 'Lucas Davis', email: 'lucas@sms.edu', roll: '1003', admission: 'ADM-10047', class: 'Grade 11-B', house: 'Slytherin', status: 'ACTIVE', allergies: 'Penicillin', emergency: '+1 555-777-6666' },
      { id: 's4', name: 'Emma Watson', email: 'emma@sms.edu', roll: '1004', admission: 'ADM-10048', class: 'Grade 12-A', house: 'Hufflepuff', status: 'ACTIVE', allergies: 'Pollen', emergency: '+1 555-666-5555' },
    ];

    function App() {
      const [currentRole, setCurrentRole] = useState('SUPER_ADMIN');
      const [currentTab, setCurrentTab] = useState('dashboard');
      const [isDark, setIsDark] = useState(false);
      const [showRoleDropdown, setShowRoleDropdown] = useState(false);
      const [students, setStudents] = useState(INITIAL_STUDENTS);
      const [search, setSearch] = useState('');
      const [showAdmissionModal, setShowAdmissionModal] = useState(false);
      const [viewStudent, setViewStudent] = useState(null);
      const [showReportCard, setShowReportCard] = useState(null);
      const [showInvoiceReceipt, setShowInvoiceReceipt] = useState(null);
      const [notification, setNotification] = useState(null);
      const [sidebarCollapsed, setSidebarCollapsed] = useState(false);

      const chartRef1 = useRef(null);
      const chartRef2 = useRef(null);

      const currentUser = ROLE_USER_PROFILES[currentRole] || ROLE_USER_PROFILES.SUPER_ADMIN;

      // Admin privilege checks (Super Admin & School Admin only)
      const IS_ADMIN = currentRole === 'SUPER_ADMIN' || currentRole === 'SCHOOL_ADMIN';

      // Student admission permission: Super Admin, School Admin, Principal, Vice Principal, Accountant
      const CAN_ADMIT_STUDENTS = ['SUPER_ADMIN', 'SCHOOL_ADMIN', 'PRINCIPAL', 'VICE_PRINCIPAL', 'ACCOUNTANT'].includes(currentRole);

      const NAV_SECTIONS = [
        {
          category: 'CORE MODULES',
          items: [
            { id: 'dashboard', label: 'Dashboard Overview', icon: '📊' },
            { id: 'students', label: 'Students & Admissions', icon: '🎓' },
            { id: 'teachers', label: 'Faculty & Staff', icon: '👥' },
            { id: 'attendance', label: 'Daily Attendance', icon: '📅' },
          ]
        },
        {
          category: 'ACADEMICS & FINANCE',
          items: [
            { id: 'exams', label: 'Exams & Grade Cards', icon: '📝' },
            { id: 'fees', label: 'Fees & Invoicing', icon: '💵' },
            { id: 'notices', label: 'Notice Board', icon: '🔔' },
          ]
        },
        {
          category: 'SYSTEM & REPORTS',
          items: [
            ...(IS_ADMIN ? [{ id: 'users', label: 'User Directory (Admins Only)', icon: '🔑' }] : []),
            { id: 'reports', label: 'Reports Exporter', icon: '📈' },
            { id: 'settings', label: 'School Settings', icon: '⚙️' },
          ]
        }
      ];

      useEffect(() => {
        if (isDark) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      }, [isDark]);

      useEffect(() => {
        if (currentTab === 'dashboard' && window.Chart) {
          const ctx1 = document.getElementById('revenueChart');
          if (ctx1) {
            if (chartRef1.current) chartRef1.current.destroy();
            chartRef1.current = new Chart(ctx1, {
              type: 'line',
              data: {
                labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun'],
                datasets: [{
                  label: 'Tuition Collected ($)',
                  data: [14500, 18200, 16800, 21000, 24500, 22000],
                  borderColor: '#4f46e5',
                  backgroundColor: 'rgba(79, 70, 229, 0.12)',
                  fill: true,
                  tension: 0.4
                }]
              },
              options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
            });
          }

          const ctx2 = document.getElementById('attendanceChart');
          if (ctx2) {
            if (chartRef2.current) chartRef2.current.destroy();
            chartRef2.current = new Chart(ctx2, {
              type: 'bar',
              data: {
                labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'],
                datasets: [{
                  label: 'Attendance Rate (%)',
                  data: [94, 96, 92, 95, 98],
                  backgroundColor: '#10b981',
                  borderRadius: 8
                }]
              },
              options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
            });
          }
        }
      }, [currentTab, isDark]);

      const toggleTheme = () => {
        setIsDark(!isDark);
      };

      const notify = (msg) => {
        setNotification(msg);
        setTimeout(() => setNotification(null), 3000);
      };

      const handleOpenAdmissionModal = () => {
        if (!CAN_ADMIT_STUDENTS) {
          notify('🔒 Permission Denied: Only Super Admin, School Admin, Principal, Vice Principal, and Accountant can admit students.');
          return;
        }
        setShowAdmissionModal(true);
      };

      return (
        <div className="flex min-h-screen bg-slate-100 dark:bg-slate-950 text-slate-900 dark:text-slate-100 transition-colors duration-200">
          
          {/* Sidebar Navigation */}
          <aside className={`${sidebarCollapsed ? 'w-20' : 'w-64'} bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 flex flex-col justify-between h-screen sticky top-0 z-30 transition-all duration-300 shadow-sm`}>
            <div>
              {/* Brand Header */}
              <div 
                onClick={() => setCurrentTab('dashboard')} 
                className="h-16 flex items-center px-5 border-b border-slate-200 dark:border-slate-800 gap-3 cursor-pointer hover:opacity-85 transition-opacity"
                title="Return to Dashboard Overview"
              >
                <div className="w-9 h-9 rounded-xl bg-gradient-to-tr from-rose-500 to-indigo-600 flex items-center justify-center text-white shadow-md shadow-indigo-500/20 font-extrabold text-lg shrink-0">
                  🏫
                </div>
                {!sidebarCollapsed && (
                  <span className="font-extrabold text-lg text-slate-900 dark:text-white tracking-tight">
                    <span className="text-rose-600 dark:text-rose-400">Pathaibhara</span>
                  </span>
                )}
              </div>

              {/* Portal Role Context Tag */}
              {!sidebarCollapsed && (
                <div className="px-4 py-3 mx-3 my-3 bg-indigo-50 dark:bg-indigo-950/50 rounded-2xl border border-indigo-100 dark:border-indigo-900/60 flex items-center gap-2.5">
                  <span className="text-indigo-600 dark:text-indigo-400 text-sm shrink-0">🛡️</span>
                  <div className="overflow-hidden">
                    <p className="text-[10px] text-indigo-600 dark:text-indigo-400 uppercase font-bold tracking-wider">Active Context</p>
                    <p className="text-xs font-bold text-slate-900 dark:text-slate-100 truncate">{currentRole.replace('_', ' ')}</p>
                  </div>
                </div>
              )}

              {/* Categorized Nav Items */}
              <nav className="px-3 py-2 space-y-4 max-h-[calc(100vh-190px)] overflow-y-auto">
                {NAV_SECTIONS.map((sec, idx) => (
                  <div key={idx} className="space-y-1">
                    {!sidebarCollapsed && (
                      <p className="px-3 text-[10px] uppercase font-bold text-slate-400 dark:text-slate-500 tracking-wider">
                        {sec.category}
                      </p>
                    )}
                    {sec.items.map((item) => (
                      <button
                        key={item.id}
                        onClick={() => setCurrentTab(item.id)}
                        className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-bold transition-all ${
                          currentTab === item.id
                            ? 'bg-slate-700 dark:bg-indigo-600 text-white shadow-md shadow-slate-700/20 dark:shadow-indigo-600/30'
                            : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 hover:text-slate-900 dark:hover:text-white'
                        }`}
                        title={item.label}
                      >
                        <span className="text-sm shrink-0">{item.icon}</span>
                        {!sidebarCollapsed && <span>{item.label}</span>}
                      </button>
                    ))}
                  </div>
                ))}
              </nav>
            </div>

            <div className="p-4 border-t border-slate-200 dark:border-slate-800 flex items-center justify-between">
              {!sidebarCollapsed && (
                <p className="text-[11px] text-slate-400 dark:text-slate-500 font-semibold">v2.5 Production Ready</p>
              )}
              <button 
                onClick={() => setSidebarCollapsed(!sidebarCollapsed)}
                className="p-1.5 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 text-xs font-bold"
                title="Collapse / Expand Sidebar"
              >
                {sidebarCollapsed ? '➔' : '◀'}
              </button>
            </div>
          </aside>

          {/* Main Workspace Area */}
          <div className="flex-1 flex flex-col min-w-0">
            {/* Top Navbar Header */}
            <header className="h-16 bg-white/90 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 sticky top-0 z-20 px-6 flex items-center justify-between shadow-xs">
              <div className="flex items-center gap-4">
                {/* Dashboard Title Indicator */}
                <div className="flex items-center gap-2">
                  <div className="w-8 h-8 rounded-lg bg-slate-100 dark:bg-slate-800 flex items-center justify-center font-bold text-slate-700 dark:text-slate-200 text-sm">
                    📊
                  </div>
                  <h1 className="text-base font-extrabold text-slate-900 dark:text-white tracking-tight capitalize">
                    {currentTab.replace('_', ' ')}
                  </h1>
                </div>

                {/* Global Search Bar */}
                <div className="relative hidden md:block w-72">
                  <input
                    type="text"
                    placeholder="Search student, teacher, invoice..."
                    value={search}
                    onChange={(e) => setSearch(e.target.value)}
                    className="w-full pl-8 pr-4 py-1.5 text-xs rounded-xl bg-slate-100 dark:bg-slate-800 border-none text-slate-900 dark:text-slate-100 placeholder-slate-400 focus:ring-2 focus:ring-indigo-500"
                  />
                  <span className="absolute left-2.5 top-2 text-xs text-slate-400">🔍</span>
                </div>
              </div>

              {/* Action Controls */}
              <div className="flex items-center gap-3">
                {/* Role Switcher Dropdown - Strictly for Super Admin & School Admin */}
                {IS_ADMIN ? (
                  <div className="relative">
                    <button
                      onClick={() => setShowRoleDropdown(!showRoleDropdown)}
                      className="flex items-center gap-2 px-3 py-1.5 rounded-xl bg-indigo-50 dark:bg-indigo-950/80 border border-indigo-200 dark:border-indigo-800 text-indigo-700 dark:text-indigo-300 text-xs font-bold hover:bg-indigo-100 dark:hover:bg-indigo-900/60 transition-colors"
                    >
                      <span>✨ Switch Portal: {currentRole}</span>
                      <span>▼</span>
                    </button>

                    {showRoleDropdown && (
                      <div className="absolute right-0 mt-2 w-56 bg-white dark:bg-slate-800 rounded-2xl shadow-2xl border border-slate-200 dark:border-slate-700 py-2 z-50">
                        <div className="px-3 py-1 border-b border-slate-100 dark:border-slate-700 text-[10px] uppercase font-bold text-slate-400">Select Role Context</div>
                        <div className="max-h-60 overflow-y-auto">
                          {ROLES.map((r) => (
                            <button
                              key={r.code}
                              onClick={() => { setCurrentRole(r.code); setShowRoleDropdown(false); }}
                              className={`w-full text-left px-3.5 py-2 text-xs font-medium flex items-center justify-between hover:bg-slate-100 dark:hover:bg-slate-700 ${currentRole === r.code ? 'text-indigo-600 dark:text-indigo-400 font-bold bg-indigo-50 dark:bg-slate-700/50' : 'text-slate-700 dark:text-slate-300'}`}
                            >
                              <span>{r.name}</span>
                              {currentRole === r.code && <span>✓</span>}
                            </button>
                          ))}
                        </div>
                      </div>
                    )}
                  </div>
                ) : (
                  <div className="px-3 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-300 text-xs font-bold">
                    <span>🛡️ Role: {currentRole.replace('_', ' ')}</span>
                  </div>
                )}

                {/* Theme Toggle (☀️ White / 🌙 Dark Mode) */}
                <button 
                  onClick={toggleTheme} 
                  className="p-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-amber-500 hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors" 
                  title="Toggle Light / Dark Mode"
                >
                  {isDark ? '☀️ Light' : '🌙 Dark'}
                </button>

                {/* Notifications Bell */}
                <button 
                  onClick={() => notify('2 New Notifications')} 
                  className="p-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 relative"
                  title="Notifications"
                >
                  🔔
                  <span className="w-2 h-2 rounded-full bg-rose-500 absolute top-2 right-2 ring-2 ring-white dark:ring-slate-900" />
                </button>

                {/* User Profile Badge */}
                <div className="flex items-center gap-3 pl-3 border-l border-slate-200 dark:border-slate-800">
                  <div className="w-8 h-8 rounded-full bg-gradient-to-tr from-indigo-600 to-rose-500 flex items-center justify-center font-bold text-xs text-white shadow-md">
                    {currentUser.avatar}
                  </div>
                  <div className="hidden md:block">
                    <p className="text-xs font-bold text-slate-900 dark:text-slate-100">{currentUser.name}</p>
                    <p className="text-[10px] text-slate-400">{currentUser.email}</p>
                  </div>
                </div>
              </div>
            </header>

            {/* Content Container */}
            <main className="p-8 max-w-7xl w-full mx-auto space-y-6">
              {notification && (
                <div className="p-3.5 rounded-2xl bg-indigo-50 dark:bg-indigo-950 border border-indigo-200 dark:border-indigo-800 text-indigo-700 dark:text-indigo-200 text-xs font-semibold flex items-center gap-2">
                  <span>ℹ️</span> {notification}
                </div>
              )}

              {/* DASHBOARD TAB */}
              {currentTab === 'dashboard' && (
                <div className="space-y-6">
                  
                  {/* Shortcuts Card */}
                  <div className="p-5 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200/90 dark:border-slate-800 shadow-sm space-y-3">
                    <div className="flex items-center justify-between">
                      <h3 className="text-xs font-extrabold uppercase tracking-wider text-slate-500 dark:text-slate-400 flex items-center gap-2">
                        ⚡ Quick Shortcuts & Launcher
                      </h3>
                    </div>
                    <div className="flex flex-wrap items-center gap-2.5">
                      {CAN_ADMIT_STUDENTS && (
                        <button 
                          onClick={handleOpenAdmissionModal} 
                          className="flex items-center gap-1.5 px-3.5 py-1.5 rounded-xl bg-purple-50 dark:bg-purple-950/60 border border-purple-200 dark:border-purple-800 text-purple-700 dark:text-purple-300 text-xs font-bold hover:bg-purple-100"
                        >
                          ➕ Add Student
                        </button>
                      )}
                      <button 
                        onClick={() => setCurrentTab('attendance')} 
                        className="flex items-center gap-1.5 px-3.5 py-1.5 rounded-xl bg-blue-50 dark:bg-blue-950/60 border border-blue-200 dark:border-blue-800 text-blue-700 dark:text-blue-300 text-xs font-bold hover:bg-blue-100"
                      >
                        📅 Mark Attendance
                      </button>
                      <button 
                        onClick={() => setCurrentTab('fees')} 
                        className="flex items-center gap-1.5 px-3.5 py-1.5 rounded-xl bg-emerald-50 dark:bg-emerald-950/60 border border-emerald-200 dark:border-emerald-800 text-emerald-700 dark:text-emerald-300 text-xs font-bold hover:bg-emerald-100"
                      >
                        💵 Issue Fee Invoice
                      </button>
                      <button 
                        onClick={() => setCurrentTab('notices')} 
                        className="flex items-center gap-1.5 px-3.5 py-1.5 rounded-xl bg-amber-50 dark:bg-amber-950/60 border border-amber-200 dark:border-amber-800 text-amber-700 dark:text-amber-300 text-xs font-bold hover:bg-amber-100"
                      >
                        🔔 Post Notice
                      </button>
                    </div>
                  </div>

                  {/* Welcome Banner */}
                  <div className="p-6 rounded-3xl bg-gradient-to-r from-indigo-600 via-indigo-700 to-purple-800 text-white shadow-xl flex items-center justify-between">
                    <div>
                      <span className="px-2.5 py-0.5 rounded-full bg-white/20 text-white text-[11px] font-bold">
                        {currentRole.replace('_', ' ')} PORTAL
                      </span>
                      <h1 className="text-2xl font-extrabold mt-1">Welcome back, {currentUser.name.split(' ')[0]}!</h1>
                    </div>
                    {CAN_ADMIT_STUDENTS && (
                      <button onClick={handleOpenAdmissionModal} className="px-4 py-2 bg-white text-indigo-700 font-bold text-xs rounded-xl shadow-md hover:bg-slate-100">
                        + New Admission
                      </button>
                    )}
                  </div>

                  {/* Analytics Counter Cards */}
                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                    {[
                      { title: 'Total Active Students', val: '1,284', desc: '+4.2% this term', icon: '🎓' },
                      { title: 'Faculty Staff', val: '86', desc: 'Full-time Teachers', icon: '👥' },
                      { title: 'Attendance Today', val: '96.4%', desc: '1,238 Present', icon: '📅' },
                      { title: 'Fees Collected', val: '$245,000', desc: '92% Collection Rate', icon: '💵' },
                    ].map((c, i) => (
                      <div key={i} className="p-5 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200/90 dark:border-slate-800 shadow-xs">
                        <div className="flex items-center justify-between text-xs text-slate-500 dark:text-slate-400 font-medium">
                          <span>{c.title}</span>
                          <span className="text-lg">{c.icon}</span>
                        </div>
                        <h3 className="text-2xl font-extrabold text-slate-900 dark:text-white mt-2">{c.val}</h3>
                        <p className="text-[11px] text-emerald-600 dark:text-emerald-400 font-semibold mt-1">{c.desc}</p>
                      </div>
                    ))}
                  </div>

                  {/* Charts & Summary List */}
                  <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    <div className="p-6 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200/90 dark:border-slate-800 shadow-xs space-y-3">
                      <h3 className="text-sm font-bold text-slate-900 dark:text-white">Monthly Fee Revenue ($)</h3>
                      <div className="h-60 relative"><canvas id="revenueChart"></canvas></div>
                    </div>
                    
                    {/* Summary List Card */}
                    <div className="p-6 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200/90 dark:border-slate-800 shadow-xs space-y-4">
                      <div className="flex items-center justify-between border-b border-slate-100 dark:border-slate-800 pb-3">
                        <h3 className="text-sm font-bold text-slate-900 dark:text-white flex items-center gap-2">
                          <span>📋</span> Institutional Activity Summary
                        </h3>
                      </div>
                      <div className="divide-y divide-slate-100 dark:divide-slate-800 text-xs">
                        <div className="py-2.5 flex items-center justify-between">
                          <span className="font-semibold text-slate-600 dark:text-slate-400">New Student Admissions</span>
                          <span className="font-bold text-indigo-600 dark:text-indigo-400">42 Students</span>
                        </div>
                        <div className="py-2.5 flex items-center justify-between">
                          <span className="font-semibold text-slate-600 dark:text-slate-400">Pending Fee Invoices</span>
                          <span className="font-bold text-amber-600 dark:text-amber-400">18 Invoices</span>
                        </div>
                        <div className="py-2.5 flex items-center justify-between">
                          <span className="font-semibold text-slate-600 dark:text-slate-400">Resolved Examinations</span>
                          <span className="font-bold text-emerald-600 dark:text-emerald-400">215 Cards Issued</span>
                        </div>
                        <div className="py-2.5 flex items-center justify-between">
                          <span className="font-semibold text-slate-600 dark:text-slate-400">Daily Teacher Attendance</span>
                          <span className="font-bold text-blue-600 dark:text-blue-400">98.2% Present</span>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {/* SYSTEM USERS DIRECTORY TAB (Strictly for Super Admin & School Admin) */}
              {currentTab === 'users' && IS_ADMIN && (
                <div className="space-y-6">
                  <div className="flex justify-between items-center">
                    <div>
                      <h2 className="text-xl font-bold text-slate-900 dark:text-white">System User Accounts & Portals</h2>
                      <p className="text-xs text-slate-500 dark:text-slate-400">Restricted Administrator view of all 10 pre-seeded role accounts</p>
                    </div>
                    <span className="px-3.5 py-1.5 rounded-xl bg-indigo-50 dark:bg-indigo-950 text-indigo-700 dark:text-indigo-300 text-xs font-extrabold border border-indigo-200 dark:border-indigo-800">
                      👑 Admin Access Level
                    </span>
                  </div>

                  <div className="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200/90 dark:border-slate-800 overflow-hidden shadow-xs">
                    <table className="w-full text-left text-xs text-slate-700 dark:text-slate-300">
                      <thead className="bg-slate-50 dark:bg-slate-800 text-slate-500 dark:text-slate-400 font-bold border-b border-slate-200 dark:border-slate-700">
                        <tr>
                          <th className="p-3.5">User Profile</th>
                          <th className="p-3.5">Assigned Role</th>
                          <th className="p-3.5">Official Email</th>
                          <th className="p-3.5">Status</th>
                          <th className="p-3.5 text-right">Switch Portal</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100 dark:divide-slate-800 font-medium">
                        {ROLES.map((r) => {
                          const prof = ROLE_USER_PROFILES[r.code];
                          return (
                            <tr key={r.code} className="hover:bg-slate-50 dark:hover:bg-slate-800/50">
                              <td className="p-3.5 font-bold text-slate-900 dark:text-white">
                                <div className="flex items-center gap-3">
                                  <div className="w-8 h-8 rounded-full bg-indigo-600 text-white flex items-center justify-center font-bold text-xs shadow-sm">
                                    {prof.avatar}
                                  </div>
                                  <span>{prof.name}</span>
                                </div>
                              </td>
                              <td className="p-3.5 font-semibold text-indigo-600 dark:text-indigo-400">{r.name}</td>
                              <td className="p-3.5 text-slate-500 font-mono text-[11px]">{prof.email}</td>
                              <td className="p-3.5"><span className="px-2 py-0.5 rounded bg-emerald-100 dark:bg-emerald-950 text-emerald-700 dark:text-emerald-400 text-[10px] font-bold">ACTIVE</span></td>
                              <td className="p-3.5 text-right">
                                <button 
                                  onClick={() => { setCurrentRole(r.code); notify(`Switched to ${r.name} (${prof.name})`); }} 
                                  className="px-3 py-1 bg-indigo-600 text-white rounded-lg text-xs font-bold hover:bg-indigo-700"
                                >
                                  Inspect Portal
                                </button>
                              </td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

              {/* STUDENTS TAB */}
              {currentTab === 'students' && (
                <div className="space-y-6">
                  <div className="flex justify-between items-center">
                    <div>
                      <h2 className="text-xl font-bold text-slate-900 dark:text-white">Student Directory & Profiles</h2>
                      <p className="text-xs text-slate-500 dark:text-slate-400">Manage student records, roll numbers & admissions</p>
                    </div>
                    {CAN_ADMIT_STUDENTS ? (
                      <button onClick={handleOpenAdmissionModal} className="px-4 py-2 bg-indigo-600 text-white font-bold text-xs rounded-xl shadow-md hover:bg-indigo-700">
                        + New Admission
                      </button>
                    ) : (
                      <span className="px-3.5 py-2 bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-slate-400 text-xs font-semibold rounded-xl border border-slate-300 dark:border-slate-700 flex items-center gap-1.5">
                        🔒 Admission Restricted
                      </span>
                    )}
                  </div>

                  <div className="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200/90 dark:border-slate-800 overflow-hidden shadow-xs">
                    <table className="w-full text-left text-xs text-slate-700 dark:text-slate-300">
                      <thead className="bg-slate-50 dark:bg-slate-800 text-slate-500 dark:text-slate-400 font-bold border-b border-slate-200 dark:border-slate-700">
                        <tr>
                          <th className="p-3.5">Student Info</th>
                          <th className="p-3.5">Admission / Roll</th>
                          <th className="p-3.5">Class</th>
                          <th className="p-3.5">House</th>
                          <th className="p-3.5">Medical Alert</th>
                          <th className="p-3.5 text-right">Actions</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100 dark:divide-slate-800 font-medium">
                        {students.filter(s => s.name.toLowerCase().includes(search.toLowerCase())).map(s => (
                          <tr key={s.id} className="hover:bg-slate-50 dark:hover:bg-slate-800/50">
                            <td className="p-3.5 font-bold text-slate-900 dark:text-white">{s.name} <br/><span className="text-[10px] text-slate-400 font-normal">{s.email}</span></td>
                            <td className="p-3.5">{s.admission} <br/><span className="text-[10px] text-slate-400">Roll: {s.roll}</span></td>
                            <td className="p-3.5 font-semibold text-indigo-600 dark:text-indigo-400">{s.class}</td>
                            <td className="p-3.5"><span className="px-2 py-0.5 rounded bg-indigo-50 dark:bg-indigo-950 text-indigo-700 dark:text-indigo-300 text-[10px] font-bold">{s.house}</span></td>
                            <td className="p-3.5 text-rose-600 dark:text-rose-400 font-semibold">{s.allergies !== 'None' ? `⚠️ ${s.allergies}` : 'None'}</td>
                            <td className="p-3.5 text-right">
                              <button onClick={() => setViewStudent(s)} className="px-3 py-1 bg-indigo-50 dark:bg-indigo-950 text-indigo-700 dark:text-indigo-300 rounded-lg text-xs font-semibold hover:bg-indigo-100">View Profile</button>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

              {/* EXAMS TAB */}
              {currentTab === 'exams' && (
                <div className="space-y-6">
                  <h2 className="text-xl font-bold text-slate-900 dark:text-white">Examinations & Marksheet Entry</h2>
                  <div className="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200/90 dark:border-slate-800 overflow-hidden shadow-xs">
                    <table className="w-full text-left text-xs text-slate-700 dark:text-slate-300">
                      <thead className="bg-slate-50 dark:bg-slate-800 text-slate-500 dark:text-slate-400 font-bold">
                        <tr><th className="p-3">Student</th><th className="p-3">Marks (100)</th><th className="p-3">Grade</th><th className="p-3">GPA</th><th className="p-3 text-right">Report Card</th></tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100 dark:divide-slate-800">
                        {students.map(s => (
                          <tr key={s.id}>
                            <td className="p-3.5 font-bold text-slate-900 dark:text-white">{s.name}</td>
                            <td className="p-3.5 font-semibold text-indigo-600 dark:text-indigo-400">92.5</td>
                            <td className="p-3.5"><span className="px-2 py-0.5 bg-emerald-100 dark:bg-emerald-950 text-emerald-700 dark:text-emerald-400 font-bold rounded">A+</span></td>
                            <td className="p-3.5 font-bold">4.0</td>
                            <td className="p-3.5 text-right">
                              <button onClick={() => setShowReportCard(s)} className="px-3 py-1 bg-indigo-600 text-white font-semibold rounded-lg">Print Report Card</button>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

              {/* FEES TAB */}
              {currentTab === 'fees' && (
                <div className="space-y-6">
                  <h2 className="text-xl font-bold text-slate-900 dark:text-white">Fee Invoicing & Dues</h2>
                  <div className="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200/90 dark:border-slate-800 overflow-hidden shadow-xs">
                    <table className="w-full text-left text-xs text-slate-700 dark:text-slate-300">
                      <thead className="bg-slate-50 dark:bg-slate-800 text-slate-500 dark:text-slate-400 font-bold">
                        <tr><th className="p-3">Invoice No</th><th className="p-3">Student</th><th className="p-3">Net Amount</th><th className="p-3">Status</th><th className="p-3 text-right">Actions</th></tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100 dark:divide-slate-800">
                        <tr>
                          <td className="p-3.5 font-bold text-slate-900 dark:text-white">INV-2026-0098</td>
                          <td className="p-3.5 font-bold">Ethan Hunt</td>
                          <td className="p-3.5 text-emerald-600 dark:text-emerald-400 font-extrabold">$1,100.00</td>
                          <td className="p-3.5"><span className="px-2 py-0.5 bg-rose-100 dark:bg-rose-950 text-rose-700 dark:text-rose-300 text-[10px] font-bold rounded">UNPAID</span></td>
                          <td className="p-3.5 text-right space-x-2">
                            <button onClick={() => notify('Cash Payment Recorded!')} className="px-3 py-1 bg-emerald-600 text-white rounded-lg font-semibold">Record Payment</button>
                            <button onClick={() => setShowInvoiceReceipt(true)} className="px-3 py-1 bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 rounded-lg font-semibold">Print Receipt</button>
                          </td>
                        </tr>
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

              {/* REPORTS TAB */}
              {currentTab === 'reports' && (
                <div className="space-y-6">
                  <h2 className="text-xl font-bold text-slate-900 dark:text-white">Institutional Reports & Data Exporter</h2>
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                    {['Student Admissions Summary', 'Monthly Attendance Log', 'Fee Collection Defaulters'].map((r, i) => (
                      <div key={i} className="p-5 bg-white dark:bg-slate-900 border border-slate-200/90 dark:border-slate-800 rounded-2xl space-y-3 shadow-xs">
                        <h3 className="font-bold text-sm text-slate-900 dark:text-white">{r}</h3>
                        <div className="flex gap-2">
                          <button onClick={() => notify(`Downloaded ${r} (PDF)`)} className="w-1/2 py-2 bg-indigo-600 text-white rounded-xl text-xs font-semibold">Download PDF</button>
                          <button onClick={() => notify(`Downloaded ${r} (CSV)`)} className="w-1/2 py-2 bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 rounded-xl text-xs font-semibold">Download CSV</button>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </main>
          </div>

          {/* Admission Modal */}
          {showAdmissionModal && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center z-50 p-4">
              <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-6 max-w-md w-full space-y-4 shadow-2xl">
                <h3 className="text-base font-bold text-slate-900 dark:text-white">Student Admission Form</h3>
                <form onSubmit={(e) => {
                  e.preventDefault();
                  const name = e.target.name.value;
                  const newS = { id: 's-' + Date.now(), name, email: name.toLowerCase().replace(' ', '') + '@sms.edu', roll: '1005', admission: 'ADM-10049', class: 'Grade 10-A', house: 'Gryffindor', status: 'ACTIVE', allergies: 'None', emergency: '+1 555-000-0000' };
                  setStudents([newS, ...students]);
                  setShowAdmissionModal(false);
                  notify('Student Admitted Successfully!');
                }} className="space-y-3 text-xs">
                  <input name="name" type="text" placeholder="Student Full Name" required className="w-full p-2.5 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-slate-900 dark:text-white" />
                  <div className="flex justify-end gap-2 pt-2">
                    <button type="button" onClick={() => setShowAdmissionModal(false)} className="px-4 py-2 bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 rounded-xl font-semibold">Cancel</button>
                    <button type="submit" className="px-4 py-2 bg-indigo-600 text-white font-bold rounded-xl">Submit</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Profile Modal */}
          {viewStudent && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center z-50 p-4">
              <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-6 max-w-lg w-full text-xs space-y-4 shadow-2xl">
                <div className="flex justify-between items-center pb-2 border-b border-slate-100 dark:border-slate-800">
                  <h3 className="text-base font-bold text-slate-900 dark:text-white">{viewStudent.name} Profile</h3>
                  <button onClick={() => setViewStudent(null)} className="text-slate-400">✕</button>
                </div>
                <div className="grid grid-cols-2 gap-3">
                  <div className="p-3 bg-slate-50 dark:bg-slate-800/50 rounded-xl"><p className="text-slate-400">Admission No</p><p className="font-bold text-slate-900 dark:text-white">{viewStudent.admission}</p></div>
                  <div className="p-3 bg-slate-50 dark:bg-slate-800/50 rounded-xl"><p className="text-slate-400">Roll No</p><p className="font-bold text-slate-900 dark:text-white">{viewStudent.roll}</p></div>
                  <div className="p-3 bg-slate-50 dark:bg-slate-800/50 rounded-xl"><p className="text-slate-400">House</p><p className="font-bold text-indigo-600 dark:text-indigo-400">{viewStudent.house}</p></div>
                  <div className="p-3 bg-slate-50 dark:bg-slate-800/50 rounded-xl"><p className="text-slate-400">Emergency Phone</p><p className="font-bold text-rose-600 dark:text-rose-400">{viewStudent.emergency}</p></div>
                </div>
                <button onClick={() => setViewStudent(null)} className="w-full py-2 bg-indigo-600 text-white font-semibold rounded-xl">Close</button>
              </div>
            </div>
          )}

          {/* Report Card Modal */}
          {showReportCard && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center z-50 p-4">
              <div className="bg-white text-slate-900 rounded-3xl p-6 max-w-md w-full text-xs space-y-4 shadow-2xl">
                <div className="text-center border-b pb-3">
                  <h3 className="font-bold text-lg text-indigo-900">Pathaibhara</h3>
                </div>
                <div className="space-y-1">
                  <p><strong>Roll No:</strong> {showReportCard.roll} • <strong>Class:</strong> {showReportCard.class}</p>
                  <p><strong>Overall GPA:</strong> <span className="text-indigo-600 font-extrabold">3.92 / 4.0</span></p>
                </div>
                <button onClick={() => setShowReportCard(null)} className="w-full py-2 bg-indigo-600 text-white font-semibold rounded-xl">Close & Print</button>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
