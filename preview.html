                    <h3 className="text-xs font-extrabold uppercase tracking-wider text-slate-500">Principal Executive Quick Actions</h3>
                    <div className="flex flex-wrap items-center gap-2.5">
                      <button onClick={() => { setCurrentTab('students'); setShowAdmissionModal(true); }} className="px-3.5 py-1.5 rounded-xl bg-purple-600 text-white text-xs font-bold shadow-md hover:bg-purple-700">➕ Admit New Student</button>
                      <button onClick={() => notify('Class Teacher Assigned!')} className="px-3.5 py-1.5 rounded-xl bg-indigo-600 text-white text-xs font-bold shadow-md hover:bg-indigo-700">👨‍🏫 Assign Class Teacher</button>
                      <button onClick={() => notify('Approved Faculty Leave Request!')} className="px-3.5 py-1.5 rounded-xl bg-emerald-50 text-emerald-700 text-xs font-bold border border-emerald-200">✅ Approve Leave Request</button>
                      <button onClick={() => notify('Exam Schedule Published!')} className="px-3.5 py-1.5 rounded-xl bg-blue-50 text-blue-700 text-xs font-bold border border-blue-200">📅 Create Exam Schedule</button>
                      <button onClick={() => notify('Q3 Marks & Results Published!')} className="px-3.5 py-1.5 rounded-xl bg-rose-50 text-rose-700 text-xs font-bold border border-rose-200">📝 Publish Results</button>
                      <button onClick={() => notify('Publishing Notice to Parent Portal...')} className="px-3.5 py-1.5 rounded-xl bg-amber-50 text-amber-700 text-xs font-bold border border-amber-200">📢 Publish Notice</button>
                      <button onClick={() => notify('Opening Performance Analytics...')} className="px-3.5 py-1.5 rounded-xl bg-cyan-50 text-cyan-700 text-xs font-bold border border-cyan-200">📊 View School Performance</button>
                      <button onClick={() => notify('Exporting Comprehensive Institutional Reports...')} className="px-3.5 py-1.5 rounded-xl bg-slate-100 text-slate-700 text-xs font-bold border border-slate-300">📄 Generate Reports</button>
                    </div>
                  </div>

                  {/* ACADEMIC PERFORMANCE & DISCIPLINE PANELS */}
                  <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    <div className="p-6 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl space-y-4 shadow-xs">
                      <div className="flex justify-between items-center border-b border-slate-100 pb-3">
                        <h3 className="text-sm font-extrabold text-slate-900 dark:text-white flex items-center gap-2">
                          <span>📊</span> School Academic Performance Analytics
                        </h3>
                      </div>
                      <div className="h-56 relative"><canvas id="principalPerformanceChart"></canvas></div>
                    </div>

                    <div className="p-6 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl space-y-4 shadow-xs">
                      <div className="flex justify-between items-center border-b border-slate-100 pb-3">
                        <h3 className="text-sm font-extrabold text-slate-900 dark:text-white flex items-center gap-2">
                          <span>🚨</span> Active Discipline & Counseling Cases
                        </h3>
                        <button onClick={() => notify('New Incident Logged')} className="text-xs font-bold text-rose-600 hover:underline">+ File Incident</button>
                      </div>
                      <div className="space-y-3 text-xs">
                        <div className="p-3.5 bg-rose-50 dark:bg-rose-950/40 rounded-xl border border-rose-200 flex justify-between items-center">
                          <div><p className="font-bold text-rose-900 dark:text-rose-200">Lucas Davis (Grade 11-B)</p><p className="text-rose-700 dark:text-rose-300">Unexcused Absence & Behavioral Incident</p></div>
                          <button onClick={() => notify('Discipline Warning Issued')} className="px-3 py-1 bg-rose-600 text-white rounded-lg font-bold">Issue Warning</button>
                        </div>
                        <div className="p-3.5 bg-amber-50 dark:bg-amber-950/40 rounded-xl border border-amber-200 flex justify-between items-center">
                          <div><p className="font-bold text-amber-900 dark:text-amber-200">Ethan Hunt (Grade 10-A)</p><p className="text-amber-700 dark:text-amber-300">Late Submission Warning</p></div>
                          <button onClick={() => notify('Counseling Session Scheduled')} className="px-3 py-1 bg-amber-600 text-white rounded-lg font-bold">Schedule Counseling</button>
                        </div>
                      </div>
                    </div>
                  </div>

                  {/* PRINCIPAL VS SUPER ADMIN SEPARATION PERMISSIONS MATRIX */}
                  <div className="p-6 bg-slate-900 text-white rounded-3xl space-y-4 shadow-xl border border-slate-800">
                    <div className="flex justify-between items-center">
                      <h3 className="text-sm font-extrabold flex items-center gap-2 text-purple-400">
                        <span>🛡️</span> Principal vs Super Admin Separation Policy Matrix
                      </h3>
                      <span className="px-3 py-1 rounded-full bg-purple-500/20 text-purple-300 text-[10px] font-extrabold border border-purple-500/30">
                        Academic Governance Active
                      </span>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs">
                      <div className="p-4 bg-slate-800/60 rounded-2xl space-y-1.5 border border-slate-700">
                        <p className="font-extrabold text-emerald-400">✅ Principal Operational & Academic Scope:</p>
                        <p className="text-slate-300">• Admit Students, Approve Transfers, Promotions & Graduations</p>
                        <p className="text-slate-300">• Assign Class Teachers & Subjects, Approve Faculty Leave</p>
                        <p className="text-slate-300">• Academic Years, Classes, Timetables & Lesson Plans</p>
                        <p className="text-slate-300">• Exam Schedules, Marks Review, Publish Results & Report Cards</p>
                        <p className="text-slate-300">• View-Only Fee Summaries & Export Reports (PDF/Excel/CSV)</p>
                      </div>
                      <div className="p-4 bg-slate-800/60 rounded-2xl space-y-1.5 border border-slate-700">
                        <p className="font-extrabold text-rose-400">🔒 Restricted Technical & System Administration:</p>
                        <p className="text-slate-400">• Cannot Create or Delete User Roles & Permissions</p>
                        <p className="text-slate-400">• Cannot Access System Database Backups or API Integrations</p>
                        <p className="text-slate-400">• Cannot Manage Financial Payroll (Reserved for Accountant)</p>
                        <p className="text-slate-400">• Cannot Permanently Delete Critical Records or Super Admins</p>
                      </div>
                    </div>
                  </div>

                </div>
              )}

              {/* STUDENTS DIRECTORY TAB */}
              {currentTab === 'students' && (
                <div className="space-y-6">
                  <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                    <div>
                      <h2 className="text-xl font-extrabold text-slate-900 dark:text-white">Students & Admissions Directory</h2>
                      <p className="text-xs text-slate-500 dark:text-slate-400">Principal Academic Enrollment & Student Records</p>
                    </div>

                    {CAN_ADMIT_STUDENTS && (
                      <button onClick={() => setShowAdmissionModal(true)} className="px-5 py-2.5 bg-gradient-to-r from-purple-600 to-indigo-600 text-white font-extrabold text-xs rounded-2xl shadow-lg flex items-center gap-2">
                        <span>➕</span> + Admit New Student (Principal Form)
                      </button>
                    )}
                  </div>

                  <div className="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 overflow-hidden shadow-xs">
                    <table className="w-full text-left text-xs text-slate-700 dark:text-slate-300">
                      <thead className="bg-slate-50 dark:bg-slate-800 text-slate-400 font-bold border-b">
                        <tr>
                          <th className="p-3.5">Student Name</th><th className="p-3.5">Admission / Roll</th><th className="p-3.5">Class / Section</th><th className="p-3.5">House</th><th className="p-3.5">Medical Alert</th><th className="p-3.5 text-right">Actions</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100 dark:divide-slate-800 font-medium">
                        {students.filter(s => s.name.toLowerCase().includes(search.toLowerCase())).map(s => (
                          <tr key={s.id}>
                            <td className="p-3.5 font-bold text-slate-900 dark:text-white">{s.name}<br/><span className="text-[10px] text-slate-400">{s.email}</span></td>
                            <td className="p-3.5">{s.admission}<br/><span className="text-[10px] text-slate-400">Roll: {s.roll}</span></td>
                            <td className="p-3.5 font-semibold text-purple-600">{s.class}</td>
                            <td className="p-3.5"><span className="px-2.5 py-1 rounded-full text-[10px] font-bold bg-rose-100 text-rose-700">{s.house}</span></td>
                            <td className="p-3.5 text-rose-600 font-semibold">{s.allergies !== 'None' ? `⚠️ ${s.allergies}` : 'None'}</td>
                            <td className="p-3.5 text-right"><button onClick={() => setViewStudent(s)} className="px-3 py-1 bg-purple-50 text-purple-700 rounded-lg text-xs font-semibold">View Profile</button></td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}
            </main>

            {/* FOOTER STATISTICS */}
            <footer className="bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 px-8 py-3.5 flex flex-wrap items-center justify-between text-xs text-slate-500 font-semibold">
              <div className="flex flex-wrap items-center gap-6">
                <span>👨‍🎓 Total Students: <strong className="text-slate-900 dark:text-white">1,284</strong></span>
                <span>👨‍🏫 Teachers: <strong className="text-slate-900 dark:text-white">86</strong></span>
                <span>✅ Attendance: <strong className="text-emerald-600">96.4%</strong></span>
                <span>💰 Fee Summary: <strong className="text-purple-600">$64,000 (View Only)</strong></span>
              </div>
              <p className="text-[11px] text-slate-400">Pathaibhara SMS © 2026</p>
            </footer>
          </div>

          {/* 11-SECTION ADMISSION MODAL */}
          {showAdmissionModal && CAN_ADMIT_STUDENTS && (
            <div className="fixed inset-0 bg-slate-900/70 backdrop-blur-sm flex items-center justify-center z-50 p-4">
              <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl max-w-4xl w-full max-h-[92vh] flex flex-col overflow-hidden shadow-2xl">
                <div className="p-5 border-b flex items-center justify-between bg-slate-50 dark:bg-slate-800/50">
                  <div className="flex items-center gap-3">
                    <div className="w-10 h-10 rounded-2xl bg-purple-600 text-white flex items-center justify-center font-extrabold text-lg">➕</div>
                    <div><h3 className="text-base font-extrabold text-slate-900 dark:text-white">Principal Student Admission Wizard</h3><p className="text-xs text-slate-400">11-Category Registration Form</p></div>
                  </div>
                  <button onClick={() => setShowAdmissionModal(false)} className="p-2 rounded-xl text-slate-400">✕</button>
                </div>
                <form onSubmit={handleAddStudentSubmit} className="p-6 flex-1 overflow-y-auto space-y-4 text-xs">
                  <p className="font-bold text-purple-600">Principal Authorized Admission Active</p>
                  <button type="submit" className="px-6 py-2.5 rounded-xl bg-emerald-600 text-white font-bold">✓ Submit Enrollment</button>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
