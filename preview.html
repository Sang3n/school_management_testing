        const isCurrentlyBlocked = studentToToggle.status === 'BLOCKED';

                          <input type="text" value={studentForm.route} onChange={(e) => setStudentForm({ ...studentForm, route: e.target.value })} className="mt-1 w-full px-3.5 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white" />
                        </div>
                      </div>
                    </div>
                  )}

                  {/* STEP 8: Hostel Info */}
                  {admissionStep === 8 && (
                    <div className="space-y-4">
                      <h4 className="font-extrabold text-purple-600 dark:text-purple-400 uppercase tracking-wider">8. Hostel Allocation</h4>
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                          <label className="font-bold text-slate-700 dark:text-slate-300">Hostel Required?</label>
                          <select value={studentForm.hostelRequired} onChange={(e) => setStudentForm({ ...studentForm, hostelRequired: e.target.value })} className="mt-1 w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white">
                            <option value="No">No</option><option value="Yes">Yes</option>
                          </select>
                        </div>
                        <div>
                          <label className="font-bold text-slate-700 dark:text-slate-300">Room Number</label>
                          <input type="text" value={studentForm.roomNumber} onChange={(e) => setStudentForm({ ...studentForm, roomNumber: e.target.value })} className="mt-1 w-full px-3.5 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white" />
                        </div>
                      </div>
                    </div>
                  )}

                  {/* STEP 9: Fee & Payment */}
                  {admissionStep === 9 && (
                    <div className="space-y-4">
                      <h4 className="font-extrabold text-purple-600 dark:text-purple-400 uppercase tracking-wider">9. Fee & Payment Ledger Setup</h4>
                      <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                        <div>
                          <label className="font-bold text-slate-700 dark:text-slate-300">Admission Fee</label>
                          <input type="text" value={studentForm.admissionFee} onChange={(e) => setStudentForm({ ...studentForm, admissionFee: e.target.value })} className="mt-1 w-full px-3.5 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white font-bold" />
                        </div>
                        <div>
                          <label className="font-bold text-slate-700 dark:text-slate-300">Monthly Plan</label>
                          <input type="text" value={studentForm.monthlyFeePlan} onChange={(e) => setStudentForm({ ...studentForm, monthlyFeePlan: e.target.value })} className="mt-1 w-full px-3.5 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white" />
                        </div>
                        <div>
                          <label className="font-bold text-slate-700 dark:text-slate-300">Payment Status</label>
                          <select value={studentForm.feeStatus} onChange={(e) => setStudentForm({ ...studentForm, feeStatus: e.target.value })} className="mt-1 w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white font-bold">
                            <option value="PAID">PAID</option><option value="UNPAID">UNPAID</option><option value="PARTIAL">PARTIAL</option>
                          </select>
                        </div>
                      </div>
                    </div>
                  )}

                  {/* STEP 10: Documents */}
                  {admissionStep === 10 && (
                    <div className="space-y-4">
                      <h4 className="font-extrabold text-purple-600 dark:text-purple-400 uppercase tracking-wider">10. Document Upload Checklist</h4>
                      <div className="grid grid-cols-2 sm:grid-cols-3 gap-3">
                        {['Photo Uploaded', 'Birth Certificate', 'Transfer Certificate', 'Mark Sheet', 'Character Certificate', 'Parent Citizenship'].map((doc, idx) => (
                          <div key={idx} className="p-3 bg-slate-50 dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 flex items-center justify-between">
                            <span className="font-semibold text-slate-700 dark:text-slate-300">{doc}</span>
                            <span className="text-emerald-500 font-bold">✓ Attached</span>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}

                  {/* STEP 11: Portal Account */}
                  {admissionStep === 11 && (
                    <div className="space-y-4">
                      <h4 className="font-extrabold text-purple-600 dark:text-purple-400 uppercase tracking-wider">11. Student Portal Credentials</h4>
                      <div className="p-4 bg-purple-50 dark:bg-purple-950/60 rounded-2xl border border-purple-200 space-y-2">
                        <p className="font-bold text-purple-900 dark:text-purple-200">Generated Temp Password: <code className="bg-purple-200 dark:bg-purple-800 px-2 py-0.5 rounded text-purple-950 dark:text-white font-mono">{studentForm.tempPassword}</code></p>
                        <p className="text-purple-700 dark:text-purple-300">✓ SMS Credentials Notice will be dispatched automatically upon submission.</p>
                      </div>
                    </div>
                  )}

                  {/* Bottom Navigation & Submit Actions */}
                  <div className="pt-4 border-t border-slate-200 dark:border-slate-800 flex items-center justify-between">
                    <div>
                      {admissionStep > 1 && (
                        <button type="button" onClick={() => setAdmissionStep(admissionStep - 1)} className="px-4 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 font-bold">
                          ◀ Previous
                        </button>
                      )}
                    </div>
                    <div className="flex items-center gap-3">
                      {admissionStep < 11 ? (
                        <button type="button" onClick={() => setAdmissionStep(admissionStep + 1)} className="px-5 py-2.5 rounded-xl bg-purple-600 text-white font-bold shadow-md">
                          Next Step ({admissionStep + 1}/11) ▶
                        </button>
                      ) : (
                        <button type="submit" className="px-6 py-2.5 rounded-xl bg-emerald-600 text-white font-extrabold shadow-lg hover:bg-emerald-700">
                          ✓ Submit Enrollment & Generate Invoices
                        </button>
                      )}
                    </div>
                  </div>

                </form>
              </div>
            </div>
          )}

          {/* ADD TEACHER MODAL */}
          {showAddTeacherModal && (
            <div className="fixed inset-0 bg-slate-900/70 backdrop-blur-sm flex items-center justify-center z-50 p-4">
              <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl max-w-lg w-full p-6 space-y-5 shadow-2xl">
                <div className="flex items-center justify-between border-b border-slate-200 dark:border-slate-800 pb-3">
                  <div className="flex items-center gap-2.5">
                    <span className="text-2xl">👨‍🏫</span>
                    <h3 className="text-base font-extrabold text-slate-900 dark:text-white">Register New Faculty Teacher</h3>
                  </div>
                  <button onClick={() => setShowAddTeacherModal(false)} className="p-1 rounded-lg text-slate-400 font-bold">✕</button>
                </div>

                <form onSubmit={handleAddTeacherSubmit} className="space-y-4 text-xs">
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="font-bold text-slate-700 dark:text-slate-300">First Name *</label>
                      <input type="text" required value={teacherForm.firstName} onChange={(e) => setTeacherForm({ ...teacherForm, firstName: e.target.value })} className="mt-1 w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white" placeholder="e.g. Ramesh" />
                    </div>
                    <div>
                      <label className="font-bold text-slate-700 dark:text-slate-300">Last Name *</label>
                      <input type="text" required value={teacherForm.lastName} onChange={(e) => setTeacherForm({ ...teacherForm, lastName: e.target.value })} className="mt-1 w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white" placeholder="e.g. Adhikari" />
                    </div>
                  </div>

                  <div>
                    <label className="font-bold text-slate-700 dark:text-slate-300">Primary Subject / Specialty</label>
                    <select value={teacherForm.subject} onChange={(e) => setTeacherForm({ ...teacherForm, subject: e.target.value })} className="mt-1 w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white font-bold">
                      <option value="Mathematics">Mathematics</option>
                      <option value="Physics">Physics</option>
                      <option value="Chemistry">Chemistry</option>
                      <option value="Biology">Biology</option>
                      <option value="English Literature">English Literature</option>
                      <option value="Computer Science">Computer Science</option>
                      <option value="Social Studies">Social Studies</option>
                    </select>
                  </div>

                  <div>
                    <label className="font-bold text-slate-700 dark:text-slate-300">Qualification</label>
                    <input type="text" value={teacherForm.qualification} onChange={(e) => setTeacherForm({ ...teacherForm, qualification: e.target.value })} className="mt-1 w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white" placeholder="e.g. M.Sc. Physics / B.Ed" />
                  </div>

                  <div>
                    <label className="font-bold text-slate-700 dark:text-slate-300">Mobile Phone</label>
                    <input type="text" value={teacherForm.phone} onChange={(e) => setTeacherForm({ ...teacherForm, phone: e.target.value })} className="mt-1 w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white" />
                  </div>

                  <div className="pt-3 flex justify-end gap-2">
                    <button type="button" onClick={() => setShowAddTeacherModal(false)} className="px-4 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 font-bold">Cancel</button>
                    <button type="submit" className="px-5 py-2 rounded-xl bg-indigo-600 text-white font-extrabold shadow-md">✓ Register Teacher</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* ADD OTHER ROLE MODAL */}
          {showAddOtherModal && (
            <div className="fixed inset-0 bg-slate-900/70 backdrop-blur-sm flex items-center justify-center z-50 p-4">
              <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl max-w-lg w-full p-6 space-y-5 shadow-2xl">
                <div className="flex items-center justify-between border-b border-slate-200 dark:border-slate-800 pb-3">
                  <div className="flex items-center gap-2.5">
                    <span className="text-2xl">👤</span>
                    <h3 className="text-base font-extrabold text-slate-900 dark:text-white">Register Staff / Other Roles</h3>
                  </div>
                  <button onClick={() => setShowAddOtherModal(false)} className="p-1 rounded-lg text-slate-400 font-bold">✕</button>
                </div>

                <form onSubmit={handleAddOtherSubmit} className="space-y-4 text-xs">
                  <div>
                    <label className="font-bold text-slate-700 dark:text-slate-300">Role Designation</label>
                    <select value={otherForm.role} onChange={(e) => setOtherForm({ ...otherForm, role: e.target.value })} className="mt-1 w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white font-bold">
                      <option value="LIBRARIAN">Librarian</option>
                      <option value="RECEPTIONIST">Receptionist</option>
                      <option value="ACCOUNTANT">Accountant</option>
                      <option value="HOSTEL_WARDEN">Hostel Warden</option>
                      <option value="TRANSPORT_DRIVER">Transport Driver</option>
                      <option value="PARENT">Parent Account</option>
                    </select>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="font-bold text-slate-700 dark:text-slate-300">First Name *</label>
                      <input type="text" required value={otherForm.firstName} onChange={(e) => setOtherForm({ ...otherForm, firstName: e.target.value })} className="mt-1 w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white" placeholder="First name" />
                    </div>
                    <div>
                      <label className="font-bold text-slate-700 dark:text-slate-300">Last Name *</label>
                      <input type="text" required value={otherForm.lastName} onChange={(e) => setOtherForm({ ...otherForm, lastName: e.target.value })} className="mt-1 w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white" placeholder="Last name" />
                    </div>
                  </div>

                  <div>
                    <label className="font-bold text-slate-700 dark:text-slate-300">Mobile Contact</label>
                    <input type="text" value={otherForm.phone} onChange={(e) => setOtherForm({ ...otherForm, phone: e.target.value })} className="mt-1 w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white" />
                  </div>

                  <div className="pt-3 flex justify-end gap-2">
                    <button type="button" onClick={() => setShowAddOtherModal(false)} className="px-4 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 font-bold">Cancel</button>
                    <button type="submit" className="px-5 py-2 rounded-xl bg-emerald-600 text-white font-extrabold shadow-md">✓ Register User</button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
