<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pathaibhara - Multi-Role Educational Management Portal</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 50: '#eef2ff', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca', 900: '#1e1b4b' }
          }
        }
      }
    }
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- React 18 & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body { font-family: 'Inter', sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 9999px; }
    .dark ::-webkit-scrollbar-thumb { background: #334155; }
    @keyframes ticker {
      0% { transform: translateX(100%); }
      100% { transform: translateX(-100%); }
    }
    .animate-ticker {
      display: inline-block;
      white-space: nowrap;
      animation: ticker 25s linear infinite;
    }
  </style>
</head>
<body class="bg-slate-100 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen transition-colors duration-200">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const ROLE_USER_PROFILES = {
      SUPER_ADMIN: { name: 'Alexander Vance', email: 'superadmin@sms.edu', avatar: '👑', color: 'indigo' },
      SCHOOL_ADMIN: { name: 'Sarah Jenkins', email: 'admin@sms.edu', avatar: '🛡️', color: 'indigo' },
      PRINCIPAL: { name: 'Dr. Robert Langdon', email: 'principal@sms.edu', avatar: '🎓', color: 'purple' },
      VICE_PRINCIPAL: { name: 'Elena Rostova', email: 'viceprincipal@sms.edu', avatar: '⚖️', color: 'amber' },
      ACCOUNTANT: { name: 'Marcus Goldman', email: 'accountant@sms.edu', avatar: '💵', color: 'emerald' },
      TEACHER: { name: 'Emily Watson', email: 'teacher@sms.edu', avatar: '👩‍🏫', color: 'blue' },
      LIBRARIAN: { name: 'Arthur Pendelton', email: 'librarian@sms.edu', avatar: '📚', color: 'cyan' },
      RECEPTIONIST: { name: 'Clara Oswald', email: 'receptionist@sms.edu', avatar: '🏢', color: 'rose' },
      STUDENT: { name: 'Ethan Hunt', email: 'student@sms.edu', avatar: '🎒', color: 'teal' },
      PARENT: { name: 'Jonathan Hunt', email: 'parent@sms.edu', avatar: '👨‍👩‍👧', color: 'violet' },
    };

    const ROLES = [
      { code: 'SUPER_ADMIN', name: 'Super Admin' },
      { code: 'SCHOOL_ADMIN', name: 'School Admin' },
      { code: 'PRINCIPAL', name: 'Principal' },
      { code: 'VICE_PRINCIPAL', name: 'Vice Principal' },
      { code: 'ACCOUNTANT', name: 'Accountant' },
      { code: 'TEACHER', name: 'Teacher' },
      { code: 'LIBRARIAN', name: 'Librarian' },
      { code: 'RECEPTIONIST', name: 'Receptionist' },
      { code: 'STUDENT', name: 'Student' },
      { code: 'PARENT', name: 'Parent' },
    ];

    const INITIAL_STUDENTS = [
      { id: 's1', name: 'Ethan Hunt', email: 'ethan@sms.edu', roll: '1001', admission: 'ADM-10045', class: 'Class 10-A', house: 'Red House', status: 'ACTIVE', allergies: 'Peanuts', emergency: '+1 555-999-8888' },
      { id: 's2', name: 'Sophia Miller', email: 'sophia@sms.edu', roll: '1002', admission: 'ADM-10046', class: 'Class 10-A', house: 'Green House', status: 'ACTIVE', allergies: 'None', emergency: '+1 555-888-7777' },
      { id: 's3', name: 'Lucas Davis', email: 'lucas@sms.edu', roll: '1003', admission: 'ADM-10047', class: 'Class 9-B', house: 'Blue House', status: 'ACTIVE', allergies: 'Penicillin', emergency: '+1 555-777-6666' },
      { id: 's4', name: 'Emma Watson', email: 'emma@sms.edu', roll: '1004', admission: 'ADM-10048', class: 'Class 8-A', house: 'Yellow House', status: 'ACTIVE', allergies: 'Pollen', emergency: '+1 555-666-5555' },
    ];

    const INITIAL_INVOICES = [
      { id: 'INV-2026-001', studentName: 'Ethan Hunt', studentId: 'STU-10045', class: 'Class 10-A', category: 'Tuition & Lab Fee', amount: '$450', status: 'PAID', dueDate: '2026-08-10', method: 'Online Transfer' },
      { id: 'INV-2026-002', studentName: 'Sophia Miller', studentId: 'STU-10046', class: 'Class 10-A', category: 'Monthly Fee', amount: '$250', status: 'UNPAID', dueDate: '2026-08-05', method: 'Pending' },
      { id: 'INV-2026-003', studentName: 'Lucas Davis', studentId: 'STU-10047', class: 'Class 9-B', category: 'Transport & Hostel', amount: '$600', status: 'OVERDUE', dueDate: '2026-07-28', method: 'Pending' },
    ];

    function App() {
      const [currentRole, setCurrentRole] = useState('SUPER_ADMIN'); // Default to Super Admin so all switchers work!
      const [currentTab, setCurrentTab] = useState('dashboard');
      const [academicYear, setAcademicYear] = useState('2025-2026');
      const [isDark, setIsDark] = useState(false);
      const [showRoleDropdown, setShowRoleDropdown] = useState(false);
      const [students, setStudents] = useState(INITIAL_STUDENTS);
      const [invoices, setInvoices] = useState(INITIAL_INVOICES);
      const [search, setSearch] = useState('');
      const [showAdmissionModal, setShowAdmissionModal] = useState(false);
      const [viewStudent, setViewStudent] = useState(null);
      const [notification, setNotification] = useState(null);
      const [sidebarCollapsed, setSidebarCollapsed] = useState(false);

      const chartRefPrincipalAtt = useRef(null);
      const chartRefPrincipalFee = useRef(null);
      const chartRefAccountantRev = useRef(null);

      const currentUser = ROLE_USER_PROFILES[currentRole] || ROLE_USER_PROFILES.SUPER_ADMIN;

      // ROLE PERMISSION LOGIC
      const IS_PRINCIPAL_EXECUTIVE = ['SUPER_ADMIN', 'SCHOOL_ADMIN', 'PRINCIPAL'].includes(currentRole);
      const IS_VICE_PRINCIPAL = currentRole === 'VICE_PRINCIPAL';
      const IS_ACCOUNTANT = currentRole === 'ACCOUNTANT';
      const IS_TEACHER = currentRole === 'TEACHER';
      const CAN_ADMIT_STUDENTS = ['SUPER_ADMIN', 'SCHOOL_ADMIN', 'PRINCIPAL', 'VICE_PRINCIPAL'].includes(currentRole);

      useEffect(() => {
        if (isDark) document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
      }, [isDark]);

      // Initialize Charts dynamically depending on current active role dashboard
      useEffect(() => {
        if (currentTab === 'dashboard' && window.Chart) {
          if (IS_PRINCIPAL_EXECUTIVE) {
            const ctxA = document.getElementById('attendanceDonutChart');
            if (ctxA) {
              if (chartRefPrincipalAtt.current) chartRefPrincipalAtt.current.destroy();
              chartRefPrincipalAtt.current = new Chart(ctxA, {
                type: 'doughnut',
                data: {
                  labels: ['Present (94%)', 'Absent (3%)', 'On Leave (2%)', 'Late (1%)'],
                  datasets: [{ data: [94, 3, 2, 1], backgroundColor: ['#10b981', '#f43f5e', '#3b82f6', '#f59e0b'], borderWidth: 0 }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } }
              });
            }

            const ctxF = document.getElementById('feeBarChart');
            if (ctxF) {
              if (chartRefPrincipalFee.current) chartRefPrincipalFee.current.destroy();
              chartRefPrincipalFee.current = new Chart(ctxF, {
                type: 'bar',
                data: {
                  labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun'],
                  datasets: [
                    { label: 'Collected Fees ($)', data: [45000, 52000, 48000, 61000, 68000, 64000], backgroundColor: '#4f46e5', borderRadius: 8 },
                    { label: 'Pending Dues ($)', data: [8000, 6000, 9500, 4000, 3000, 5200], backgroundColor: '#f43f5e', borderRadius: 8 }
                  ]
                },
                options: { responsive: true, maintainAspectRatio: false }
              });
            }
          } else if (IS_ACCOUNTANT) {
            const ctxR = document.getElementById('accountantRevenueChart');
            if (ctxR) {
              if (chartRefAccountantRev.current) chartRefAccountantRev.current.destroy();
              chartRefAccountantRev.current = new Chart(ctxR, {
                type: 'bar',
                data: {
                  labels: ['Tuition', 'Admission', 'Transport', 'Hostel', 'Exam', 'Misc'],
                  datasets: [
                    { label: 'Collected Revenue ($)', data: [45000, 15000, 12000, 18000, 9500, 4200], backgroundColor: '#10b981', borderRadius: 8 },
                    { label: 'Outstanding Dues ($)', data: [3200, 0, 1400, 2100, 800, 300], backgroundColor: '#f43f5e', borderRadius: 8 }
                  ]
                },
                options: { responsive: true, maintainAspectRatio: false }
              });
            }
          }
        }
      }, [currentTab, currentRole, isDark]);

      const notify = (msg) => {
        setNotification(msg);
        setTimeout(() => setNotification(null), 3000);
      };

      const handleAddStudentSubmit = (e) => {
        e.preventDefault();
        const fullName = `${studentForm.firstName} ${studentForm.middleName ? studentForm.middleName + ' ' : ''}${studentForm.lastName}`.trim() || 'New Student';
        const newEntry = {
          id: 's-' + Date.now(),
          name: fullName,
          email: studentForm.email || `${(studentForm.firstName || 'student').toLowerCase()}@sms.edu`,
          roll: studentForm.rollNo,
          admission: studentForm.admissionNo,
          class: `${studentForm.classCode}-${studentForm.section}`,
          house: `${studentForm.house} House`,
          status: 'ACTIVE',
          allergies: studentForm.allergies,
          emergency: studentForm.emergencyPhone,
        };
        setStudents([newEntry, ...students]);
        setShowAdmissionModal(false);
        setAdmissionStep(1);
        notify(`🎉 Student "${fullName}" Successfully Enrolled!`);
      };

      return (
        <div className="flex flex-col min-h-screen bg-slate-100 dark:bg-slate-950 text-slate-900 dark:text-slate-100 transition-colors duration-200">
          
          {/* ANNOUNCEMENT & ROLE TICKER */}
          <div className="bg-indigo-900 text-white text-xs px-6 py-1.5 flex items-center justify-between overflow-hidden shadow-inner">
            <div className="flex items-center gap-3 shrink-0">
              <span className="font-extrabold bg-rose-600 px-2 py-0.5 rounded uppercase tracking-wider text-[10px]">PATHAIBHARA SMS</span>
              <span className="font-medium text-indigo-200">ACTIVE ROLE CONTEXT: {currentRole} ({currentUser.name})</span>
            </div>
            <div className="overflow-hidden w-1/2 relative hidden sm:block">
              <span className="animate-ticker font-semibold text-indigo-100">
                📢 Fully Dynamic Portal Active • Switch between all 10 roles (Super Admin, Admin, Principal, VP, Accountant, Teacher, Student, Parent, Librarian, Receptionist).
              </span>
            </div>
          </div>

          <div className="flex flex-1 min-h-0">
            {/* DYNAMIC SIDEBAR */}
            <aside className={`${sidebarCollapsed ? 'w-20' : 'w-64'} bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 flex flex-col justify-between sticky top-0 z-30 transition-all duration-300 shadow-sm`}>
              <div>
                <div 
                  onClick={() => setCurrentTab('dashboard')} 
                  className="h-16 flex items-center px-5 border-b border-slate-200 dark:border-slate-800 gap-3 cursor-pointer hover:opacity-85 transition-opacity"
                >
                  <div className="w-9 h-9 rounded-xl bg-gradient-to-tr from-rose-500 to-indigo-600 flex items-center justify-center text-white shadow-md font-extrabold text-lg shrink-0">
                    🏫
                  </div>
                  {!sidebarCollapsed && (
                    <span className="font-extrabold text-lg text-slate-900 dark:text-white tracking-tight">
                      <span className="text-rose-600 dark:text-rose-400">Pathaibhara</span>
                    </span>
                  )}
                </div>

                {!sidebarCollapsed && (
                  <div className="px-4 py-3 mx-3 my-3 bg-indigo-50 dark:bg-indigo-950/50 rounded-2xl border border-indigo-100 dark:border-indigo-900/60 flex items-center justify-between">
                    <div className="flex items-center gap-2.5 overflow-hidden">
                      <span className="text-lg shrink-0">{currentUser.avatar}</span>
                      <div className="overflow-hidden">
                        <p className="text-[10px] text-indigo-600 dark:text-indigo-400 uppercase font-bold tracking-wider">Active Role</p>
                        <p className="text-xs font-extrabold text-slate-900 dark:text-slate-100 truncate">{currentRole.replace('_', ' ')}</p>
                      </div>
                    </div>
                  </div>
                )}

                <nav className="px-3 py-2 space-y-1 max-h-[calc(100vh-190px)] overflow-y-auto">
                  <button onClick={() => setCurrentTab('dashboard')} className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-bold ${currentTab === 'dashboard' ? 'bg-indigo-600 text-white' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100'}`}>
                    <span>📊</span>{!sidebarCollapsed && <span>Dashboard Overview</span>}
                  </button>

                  <button onClick={() => setCurrentTab('students')} className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-bold ${currentTab === 'students' ? 'bg-indigo-600 text-white' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100'}`}>
                    <span>🎓</span>{!sidebarCollapsed && <span>Students & Directory</span>}
                  </button>

                  {IS_ACCOUNTANT && (
                    <button onClick={() => setCurrentTab('invoices')} className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-bold ${currentTab === 'invoices' ? 'bg-emerald-600 text-white' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100'}`}>
                      <span>💵</span>{!sidebarCollapsed && <span>Fee Collection & Invoices</span>}
                    </button>
                  )}

                  <button onClick={() => setCurrentTab('users')} className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-bold ${currentTab === 'users' ? 'bg-indigo-600 text-white' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100'}`}>
                    <span>🔑</span>{!sidebarCollapsed && <span>User Directory (All 10 Roles)</span>}
                  </button>
                </nav>
              </div>

              <div className="p-4 border-t border-slate-200 dark:border-slate-800 flex items-center justify-between">
                {!sidebarCollapsed && <p className="text-[11px] text-slate-400 font-semibold">v2.5 Full Multi-Role</p>}
                <button onClick={() => setSidebarCollapsed(!sidebarCollapsed)} className="p-1.5 rounded-lg bg-slate-100 dark:bg-slate-800 text-xs font-bold">
                  {sidebarCollapsed ? '➔' : '◀'}
                </button>
              </div>
            </aside>

            {/* MAIN WORKSPACE */}
            <div className="flex-1 flex flex-col min-w-0">
              
              <header className="h-16 bg-white/90 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 sticky top-0 z-20 px-6 flex items-center justify-between shadow-xs">
                <div className="flex items-center gap-4">
                  <div className="flex items-center gap-2">
                    <div className="w-8 h-8 rounded-lg bg-indigo-100 dark:bg-indigo-950 flex items-center justify-center font-bold text-sm">
                      {currentUser.avatar}
                    </div>
                    <h1 className="text-base font-extrabold text-slate-900 dark:text-white tracking-tight capitalize">
                      {currentRole.replace('_', ' ')} Dashboard
                    </h1>
                  </div>

                  <select value={academicYear} onChange={(e) => setAcademicYear(e.target.value)} className="px-3 py-1 text-xs rounded-xl bg-indigo-50 dark:bg-indigo-950 text-indigo-700 dark:text-indigo-300 font-extrabold border border-indigo-200">
                    <option value="2025-2026">Academic Year: 2025-2026</option>
                    <option value="2026-2027">Academic Year: 2026-2027</option>
                  </select>
                </div>

                <div className="flex items-center gap-3">
                  {/* ✨ ROLE SWITCHER DROPDOWN */}
                  <div className="relative">
                    <button onClick={() => setShowRoleDropdown(!showRoleDropdown)} className="flex items-center gap-2 px-3.5 py-1.5 rounded-xl bg-gradient-to-r from-indigo-600 to-purple-600 text-white text-xs font-extrabold shadow-md">
                      <span>✨ Switch Portal Role: {currentRole}</span>
                      <span>▼</span>
                    </button>
                    {showRoleDropdown && (
                      <div className="absolute right-0 mt-2 w-64 bg-white dark:bg-slate-800 rounded-2xl shadow-2xl border border-slate-200 dark:border-slate-700 py-2 z-50">
                        <div className="px-3.5 py-1.5 border-b border-slate-100 dark:border-slate-700 flex justify-between items-center">
                          <span className="text-[10px] uppercase font-extrabold text-slate-400">Select 1 of 10 Roles</span>
                        </div>
                        <div className="max-h-72 overflow-y-auto">
                          {ROLES.map((r) => (
                            <button
                              key={r.code}
                              onClick={() => { setCurrentRole(r.code); setShowRoleDropdown(false); notify(`Switched Portal Context to ${r.name}`); }}
                              className={`w-full text-left px-3.5 py-2 text-xs font-medium flex items-center justify-between hover:bg-slate-100 dark:hover:bg-slate-700 ${currentRole === r.code ? 'text-indigo-600 dark:text-indigo-400 font-bold bg-indigo-50 dark:bg-slate-700/50' : 'text-slate-700 dark:text-slate-300'}`}
                            >
                              <span>{ROLE_USER_PROFILES[r.code].avatar} {r.name}</span>
                              {currentRole === r.code && <span>✓ Active</span>}
                            </button>
                          ))}
                        </div>
                      </div>
                    )}
                  </div>

                  <button onClick={() => setIsDark(!isDark)} className="p-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-amber-500">
                    {isDark ? '☀️ Light' : '🌙 Dark'}
                  </button>

                  <div className="flex items-center gap-3 pl-3 border-l border-slate-200 dark:border-slate-800">
                    <div className="w-8 h-8 rounded-full bg-indigo-600 flex items-center justify-center font-bold text-xs text-white">
                      {currentUser.avatar}
                    </div>
                    <div className="hidden md:block">
                      <p className="text-xs font-bold text-slate-900 dark:text-slate-100">{currentUser.name}</p>
                      <p className="text-[10px] text-slate-400">{currentUser.email}</p>
                    </div>
                  </div>
                </div>
              </header>

              <main className="p-8 max-w-7xl w-full mx-auto space-y-8">
                {notification && (
                  <div className="p-3.5 rounded-2xl bg-indigo-50 dark:bg-indigo-950 border border-indigo-200 text-indigo-700 text-xs font-bold flex items-center gap-2">
                    <span>ℹ️</span> {notification}
                  </div>
                )}

                {currentTab === 'dashboard' && (
                  <div className="space-y-8">
                    
                    {/* 1. PRINCIPAL / SUPER ADMIN / SCHOOL ADMIN 15-ROW DASHBOARD */}
                    {IS_PRINCIPAL_EXECUTIVE && (
                      <div className="space-y-6">
                        <div className="flex items-center justify-between">
                          <h2 className="text-xs font-extrabold uppercase tracking-wider text-slate-400">15-Row Executive Principal Dashboard</h2>
                          <span className="px-2.5 py-0.5 rounded-full bg-indigo-100 text-indigo-700 text-[10px] font-bold">👑 Executive Management Access</span>
                        </div>

                        {/* ROW 1: 8 CARDS */}
                        <div className="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-8 gap-3">
                          {[
                            { title: 'Total Students', val: '1,284', icon: '👨‍🎓' },
                            { title: 'Classes Assigned', val: '12', icon: '🏫' },
                            { title: 'Subjects', val: '4', icon: '📚' },
                            { title: 'Attendance Today', val: '96.4%', icon: '✅' },
                            { title: 'Pending Review', val: '14', icon: '📝' },
                            { title: 'Today\'s Classes', val: '3', icon: '📅' },
                            { title: 'Upcoming Exams', val: '3', icon: '🧪' },
                            { title: 'Unread Notifs', val: '5', icon: '🔔' },
                          ].map((c, i) => (
                            <div key={i} className="p-3.5 bg-white dark:bg-slate-900 border border-slate-200 rounded-2xl space-y-1">
                              <div className="flex justify-between text-[10px] text-slate-400"><span>{c.title}</span><span>{c.icon}</span></div>
                              <h3 className="text-xl font-extrabold text-slate-900 dark:text-white">{c.val}</h3>
                            </div>
                          ))}
                        </div>

                        {/* ROW 2: QUICK ACTIONS */}
                        <div className="p-5 bg-white dark:bg-slate-900 border border-slate-200 rounded-2xl space-y-3">
                          <h3 className="text-xs font-extrabold uppercase text-slate-500">Row 2 – Executive Quick Actions</h3>
                          <div className="flex flex-wrap items-center gap-2.5">
                            {CAN_ADMIT_STUDENTS && (
                              <button onClick={() => { setCurrentTab('students'); setShowAdmissionModal(true); }} className="px-3.5 py-1.5 rounded-xl bg-purple-50 text-purple-700 text-xs font-bold border border-purple-200">➕ Add Student</button>
                            )}
                            <button onClick={() => notify('Attendance Recorded')} className="px-3.5 py-1.5 rounded-xl bg-emerald-50 text-emerald-700 text-xs font-bold border border-emerald-200">✅ Take Attendance</button>
                            <button onClick={() => notify('Marks Entry')} className="px-3.5 py-1.5 rounded-xl bg-blue-50 text-blue-700 text-xs font-bold border border-blue-200">📝 Enter Marks</button>
                            <button onClick={() => notify('Assignment Created')} className="px-3.5 py-1.5 rounded-xl bg-indigo-50 text-indigo-700 text-xs font-bold border border-indigo-200">📚 Create Assignment</button>
                          </div>
                        </div>

                        {/* ROW 3 & 4: TIMETABLE & DONUT CHART */}
                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                          <div className="p-6 bg-white dark:bg-slate-900 border border-slate-200 rounded-2xl space-y-4">
                            <h3 className="text-sm font-extrabold text-slate-900 dark:text-white">📅 Today's Timetable Schedule</h3>
                            <table className="w-full text-left text-xs">
                              <thead className="bg-slate-50 text-slate-400 font-bold"><tr><th className="p-2">Time</th><th className="p-2">Class</th><th className="p-2">Subject</th><th className="p-2">Room</th></tr></thead>
                              <tbody>
                                <tr><td className="p-2 font-bold text-indigo-600">9:00 AM</td><td className="p-2 font-bold">Grade 10 A</td><td className="p-2">Mathematics</td><td className="p-2 font-bold text-emerald-600">Room 201</td></tr>
                                <tr><td className="p-2 font-bold text-indigo-600">10:00 AM</td><td className="p-2 font-bold">Grade 9 B</td><td className="p-2">Science</td><td className="p-2 font-bold text-emerald-600">Room 305</td></tr>
                              </tbody>
                            </table>
                          </div>
                          <div className="p-6 bg-white dark:bg-slate-900 border border-slate-200 rounded-2xl space-y-4">
                            <h3 className="text-sm font-extrabold text-slate-900 dark:text-white">✅ Institutional Attendance Donut</h3>
                            <div className="h-44 relative"><canvas id="attendanceDonutChart"></canvas></div>
                          </div>
                        </div>
                      </div>
                    )}

                    {/* 2. VICE PRINCIPAL DASHBOARD */}
                    {IS_VICE_PRINCIPAL && (
                      <div className="space-y-6">
                        <div className="flex items-center justify-between">
                          <h2 className="text-xs font-extrabold uppercase tracking-wider text-slate-400">Vice Principal Academic & Supervision Dashboard</h2>
                          <span className="px-2.5 py-0.5 rounded-full bg-amber-100 text-amber-800 text-[10px] font-bold">⚖️ Vice Principal Context</span>
                        </div>

                        {/* 10 VP OVERVIEW CARDS */}
                        <div className="grid grid-cols-2 sm:grid-cols-5 lg:grid-cols-10 gap-2.5">
                          {[
                            { title: 'Total Students', val: '1,284', icon: '👨‍🎓' },
                            { title: 'Total Teachers', val: '86', icon: '👨‍🏫' },
                            { title: 'Classes Today', val: '12', icon: '🏫' },
                            { title: 'Attendance Today', val: '96.4%', icon: '✅' },
                            { title: 'Pending Attendance', val: '3 Classes', icon: '⏳' },
                            { title: 'Upcoming Exams', val: '3', icon: '🧪' },
                            { title: 'Pending Assignments', val: '14', icon: '📝' },
                            { title: 'Discipline Cases', val: '2 Active', icon: '⚖️' },
                            { title: 'New Admissions', val: '42', icon: '➕' },
                            { title: 'Notices', val: '5 Active', icon: '🔔' },
                          ].map((c, i) => (
                            <div key={i} className="p-3 bg-white dark:bg-slate-900 border border-slate-200 rounded-2xl space-y-1">
                              <div className="flex justify-between text-[10px] text-slate-400"><span>{c.title}</span><span>{c.icon}</span></div>
                              <h3 className="text-base font-extrabold text-slate-900 dark:text-white">{c.val}</h3>
                            </div>
                          ))}
                        </div>

                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                          <div className="p-6 bg-white dark:bg-slate-900 border border-slate-200 rounded-2xl space-y-3">
                            <h3 className="text-sm font-bold text-slate-900 dark:text-white">👨‍🏫 Teacher Supervision & Leave Approvals</h3>
                            <div className="p-3 bg-amber-50 rounded-xl flex justify-between items-center text-xs">
                              <div><p className="font-bold">Emily Watson (Mathematics)</p><p className="text-slate-500">Medical Leave Request (Aug 5 - Aug 7)</p></div>
                              <button onClick={() => notify('Approved Teacher Leave')} className="px-3 py-1 bg-emerald-600 text-white rounded-lg font-bold">Approve</button>
                            </div>
                          </div>
                          <div className="p-6 bg-white dark:bg-slate-900 border border-slate-200 rounded-2xl space-y-3">
                            <h3 className="text-sm font-bold text-slate-900 dark:text-white">⚖️ Student Discipline Cases</h3>
                            <div className="p-3 bg-rose-50 rounded-xl flex justify-between items-center text-xs">
                              <div><p className="font-bold text-rose-900">Lucas Davis (Grade 11-B)</p><p className="text-rose-700">Classroom Disturbance Logged</p></div>
                              <button onClick={() => notify('Counseling Session Scheduled')} className="px-3 py-1 bg-rose-600 text-white rounded-lg font-bold">Counseling</button>
                            </div>
                          </div>
                        </div>
                      </div>
                    )}

                    {/* 3. ACCOUNTANT DASHBOARD */}
                    {IS_ACCOUNTANT && (
                      <div className="space-y-6">
                        <div className="flex items-center justify-between">
                          <h2 className="text-xs font-extrabold uppercase tracking-wider text-slate-400">Accountant Financial Operations Dashboard</h2>
                          <span className="px-2.5 py-0.5 rounded-full bg-emerald-100 text-emerald-800 text-[10px] font-bold">💵 Financial Operations Context</span>
                        </div>

                        {/* 10 FINANCIAL CARDS */}
                        <div className="grid grid-cols-2 sm:grid-cols-5 lg:grid-cols-10 gap-2.5">
                          {[
                            { title: 'Today\'s Fee Collection', val: '$4,500', icon: '💰' },
                            { title: 'Monthly Revenue', val: '$64,000', icon: '📈' },
                            { title: 'Pending Fees', val: '$5,200', icon: '⏳' },
                            { title: 'Overdue Payments', val: '$1,800', icon: '🚨' },
                            { title: 'Total Students Paid', val: '1,210', icon: '👨‍🎓' },
                            { title: 'Students with Due', val: '38', icon: '🎒' },
                            { title: 'Scholarships Granted', val: '$12,000', icon: '🎓' },
                            { title: 'Discounts Applied', val: '$2,400', icon: '💸' },
                            { title: 'Refund Requests', val: '2 Pending', icon: '↩️' },
                            { title: 'Financial Notifs', val: '6 Deadlines', icon: '🔔' },
                          ].map((c, i) => (
                            <div key={i} className="p-3 bg-white dark:bg-slate-900 border border-slate-200 rounded-2xl space-y-1">
                              <div className="flex justify-between text-[10px] text-slate-400"><span>{c.title}</span><span>{c.icon}</span></div>
                              <h3 className="text-base font-extrabold text-slate-900 dark:text-white">{c.val}</h3>
                            </div>
                          ))}
                        </div>

                        {/* 8 ACCOUNTANT QUICK ACTIONS */}
                        <div className="p-5 bg-white dark:bg-slate-900 border border-slate-200 rounded-2xl space-y-3">
                          <h3 className="text-xs font-extrabold uppercase text-slate-500">Accountant Financial Quick Actions</h3>
                          <div className="flex flex-wrap items-center gap-2.5">
                            <button onClick={() => notify('Collect Fee Window Opened')} className="px-3.5 py-1.5 bg-emerald-600 text-white rounded-xl text-xs font-bold">➕ Collect Fee</button>
                            <button onClick={() => notify('Generating Invoice PDF...')} className="px-3.5 py-1.5 bg-indigo-600 text-white rounded-xl text-xs font-bold">📄 Generate Invoice</button>
                            <button onClick={() => notify('Printing Receipt...')} className="px-3.5 py-1.5 bg-blue-50 text-blue-700 rounded-xl text-xs font-bold border">Receipt</button>
                            <button onClick={() => notify('Scholarships Applied')} className="px-3.5 py-1.5 bg-purple-50 text-purple-700 rounded-xl text-xs font-bold border">Apply Scholarship</button>
                          </div>
                        </div>

                        <div className="h-56 p-6 bg-white dark:bg-slate-900 border border-slate-200 rounded-2xl relative">
                          <canvas id="accountantRevenueChart"></canvas>
                        </div>
                      </div>
                    )}

                    {/* 4. OTHER ROLES (TEACHER, STUDENT, PARENT, LIBRARIAN, RECEPTIONIST) */}
                    {!IS_PRINCIPAL_EXECUTIVE && !IS_VICE_PRINCIPAL && !IS_ACCOUNTANT && (
                      <div className="p-8 rounded-3xl bg-slate-900 text-white space-y-4 shadow-xl">
                        <div className="flex items-center gap-3">
                          <span className="text-4xl">{currentUser.avatar}</span>
                          <div>
                            <h2 className="text-2xl font-extrabold">{currentRole.replace('_', ' ')} Workspace</h2>
                            <p className="text-xs text-slate-400 mt-1">Logged in as {currentUser.name} ({currentUser.email})</p>
                          </div>
                        </div>
                        <p className="text-xs text-slate-300">Welcome to your role portal! Access your assigned daily rosters, schedules, and notifications above.</p>
                      </div>
                    )}

                  </div>
                )}

                {/* USER DIRECTORY TAB (ALL 10 ROLES SWITCHER) */}
                {currentTab === 'users' && (
                  <div className="space-y-6">
                    <div className="flex justify-between items-center">
                      <div>
                        <h2 className="text-xl font-bold text-slate-900 dark:text-white">System User Accounts & 10 Role Portals</h2>
                        <p className="text-xs text-slate-500">Directory of pre-seeded accounts</p>
                      </div>
                    </div>

                    <div className="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 overflow-hidden shadow-xs">
                      <table className="w-full text-left text-xs text-slate-700 dark:text-slate-300">
                        <thead className="bg-slate-50 dark:bg-slate-800 text-slate-400 font-bold border-b">
                          <tr><th className="p-3.5">User Profile</th><th className="p-3.5">Role</th><th className="p-3.5">Email</th><th className="p-3.5 text-right">Switch Portal Context</th></tr>
                        </thead>
                        <tbody className="divide-y divide-slate-100 dark:divide-slate-800 font-medium">
                          {ROLES.map((r) => {
                            const prof = ROLE_USER_PROFILES[r.code];
                            const isActive = currentRole === r.code;
                            return (
                              <tr key={r.code} className={`hover:bg-slate-50 ${isActive ? 'bg-indigo-50/50' : ''}`}>
                                <td className="p-3.5 font-bold text-slate-900 dark:text-white flex items-center gap-3">
                                  <span className="text-lg">{prof.avatar}</span> <span>{prof.name}</span>
                                </td>
                                <td className="p-3.5 font-semibold text-indigo-600">{r.name}</td>
                                <td className="p-3.5 font-mono text-[11px] text-slate-500">{prof.email}</td>
                                <td className="p-3.5 text-right">
                                  <button onClick={() => { setCurrentRole(r.code); setCurrentTab('dashboard'); notify(`Switched Context to ${r.name}`); }} className={`px-3.5 py-1 rounded-lg text-xs font-bold ${isActive ? 'bg-emerald-600 text-white' : 'bg-indigo-600 text-white hover:bg-indigo-700'}`}>
                                    {isActive ? '✓ Active Context' : `Switch to ${r.name}`}
                                  </button>
                                </td>
                              </tr>
                            );
                          })}
                        </tbody>
                      </table>
                    </div>
                  </div>
                )}

                {/* STUDENTS DIRECTORY TAB */}
                {currentTab === 'students' && (
                  <div className="space-y-6">
                    <div className="flex justify-between items-center">
                      <div>
                        <h2 className="text-xl font-bold text-slate-900 dark:text-white">Students Directory</h2>
                        <p className="text-xs text-slate-500">Pathaibhara Institutional Roster</p>
                      </div>
                      {CAN_ADMIT_STUDENTS && (
                        <button onClick={() => setShowAdmissionModal(true)} className="px-4 py-2 bg-indigo-600 text-white font-bold text-xs rounded-xl shadow-md">+ Add Student Details</button>
                      )}
                    </div>
                    <div className="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 overflow-hidden shadow-xs">
                      <table className="w-full text-left text-xs">
                        <thead className="bg-slate-50 text-slate-400 font-bold border-b">
                          <tr><th className="p-3">Name</th><th className="p-3">Class</th><th className="p-3">House</th><th className="p-3">Emergency</th></tr>
                        </thead>
                        <tbody className="divide-y divide-slate-100 font-medium">
                          {students.map(s => (
                            <tr key={s.id}>
                              <td className="p-3 font-bold text-slate-900 dark:text-white">{s.name}</td>
                              <td className="p-3 font-semibold text-indigo-600">{s.class}</td>
                              <td className="p-3"><span className="px-2.5 py-1 rounded-full text-[10px] font-bold bg-rose-100 text-rose-700">{s.house}</span></td>
                              <td className="p-3 text-rose-600 font-semibold">{s.emergency}</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>
                )}
              </main>

              <footer className="bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 px-8 py-3.5 flex flex-wrap items-center justify-between text-xs text-slate-500 font-semibold">
                <span>Pathaibhara SMS © 2026 • Multi-Role Context Enabled</span>
                <span className="text-[11px] text-indigo-600 font-bold">Active Role: {currentRole}</span>
              </footer>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
