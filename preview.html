<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pathaibhara - Accountant & Financial Operations Portal</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 50: '#eef2ff', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca', 900: '#1e1b4b' }
          }
        }
      }
    }
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- React 18 & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body { font-family: 'Inter', sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 9999px; }
    .dark ::-webkit-scrollbar-thumb { background: #334155; }
    @keyframes ticker {
      0% { transform: translateX(100%); }
      100% { transform: translateX(-100%); }
    }
    .animate-ticker {
      display: inline-block;
      white-space: nowrap;
      animation: ticker 25s linear infinite;
    }
  </style>
</head>
<body class="bg-slate-100 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen transition-colors duration-200">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const ROLE_USER_PROFILES = {
      SUPER_ADMIN: { name: 'Alexander Vance', email: 'superadmin@sms.edu', avatar: 'A' },
      SCHOOL_ADMIN: { name: 'Sarah Jenkins', email: 'admin@sms.edu', avatar: 'S' },
      PRINCIPAL: { name: 'Dr. Robert Langdon', email: 'principal@sms.edu', avatar: 'R' },
      VICE_PRINCIPAL: { name: 'Elena Rostova', email: 'viceprincipal@sms.edu', avatar: 'E' },
      ACCOUNTANT: { name: 'Marcus Goldman', email: 'accountant@sms.edu', avatar: 'M' },
      TEACHER: { name: 'Emily Watson', email: 'teacher@sms.edu', avatar: 'E' },
      LIBRARIAN: { name: 'Arthur Pendelton', email: 'librarian@sms.edu', avatar: 'A' },
      RECEPTIONIST: { name: 'Clara Oswald', email: 'receptionist@sms.edu', avatar: 'C' },
      STUDENT: { name: 'Ethan Hunt', email: 'student@sms.edu', avatar: 'E' },
      PARENT: { name: 'Jonathan Hunt', email: 'parent@sms.edu', avatar: 'J' },
    };

    const ROLES = [
      { code: 'SUPER_ADMIN', name: 'Super Admin' },
      { code: 'SCHOOL_ADMIN', name: 'School Admin' },
      { code: 'PRINCIPAL', name: 'Principal' },
      { code: 'VICE_PRINCIPAL', name: 'Vice Principal' },
      { code: 'ACCOUNTANT', name: 'Accountant' },
      { code: 'TEACHER', name: 'Teacher' },
      { code: 'LIBRARIAN', name: 'Librarian' },
      { code: 'RECEPTIONIST', name: 'Receptionist' },
      { code: 'STUDENT', name: 'Student' },
      { code: 'PARENT', name: 'Parent' },
    ];

    const INITIAL_INVOICES = [
      { id: 'INV-2026-001', studentName: 'Ethan Hunt', studentId: 'STU-10045', class: 'Class 10-A', category: 'Tuition & Lab Fee', amount: '$450', status: 'PAID', dueDate: '2026-08-10', method: 'Online Transfer' },
      { id: 'INV-2026-002', studentName: 'Sophia Miller', studentId: 'STU-10046', class: 'Class 10-A', category: 'Monthly Fee', amount: '$250', status: 'UNPAID', dueDate: '2026-08-05', method: 'Pending' },
      { id: 'INV-2026-003', studentName: 'Lucas Davis', studentId: 'STU-10047', class: 'Class 9-B', category: 'Transport & Hostel', amount: '$600', status: 'OVERDUE', dueDate: '2026-07-28', method: 'Pending' },
    ];

    function App() {
      const [currentRole, setCurrentRole] = useState('ACCOUNTANT'); // Default to Accountant Dashboard
      const [currentTab, setCurrentTab] = useState('dashboard');
      const [academicYear, setAcademicYear] = useState('2025-2026');
      const [isDark, setIsDark] = useState(false);
      const [showRoleDropdown, setShowRoleDropdown] = useState(false);
      const [invoices, setInvoices] = useState(INITIAL_INVOICES);
      const [search, setSearch] = useState('');
      const [notification, setNotification] = useState(null);
      const [sidebarCollapsed, setSidebarCollapsed] = useState(false);
      const [openSidebarCategory, setOpenSidebarCategory] = useState({ FeeCollection: true, FeeManagement: true, Invoices: true, Reports: true });

      const chartRefAccountant = useRef(null);

      const currentUser = ROLE_USER_PROFILES[currentRole] || ROLE_USER_PROFILES.ACCOUNTANT;

      // ROLE VISIBILITY RULE: Accountant Portal is accessible to Super Admin, School Admin, Principal, Vice Principal, and Accountant!
      const IS_ACCOUNTANT_ALLOWED = ['SUPER_ADMIN', 'SCHOOL_ADMIN', 'PRINCIPAL', 'VICE_PRINCIPAL', 'ACCOUNTANT'].includes(currentRole);

      // Student Admission permission rule (Accountant cannot admit students as per specification!)
      const CAN_ADMIT_STUDENTS = ['SUPER_ADMIN', 'SCHOOL_ADMIN', 'PRINCIPAL', 'VICE_PRINCIPAL'].includes(currentRole);

      // RECOMMENDED ACCOUNTANT SIDEBAR STRUCTURE
      const ACCOUNTANT_SIDEBAR = [
        { id: 'dashboard', label: 'Dashboard Overview', icon: '📊' },
        {
          group: 'Fee Collection', icon: '💰', subItems: [
            { id: 'collect_fees', label: 'Collect Fees' },
            { id: 'payment_history', label: 'Payment History' },
            { id: 'pending_payments', label: 'Pending Payments' },
            { id: 'overdue_payments', label: 'Overdue Payments' },
          ]
        },
        {
          group: 'Fee Management', icon: '⚙️', subItems: [
            { id: 'categories', label: 'Fee Categories' },
            { id: 'structure', label: 'Fee Structure' },
            { id: 'discounts', label: 'Discounts' },
            { id: 'scholarships', label: 'Scholarships' },
            { id: 'fines', label: 'Fines & Late Charges' },
          ]
        },
        {
          group: 'Invoices', icon: '📄', subItems: [
            { id: 'generate_invoice', label: 'Generate Invoice' },
            { id: 'invoice_history', label: 'Invoice History' },
          ]
        },
        { id: 'refunds', label: 'Refund Requests', icon: '↩️' },
        {
          group: 'Financial Reports', icon: '📈', subItems: [
            { id: 'daily_report', label: 'Daily Collection' },
            { id: 'monthly_revenue', label: 'Monthly Revenue' },
            { id: 'outstanding_report', label: 'Outstanding Fees' },
            { id: 'scholarship_report', label: 'Scholarship Report' },
          ]
        },
        { id: 'notifications', label: 'Payment Reminders', icon: '🔔' },
        { id: 'profile', label: 'Accountant Profile & 2FA', icon: '👤' },
      ];

      useEffect(() => {
        if (isDark) document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
      }, [isDark]);

      // Initialize Financial Revenue Bar Chart
      useEffect(() => {
        if (currentTab === 'dashboard' && IS_ACCOUNTANT_ALLOWED && window.Chart) {
          const ctxA = document.getElementById('accountantRevenueChart');
          if (ctxA) {
            if (chartRefAccountant.current) chartRefAccountant.current.destroy();
            chartRefAccountant.current = new Chart(ctxA, {
              type: 'bar',
              data: {
                labels: ['Tuition', 'Admission', 'Transport', 'Hostel', 'Exam', 'Misc'],
                datasets: [
                  { label: 'Collected Revenue ($)', data: [45000, 15000, 12000, 18000, 9500, 4200], backgroundColor: '#10b981', borderRadius: 8 },
                  { label: 'Outstanding Dues ($)', data: [3200, 0, 1400, 2100, 800, 300], backgroundColor: '#f43f5e', borderRadius: 8 }
                ]
              },
              options: { responsive: true, maintainAspectRatio: false }
            });
          }
        }
      }, [currentTab, currentRole, isDark]);

      const notify = (msg) => {
        setNotification(msg);
        setTimeout(() => setNotification(null), 3000);
      };

      return (
        <div className="flex flex-col min-h-screen bg-slate-100 dark:bg-slate-950 text-slate-900 dark:text-slate-100 transition-colors duration-200">
          
          {/* TOP FINANCIAL TICKER */}
          <div className="bg-emerald-950 text-white text-xs px-6 py-1.5 flex items-center justify-between overflow-hidden shadow-inner border-b border-emerald-800">
            <div className="flex items-center gap-3 shrink-0">
              <span className="font-extrabold bg-emerald-500 text-slate-950 px-2 py-0.5 rounded uppercase tracking-wider text-[10px]">FINANCIAL OPERATIONS</span>
              <span className="font-medium text-emerald-200">💵 Today's Fee Collection: $4,500 • Monthly Revenue: $64,000</span>
            </div>
            <div className="overflow-hidden w-1/2 relative hidden sm:block">
              <span className="animate-ticker font-semibold text-emerald-100">
                📢 Accountant Dashboard Active: Managing Fee Structures, Invoices, Receipts, Scholarships, Discounts & Payment Reminders.
              </span>
            </div>
          </div>

          <div className="flex flex-1 min-h-0">
            {/* ACCOUNTANT SIDEBAR */}
            <aside className={`${sidebarCollapsed ? 'w-20' : 'w-64'} bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 flex flex-col justify-between sticky top-0 z-30 transition-all duration-300 shadow-sm`}>
              <div>
                <div 
                  onClick={() => setCurrentTab('dashboard')} 
                  className="h-16 flex items-center px-5 border-b border-slate-200 dark:border-slate-800 gap-3 cursor-pointer hover:opacity-85 transition-opacity"
                >
                  <div className="w-9 h-9 rounded-xl bg-gradient-to-tr from-emerald-500 to-indigo-600 flex items-center justify-center text-white shadow-md font-extrabold text-lg shrink-0">
                    💵
                  </div>
                  {!sidebarCollapsed && (
                    <span className="font-extrabold text-lg text-slate-900 dark:text-white tracking-tight">
                      <span className="text-emerald-600 dark:text-emerald-400">Pathaibhara</span>
                    </span>
                  )}
                </div>

                {!sidebarCollapsed && (
                  <div className="px-4 py-3 mx-3 my-3 bg-emerald-50 dark:bg-emerald-950/50 rounded-2xl border border-emerald-200 dark:border-emerald-900/60 flex items-center justify-between">
                    <div className="flex items-center gap-2.5 overflow-hidden">
                      <span className="text-emerald-600 dark:text-emerald-400 text-sm shrink-0">💳</span>
                      <div className="overflow-hidden">
                        <p className="text-[10px] text-emerald-600 dark:text-emerald-400 uppercase font-bold tracking-wider">Active Context</p>
                        <p className="text-xs font-extrabold text-slate-900 dark:text-slate-100 truncate">{currentRole.replace('_', ' ')}</p>
                      </div>
                    </div>
                  </div>
                )}

                <nav className="px-3 py-2 space-y-1.5 max-h-[calc(100vh-190px)] overflow-y-auto">
                  {ACCOUNTANT_SIDEBAR.map((item, idx) => {
                    if (item.subItems) {
                      const isOpen = openSidebarCategory[item.group];
                      return (
                        <div key={idx} className="space-y-1">
                          <button
                            onClick={() => setOpenSidebarCategory({ ...openSidebarCategory, [item.group]: !isOpen })}
                            className="w-full flex items-center justify-between px-3.5 py-2 rounded-xl text-xs font-bold text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800"
                          >
                            <div className="flex items-center gap-3">
                              <span>{item.icon}</span>
                              {!sidebarCollapsed && <span>{item.group}</span>}
                            </div>
                            {!sidebarCollapsed && <span>{isOpen ? '▾' : '▸'}</span>}
                          </button>
                          {isOpen && !sidebarCollapsed && (
                            <div className="pl-8 space-y-1 border-l-2 border-slate-200 dark:border-slate-800 ml-4">
                              {item.subItems.map((sub) => (
                                <button
                                  key={sub.id}
                                  onClick={() => setCurrentTab(sub.id)}
                                  className={`w-full text-left px-3 py-1.5 rounded-lg text-xs font-semibold ${
                                    currentTab === sub.id ? 'bg-emerald-600 text-white font-bold' : 'text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-300'
                                  }`}
                                >
                                  • {sub.label}
                                </button>
                              ))}
                            </div>
                          )}
                        </div>
                      );
                    }
                    return (
                      <button
                        key={item.id}
                        onClick={() => setCurrentTab(item.id)}
                        className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-bold transition-all ${
                          currentTab === item.id ? 'bg-slate-700 dark:bg-emerald-600 text-white shadow-md' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800'
                        }`}
                      >
                        <span>{item.icon}</span>
                        {!sidebarCollapsed && <span>{item.label}</span>}
                      </button>
                    );
                  })}
                </nav>
              </div>

              <div className="p-4 border-t border-slate-200 dark:border-slate-800 flex items-center justify-between">
                {!sidebarCollapsed && <p className="text-[11px] text-slate-400 font-semibold">v2.5 Finance Edition</p>}
                <button onClick={() => setSidebarCollapsed(!sidebarCollapsed)} className="p-1.5 rounded-lg bg-slate-100 dark:bg-slate-800 text-xs font-bold">
                  {sidebarCollapsed ? '➔' : '◀'}
                </button>
              </div>
            </aside>

            {/* MAIN WORKSPACE AREA */}
            <div className="flex-1 flex flex-col min-w-0">
              
              <header className="h-16 bg-white/90 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 sticky top-0 z-20 px-6 flex items-center justify-between shadow-xs">
                <div className="flex items-center gap-4">
                  <div className="flex items-center gap-2">
                    <div className="w-8 h-8 rounded-lg bg-emerald-100 dark:bg-emerald-950 flex items-center justify-center font-bold text-emerald-700 text-sm">💵</div>
                    <h1 className="text-base font-extrabold text-slate-900 dark:text-white tracking-tight capitalize">
                      Accountant Financial Operations Portal
                    </h1>
                  </div>

                  <select 
                    value={academicYear} 
                    onChange={(e) => setAcademicYear(e.target.value)}
                    className="px-3 py-1 text-xs rounded-xl bg-emerald-50 dark:bg-emerald-950 text-emerald-700 dark:text-emerald-300 font-extrabold border border-emerald-200"
                  >
                    <option value="2025-2026">Financial Year: 2025-2026</option>
                    <option value="2026-2027">Financial Year: 2026-2027</option>
                  </select>
                </div>

                <div className="flex items-center gap-3">
                  {IS_ACCOUNTANT_ALLOWED && (
                    <div className="relative">
                      <button onClick={() => setShowRoleDropdown(!showRoleDropdown)} className="flex items-center gap-2 px-3 py-1.5 rounded-xl bg-emerald-50 dark:bg-emerald-950 text-emerald-700 dark:text-emerald-300 text-xs font-bold">
                        <span>✨ Switch Role: {currentRole}</span>
                        <span>▼</span>
                      </button>
                      {showRoleDropdown && (
                        <div className="absolute right-0 mt-2 w-56 bg-white dark:bg-slate-800 rounded-2xl shadow-2xl border border-slate-200 py-2 z-50">
                          {ROLES.map((r) => (
                            <button key={r.code} onClick={() => { setCurrentRole(r.code); setShowRoleDropdown(false); }} className="w-full text-left px-3.5 py-2 text-xs font-medium hover:bg-slate-100 dark:hover:bg-slate-700">
                              {r.name}
                            </button>
                          ))}
                        </div>
                      )}
                    </div>
                  )}

                  <button onClick={() => setIsDark(!isDark)} className="p-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-amber-500">
                    {isDark ? '☀️ Light' : '🌙 Dark'}
                  </button>

                  <div className="flex items-center gap-3 pl-3 border-l border-slate-200 dark:border-slate-800">
                    <div className="w-8 h-8 rounded-full bg-emerald-600 flex items-center justify-center font-bold text-xs text-white">
                      {currentUser.avatar}
                    </div>
                    <div className="hidden md:block">
                      <p className="text-xs font-bold text-slate-900 dark:text-slate-100">{currentUser.name}</p>
                      <p className="text-[10px] text-slate-400">{currentUser.email}</p>
                    </div>
                  </div>
                </div>
              </header>

              <main className="p-8 max-w-7xl w-full mx-auto space-y-8">
                {notification && (
                  <div className="p-3.5 rounded-2xl bg-emerald-50 dark:bg-emerald-950 border border-emerald-200 text-emerald-800 text-xs font-bold flex items-center gap-2">
                    <span>ℹ️</span> {notification}
                  </div>
                )}

                {currentTab === 'dashboard' && (
                  <div className="space-y-8">
                    
                    {/* ACCOUNTANT 10 OVERVIEW CARDS */}
                    <div>
                      <div className="flex items-center justify-between mb-3">
                        <h2 className="text-xs font-extrabold uppercase tracking-wider text-slate-400">Accountant Financial Overview Cards</h2>
                        <span className="px-2.5 py-0.5 rounded-full bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-300 text-[10px] font-extrabold">
                          💳 Financial Operations & Invoicing Scope Active
                        </span>
                      </div>

                      <div className="grid grid-cols-2 sm:grid-cols-5 lg:grid-cols-10 gap-2.5">
                        {[
                          { title: 'Today\'s Fee Collection', val: '$4,500', icon: '💰' },
                          { title: 'Monthly Revenue', val: '$64,000', icon: '📈' },
                          { title: 'Pending Fees', val: '$5,200', icon: '⏳' },
                          { title: 'Overdue Payments', val: '$1,800', icon: '🚨' },
                          { title: 'Total Students Paid', val: '1,210', icon: '👨‍🎓' },
                          { title: 'Students with Due', val: '38', icon: '🎒' },
                          { title: 'Scholarships Granted', val: '$12,000', icon: '🎓' },
                          { title: 'Discounts Applied', val: '$2,400', icon: '💸' },
                          { title: 'Refund Requests', val: '2 Pending', icon: '↩️' },
                          { title: 'Financial Notifs', val: '6 Deadlines', icon: '🔔' },
                        ].map((c, i) => (
                          <div key={i} className="p-3 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl shadow-xs space-y-1">
                            <div className="flex justify-between text-[10px] text-slate-400">
                              <span className="truncate">{c.title}</span>
                              <span>{c.icon}</span>
                            </div>
                            <h3 className="text-base font-extrabold text-slate-900 dark:text-white">{c.val}</h3>
                          </div>
                        ))}
                      </div>
                    </div>

                    {/* ACCOUNTANT 8 QUICK ACTIONS BAR */}
                    <div className="p-5 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl shadow-xs space-y-3">
                      <h3 className="text-xs font-extrabold uppercase tracking-wider text-slate-500">Accountant Financial Quick Actions & Actions Bar</h3>
                      <div className="flex flex-wrap items-center gap-2.5">
                        <button onClick={() => notify('Opening Fee Collection Window...')} className="px-3.5 py-1.5 rounded-xl bg-emerald-600 text-white text-xs font-bold shadow-md hover:bg-emerald-700">➕ Collect Fee</button>
                        <button onClick={() => notify('Generating Invoice PDF...')} className="px-3.5 py-1.5 rounded-xl bg-indigo-600 text-white text-xs font-bold shadow-md hover:bg-indigo-700">📄 Generate Invoice</button>
                        <button onClick={() => notify('Printing Receipt...')} className="px-3.5 py-1.5 rounded-xl bg-blue-50 text-blue-700 text-xs font-bold border border-blue-200">🧾 Print Receipt</button>
                        <button onClick={() => notify('Scholarship Management Form...')} className="px-3.5 py-1.5 rounded-xl bg-purple-50 text-purple-700 text-xs font-bold border border-purple-200">🎓 Apply Scholarship</button>
                        <button onClick={() => notify('Applying Sibling/Staff Discount...')} className="px-3.5 py-1.5 rounded-xl bg-amber-50 text-amber-700 text-xs font-bold border border-amber-200">💸 Apply Discount</button>
                        <button onClick={() => notify('Payment Reminders Dispatched via SMS!')} className="px-3.5 py-1.5 rounded-xl bg-rose-50 text-rose-700 text-xs font-bold border border-rose-200">🔔 Send Payment Reminder</button>
                        <button onClick={() => notify('Exporting Financial Report (PDF/Excel)...')} className="px-3.5 py-1.5 rounded-xl bg-cyan-50 text-cyan-700 text-xs font-bold border border-cyan-200">📊 Financial Report Export</button>
                        <button onClick={() => notify('Searching Student Fee Ledger...')} className="px-3.5 py-1.5 rounded-xl bg-slate-100 text-slate-700 text-xs font-bold border border-slate-300">🔍 Search Student Payments</button>
                      </div>
                    </div>

                    {/* REVENUE BREAKDOWN & INVOICE HISTORY */}
                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                      <div className="p-6 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl space-y-4 shadow-xs">
                        <div className="flex justify-between items-center border-b border-slate-100 pb-3">
                          <h3 className="text-sm font-extrabold text-slate-900 dark:text-white flex items-center gap-2">
                            <span>📈</span> Category-Wise Revenue Breakdown
                          </h3>
                        </div>
                        <div className="h-56 relative"><canvas id="accountantRevenueChart"></canvas></div>
                      </div>

                      <div className="p-6 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl space-y-4 shadow-xs">
                        <div className="flex justify-between items-center border-b border-slate-100 pb-3">
                          <h3 className="text-sm font-extrabold text-slate-900 dark:text-white flex items-center gap-2">
                            <span>📄</span> Recent Student Invoices & Payment Ledger
                          </h3>
                          <button onClick={() => notify('Viewing All Invoices')} className="text-xs font-bold text-emerald-600 hover:underline">View All →</button>
                        </div>
                        <table className="w-full text-left text-xs">
                          <thead className="bg-slate-50 dark:bg-slate-800 text-slate-400 font-bold">
                            <tr><th className="p-2.5">Invoice ID</th><th className="p-2.5">Student</th><th className="p-2.5">Category</th><th className="p-2.5">Amount</th><th className="p-2.5">Status</th></tr>
                          </thead>
                          <tbody className="divide-y divide-slate-100 dark:divide-slate-800 font-medium">
                            {invoices.map((inv) => (
                              <tr key={inv.id}>
                                <td className="p-2.5 font-bold font-mono text-indigo-600">{inv.id}</td>
                                <td className="p-2.5 font-bold text-slate-900 dark:text-white">{inv.studentName}<br/><span className="text-[10px] text-slate-400">{inv.class}</span></td>
                                <td className="p-2.5 text-slate-600 dark:text-slate-300">{inv.category}</td>
                                <td className="p-2.5 font-extrabold text-emerald-600">{inv.amount}</td>
                                <td className="p-2.5">
                                  <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${
                                    inv.status === 'PAID' ? 'bg-emerald-100 text-emerald-700' :
                                    inv.status === 'UNPAID' ? 'bg-amber-100 text-amber-700' : 'bg-rose-100 text-rose-700'
                                  }`}>
                                    {inv.status}
                                  </span>
                                </td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    </div>

                    {/* ACCOUNTANT PERMISSIONS MATRIX & SECURITY RESTRICTIONS BANNER */}
                    <div className="p-6 bg-slate-900 text-white rounded-3xl space-y-4 shadow-xl border border-slate-800">
                      <div className="flex justify-between items-center">
                        <h3 className="text-sm font-extrabold flex items-center gap-2 text-emerald-400">
                          <span>🛡️</span> Accountant Duties & Separation Policy Matrix
                        </h3>
                        <span className="px-3 py-1 rounded-full bg-emerald-500/20 text-emerald-300 text-[10px] font-extrabold border border-emerald-500/30">
                          Financial Separation Active
                        </span>
                      </div>

                      <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs">
                        <div className="p-4 bg-slate-800/60 rounded-2xl space-y-1.5 border border-slate-700">
                          <p className="font-extrabold text-emerald-400">✅ Accountant Authorized Financial Scope:</p>
                          <p className="text-slate-300">• Collect Fees (Cash, Transfer, Online, Cheque, Mobile Wallet)</p>
                          <p className="text-slate-300">• Create & Assign Fee Categories (Tuition, Transport, Hostel, Exam, Sports)</p>
                          <p className="text-slate-300">• Generate, Email, Print & Reissue Student Invoices</p>
                          <p className="text-slate-300">• Apply Merit Scholarships, Sibling Discounts & Financial Aid</p>
                          <p className="text-slate-300">• Export Reports: Daily Collection, Outstanding Dues, Revenue (PDF/Excel)</p>
                        </div>
                        <div className="p-4 bg-slate-800/60 rounded-2xl space-y-1.5 border border-slate-700">
                          <p className="font-extrabold text-rose-400">🔒 Restricted Academic & System Operations:</p>
                          <p className="text-slate-400">• Cannot Add/Delete Students or Edit Academic Information</p>
                          <p className="text-slate-400">• Cannot Manage Attendance, Examinations, Marks, or Grade Cards</p>
                          <p className="text-slate-400">• Cannot Change System Roles, User Accounts, or Database Settings</p>
                        </div>
                      </div>
                    </div>

                  </div>
                )}

                {/* INVOICES & PAYMENTS TAB */}
                {(currentTab === 'collect_fees' || currentTab === 'generate_invoice') && (
                  <div className="space-y-6">
                    <div className="p-6 bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 space-y-4">
                      <h2 className="text-lg font-bold text-slate-900 dark:text-white">Accountant Fee Collection & Invoice Generator</h2>
                      <p className="text-xs text-slate-500">Record payments across Cash, Bank Transfer, Online, Cheque, and Mobile Wallet.</p>
                      <button onClick={() => notify('Fee Invoice Generated & Receipt Printed!')} className="px-5 py-2.5 bg-emerald-600 text-white font-bold text-xs rounded-xl shadow-md">
                        + Issue Fee Receipt
                      </button>
                    </div>
                  </div>
                )}
              </main>

              <footer className="bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 px-8 py-3.5 flex flex-wrap items-center justify-between text-xs text-slate-500 font-semibold">
                <div className="flex flex-wrap items-center gap-6">
                  <span>💰 Today's Collection: <strong className="text-emerald-600">$4,500</strong></span>
                  <span>📈 Monthly Revenue: <strong className="text-slate-900 dark:text-white">$64,000</strong></span>
                  <span>⏳ Pending Fees: <strong className="text-rose-600">$5,200</strong></span>
                  <span>🎓 Scholarships: <strong className="text-purple-600">$12,000</strong></span>
                </div>
                <p className="text-[11px] text-slate-400">Pathaibhara SMS Financial Engine © 2026</p>
              </footer>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
