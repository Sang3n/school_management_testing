                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                      
                      {/* TEACHER SUPERVISION & LEAVE APPROVALS */}
                      <div className="p-6 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl space-y-4 shadow-xs">
                        <div className="flex justify-between items-center border-b border-slate-100 pb-3">
                          <h3 className="text-sm font-extrabold text-slate-900 dark:text-white flex items-center gap-2">
                            <span>👨‍🏫</span> Teacher Supervision & Leave Approvals
                          </h3>
                          <span className="text-xs font-bold text-amber-600">2 Pending Approvals</span>
                        </div>
                        <div className="divide-y divide-slate-100 dark:divide-slate-800 text-xs">
                          <div className="py-2.5 flex items-center justify-between">
                            <div><p className="font-bold text-slate-900 dark:text-white">Emily Watson (Mathematics)</p><p className="text-slate-400">Medical Leave Request (Aug 5 - Aug 7)</p></div>
                            <button onClick={() => notify('Approved Teacher Leave!')} className="px-3 py-1 bg-emerald-600 text-white rounded-lg font-bold">Approve Leave</button>
                          </div>
                          <div className="py-2.5 flex items-center justify-between">
                            <div><p className="font-bold text-slate-900 dark:text-white">Arthur Pendelton (Librarian)</p><p className="text-slate-400">Timetable Swap Request (Grade 10 A)</p></div>
                            <button onClick={() => notify('Approved Timetable Swap!')} className="px-3 py-1 bg-indigo-600 text-white rounded-lg font-bold">Approve Swap</button>
                          </div>
                        </div>
                      </div>

                      {/* STUDENT DISCIPLINE & BEHAVIORAL LOGS */}
                      <div className="p-6 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl space-y-4 shadow-xs">
                        <div className="flex justify-between items-center border-b border-slate-100 pb-3">
                          <h3 className="text-sm font-extrabold text-slate-900 dark:text-white flex items-center gap-2">
                            <span>⚖️</span> Student Discipline & Counseling Cases
                          </h3>
                          <button onClick={() => notify('Opening Discipline Portal')} className="text-xs font-bold text-rose-600 hover:underline">+ File Incident</button>
                        </div>
                        <div className="space-y-2 text-xs">
                          <div className="p-3 bg-rose-50 dark:bg-rose-950/40 rounded-xl border border-rose-200 flex justify-between items-center">
                            <div><p className="font-bold text-rose-900 dark:text-rose-200">Lucas Davis (Grade 11-B)</p><p className="text-rose-700 dark:text-rose-300">Unexcused Absence & Classroom Disturbance</p></div>
                            <button onClick={() => notify('Counseling Session Scheduled')} className="px-3 py-1 bg-rose-600 text-white rounded-lg font-bold">Counseling</button>
                          </div>
                        </div>
                      </div>
                    </div>

                    {/* PERMISSIONS MATRIX & DENIED MODULES BANNER */}
                    <div className="p-6 bg-slate-900 text-white rounded-3xl space-y-4 shadow-xl border border-slate-800">
                      <div className="flex justify-between items-center">
                        <h3 className="text-sm font-extrabold flex items-center gap-2 text-amber-400">
                          <span>🛡️</span> Vice Principal Security & Administrative Separation Policy
                        </h3>
                        <span className="px-3 py-1 rounded-full bg-amber-500/20 text-amber-300 text-[10px] font-extrabold border border-amber-500/30">
                          Role Security Active
                        </span>
                      </div>

                      <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs">
                        <div className="p-4 bg-slate-800/60 rounded-2xl space-y-1.5 border border-slate-700">
                          <p className="font-extrabold text-emerald-400">✅ Vice Principal Authorized Operational Scope:</p>
                          <p className="text-slate-300">• Full Student Enrollment & Academic Profile Edits</p>
                          <p className="text-slate-300">• Teacher Timetable, Supervision & Performance Evaluations</p>
                          <p className="text-slate-300">• Academic Year, Section, Class & Exam Schedules</p>
                          <p className="text-slate-300">• Discipline Incident Approvals & Parent Communication</p>
                        </div>
                        <div className="p-4 bg-slate-800/60 rounded-2xl space-y-1.5 border border-slate-700">
                          <p className="font-extrabold text-rose-400">🔒 Restricted Administrative & Financial Controls:</p>
                          <p className="text-slate-400">• Cannot create/delete User Accounts or assign System Roles</p>
                          <p className="text-slate-400">• Cannot modify Financial Payroll or System Database Backups</p>
                          <p className="text-slate-400">• Cannot alter School-wide System Security Configurations</p>
                        </div>
                      </div>
                    </div>

                  </div>
                )}

                {/* STUDENTS DIRECTORY TAB */}
                {currentTab === 'students' && (
                  <div className="space-y-6">
                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                      <div>
                        <h2 className="text-xl font-extrabold text-slate-900 dark:text-white">Students & Admissions Directory</h2>
                        <p className="text-xs text-slate-500 dark:text-slate-400">Vice Principal Student Management & Transfers</p>
                      </div>

                      {CAN_ADMIT_STUDENTS && (
                        <button onClick={() => setShowAdmissionModal(true)} className="px-5 py-2.5 bg-gradient-to-r from-amber-600 to-indigo-600 text-white font-extrabold text-xs rounded-2xl shadow-lg flex items-center gap-2">
                          <span>➕</span> + Add Student Details (Vice Principal)
                        </button>
                      )}
                    </div>

                    <div className="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 overflow-hidden shadow-xs">
                      <table className="w-full text-left text-xs text-slate-700 dark:text-slate-300">
                        <thead className="bg-slate-50 dark:bg-slate-800 text-slate-400 font-bold border-b">
                          <tr>
                            <th className="p-3.5">Student Name</th><th className="p-3.5">Admission / Roll</th><th className="p-3.5">Class / Section</th><th className="p-3.5">House</th><th className="p-3.5">Medical Alert</th><th className="p-3.5 text-right">Actions</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-100 dark:divide-slate-800 font-medium">
                          {students.filter(s => s.name.toLowerCase().includes(search.toLowerCase())).map(s => (
                            <tr key={s.id}>
                              <td className="p-3.5 font-bold text-slate-900 dark:text-white">{s.name}<br/><span className="text-[10px] text-slate-400">{s.email}</span></td>
                              <td className="p-3.5">{s.admission}<br/><span className="text-[10px] text-slate-400">Roll: {s.roll}</span></td>
                              <td className="p-3.5 font-semibold text-indigo-600">{s.class}</td>
                              <td className="p-3.5"><span className="px-2.5 py-1 rounded-full text-[10px] font-bold bg-rose-100 text-rose-700">{s.house}</span></td>
                              <td className="p-3.5 text-rose-600 font-semibold">{s.allergies !== 'None' ? `⚠️ ${s.allergies}` : 'None'}</td>
                              <td className="p-3.5 text-right"><button onClick={() => setViewStudent(s)} className="px-3 py-1 bg-indigo-50 text-indigo-700 rounded-lg text-xs font-semibold">View Profile</button></td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>
                )}
              </main>

              {/* FOOTER STATISTICS */}
              <footer className="bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 px-8 py-3.5 flex flex-wrap items-center justify-between text-xs text-slate-500 font-semibold">
                <div className="flex flex-wrap items-center gap-6">
                  <span>👨‍🎓 Students: <strong className="text-slate-900 dark:text-white">1,248</strong></span>
                  <span>👨‍🏫 Teachers: <strong className="text-slate-900 dark:text-white">86</strong></span>
                  <span>✅ Attendance: <strong className="text-emerald-600">96.4%</strong></span>
                  <span>📝 Assignments Pending: <strong className="text-amber-600">14</strong></span>
                  <span>🧪 Upcoming Exams: <strong className="text-indigo-600">3</strong></span>
                </div>
                <p className="text-[11px] text-slate-400">Pathaibhara SMS © 2026</p>
              </footer>
            </div>
          </div>

          {/* 11-SECTION ADMISSION MODAL */}
          {showAdmissionModal && CAN_ADMIT_STUDENTS && (
            <div className="fixed inset-0 bg-slate-900/70 backdrop-blur-sm flex items-center justify-center z-50 p-4">
              <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl max-w-4xl w-full max-h-[92vh] flex flex-col overflow-hidden shadow-2xl">
                <div className="p-5 border-b flex items-center justify-between bg-slate-50 dark:bg-slate-800/50">
                  <div className="flex items-center gap-3">
                    <div className="w-10 h-10 rounded-2xl bg-amber-600 text-white flex items-center justify-center font-extrabold text-lg">➕</div>
                    <div><h3 className="text-base font-extrabold text-slate-900 dark:text-white">Vice Principal Student Admission</h3><p className="text-xs text-slate-400">11-Category Registration Form</p></div>
                  </div>
                  <button onClick={() => setShowAdmissionModal(false)} className="p-2 rounded-xl text-slate-400">✕</button>
                </div>
                <form onSubmit={handleAddStudentSubmit} className="p-6 flex-1 overflow-y-auto space-y-4 text-xs">
                  <p className="font-bold text-amber-600">Vice Principal Authorized Student Admission Active</p>
                  <button type="submit" className="px-6 py-2.5 rounded-xl bg-emerald-600 text-white font-bold">✓ Submit Enrollment</button>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
