      const [isDark, setIsDark] = useState(false);
      const [showRoleDropdown, setShowRoleDropdown] = useState(false);
      const [students, setStudents] = useState(INITIAL_STUDENTS);
      const [search, setSearch] = useState('');
      const [showAdmissionModal, setShowAdmissionModal] = useState(false);
      const [viewStudent, setViewStudent] = useState(null);
      const [notification, setNotification] = useState(null);
      const [sidebarCollapsed, setSidebarCollapsed] = useState(false);

      // Admission Form Multi-Step State (11 Sections)
      const [admissionStep, setAdmissionStep] = useState(1);
      const [studentForm, setStudentForm] = useState({

        fatherName: '', fatherMobile: '+977 9841000000', fatherEmail: '', fatherOccupation: 'Business', fatherCitizenshipNo: '12-01-75-09876', motherName: '', motherMobile: '+977 9841111111', motherEmail: '', motherOccupation: 'Educator', motherCitizenshipNo: '12-01-78-01234', guardianName: '', guardianRelation: 'Uncle', guardianMobile: '', guardianEmail: '', guardianAddress: '',
        emergencyContactPerson: '', emergencyRelation: 'Father', emergencyPhone: '+977 9801234567', emergencyAltPhone: '+977 9841000000', emergencyAddress: 'Baneshwor-10, Kathmandu',
        allergies: 'None', medicalConditions: 'None', disabilities: 'None', medications: 'None', doctorName: 'Dr. S. K. Sharma', hospitalName: 'Norvic Hospital', emergencyMedicalNotes: 'No chronic illness.',
        usesTransport: 'Yes', route: 'Route #4 (Koteshwor - Baneshwor)', pickupPoint: 'Baneshwor Chowk', dropoffPoint: 'Baneshwor Chowk', busNumber: 'BA 3 KHA 4589', driverName: 'Ram Bahadur',
        hostelRequired: 'No', hostelName: 'N/A', roomNumber: 'N/A', bedNumber: 'N/A', wardenName: 'N/A',
        admissionFee: '$500', monthlyFeePlan: '$250 / Month', scholarship: '10% Merit Waiver', discount: '$50', paymentMethod: 'Direct Transfer', feeStatus: 'PAID',
        studentPhotoUploaded: true, birthCertUploaded: true, citizenshipCertUploaded: false, transferCertUploaded: true, markSheetUploaded: true, characterCertUploaded: true, medicalCertUploaded: false, passportCopyUploaded: false, parentCitizenshipCopyUploaded: true,

      });

      const currentUser = ROLE_USER_PROFILES[currentRole] || ROLE_USER_PROFILES.SUPER_ADMIN;

      const IS_ADMIN = currentRole === 'SUPER_ADMIN' || currentRole === 'SCHOOL_ADMIN';

      const CAN_ADMIT_STUDENTS = ['SUPER_ADMIN', 'SCHOOL_ADMIN', 'PRINCIPAL', 'VICE_PRINCIPAL', 'ACCOUNTANT', 'TEACHER', 'RECEPTIONIST'].includes(currentRole);

      const NAV_SECTIONS = [
        {
          category: 'CORE MODULES',

            { id: 'dashboard', label: 'Dashboard Overview', icon: '📊' },
            { id: 'students', label: 'Students & Admissions', icon: '🎓' },
            { id: 'teachers', label: 'Faculty & Staff', icon: '👥' },

            { id: 'fees', label: 'Fees & Invoicing', icon: '💵' },
            { id: 'notices', label: 'Notice Board', icon: '🔔' },

        { num: 3, label: 'Contact Details', icon: '📞' },

        { num: 7, label: 'Transport', icon: '🚌' },
        { num: 8, label: 'Hostel', icon: '🏢' },
        { num: 9, label: 'Fee & Payment', icon: '💵' },
        { num: 10, label: 'Documents Upload', icon: '📁' },
        { num: 11, label: 'Portal Account', icon: '🔐' },
      ];

      useEffect(() => {
        if (isDark) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      }, [isDark]);

      const notify = (msg) => {
        setNotification(msg);
        setTimeout(() => setNotification(null), 3000);
      };

      const handleAddStudentSubmit = (e) => {
        e.preventDefault();
        const fullName = `${studentForm.firstName} ${studentForm.middleName ? studentForm.middleName + ' ' : ''}${studentForm.lastName}`.trim() || 'New Student';
        const newEntry = {
          id: 's-' + Date.now(),
          name: fullName,
          email: studentForm.email || `${(studentForm.firstName || 'student').toLowerCase()}@sms.edu`,
          roll: studentForm.rollNo,
          admission: studentForm.admissionNo,
          class: `${studentForm.classCode}-${studentForm.section}`,
          house: `${studentForm.house} House`,
          status: 'ACTIVE',
          allergies: studentForm.allergies,
          emergency: studentForm.emergencyPhone,
        };
        setStudents([newEntry, ...students]);
        setShowAdmissionModal(false);
        setAdmissionStep(1);
        notify(`🎉 Student "${fullName}" Successfully Enrolled!`);
      };

      return (
        <div className="flex min-h-screen bg-slate-100 dark:bg-slate-950 text-slate-900 dark:text-slate-100 transition-colors duration-200">

                    </div>
                  </div>
                  {currentRole !== 'SUPER_ADMIN' && (
                    <button 
                      onClick={() => { setCurrentRole('SUPER_ADMIN'); notify('👑 Returned to Super Admin Mode'); }}
                      className="px-2 py-1 bg-indigo-600 text-white rounded-lg text-[10px] font-bold shrink-0 hover:bg-indigo-700"
                      title="Return to Super Admin Role"
                    >
                      👑 Admin
                    </button>
                  )}
                </div>
              )}

              <nav className="px-3 py-2 space-y-4 max-h-[calc(100vh-190px)] overflow-y-auto">
                {NAV_SECTIONS.map((sec, idx) => (
                  <div key={idx} className="space-y-1">
                    {!sidebarCollapsed && (
                      <p className="px-3 text-[10px] uppercase font-bold text-slate-400 dark:text-slate-500 tracking-wider">
                        {sec.category}
                      </p>
                    )}
                    {sec.items.map((item) => (
                      <button
                        key={item.id}
                        onClick={() => setCurrentTab(item.id)}
                        className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-bold transition-all ${
                          currentTab === item.id
                            ? 'bg-slate-700 dark:bg-indigo-600 text-white shadow-md'
                            : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 hover:text-slate-900 dark:hover:text-white'
                        }`}
                        title={item.label}
                      >
                        <span className="text-sm shrink-0">{item.icon}</span>
                        {!sidebarCollapsed && <span>{item.label}</span>}

                    ))}

                onClick={() => setSidebarCollapsed(!sidebarCollapsed)}
                className="p-1.5 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 text-xs font-bold"
              >
                {sidebarCollapsed ? '➔' : '◀'}
              </button>
            </div>
          </aside>

          {/* Main Workspace */}
          <div className="flex-1 flex flex-col min-w-0">

              <div className="flex items-center gap-4">
                <div className="flex items-center gap-2">
                  <div className="w-8 h-8 rounded-lg bg-slate-100 dark:bg-slate-800 flex items-center justify-center font-bold text-slate-700 dark:text-slate-200 text-sm">
                    📊
                  </div>
                  <h1 className="text-base font-extrabold text-slate-900 dark:text-white tracking-tight capitalize">
                    {currentTab.replace('_', ' ')}

              </div>

              <div className="flex items-center gap-3">
                {/* ROLE SWITCHER DROPDOWN - Super Admin can view and switch between all 10 roles */}
                <div className="relative">
                  <button
                    onClick={() => setShowRoleDropdown(!showRoleDropdown)}
                    className="flex items-center gap-2 px-3.5 py-1.5 rounded-xl bg-indigo-50 dark:bg-indigo-950/80 border border-indigo-200 dark:border-indigo-800 text-indigo-700 dark:text-indigo-300 text-xs font-bold hover:bg-indigo-100 transition-colors"

                    <span>✨ Switch Portal Role: {currentRole}</span>

                  {showRoleDropdown && (
                    <div className="absolute right-0 mt-2 w-64 bg-white dark:bg-slate-800 rounded-2xl shadow-2xl border border-slate-200 dark:border-slate-700 py-2 z-50">
                      <div className="px-3.5 py-1.5 border-b border-slate-100 dark:border-slate-700 flex justify-between items-center">

                      <div className="max-h-72 overflow-y-auto">

                            key={r.code}
                            onClick={() => { setCurrentRole(r.code); setShowRoleDropdown(false); notify(`Switched Context to ${r.name}`); }}
                            className={`w-full text-left px-3.5 py-2 text-xs font-medium flex items-center justify-between hover:bg-slate-100 dark:hover:bg-slate-700 ${currentRole === r.code ? 'text-indigo-600 dark:text-indigo-400 font-bold bg-indigo-50 dark:bg-slate-700/50' : 'text-slate-700 dark:text-slate-300'}`}

                <div className="flex items-center gap-3 pl-3 border-l border-slate-200 dark:border-slate-800">

            <main className="p-8 max-w-7xl w-full mx-auto space-y-6">

              {/* DASHBOARD OVERVIEW TAB */}
              {currentTab === 'dashboard' && (
                <div className="space-y-6">
                  {/* Shortcuts Card */}

                      <button onClick={() => setCurrentTab('attendance')} className="px-3.5 py-1.5 rounded-xl bg-blue-50 dark:bg-blue-950/60 border border-blue-200 text-blue-700 text-xs font-bold">📅 Mark Attendance</button>
                      <button onClick={() => setCurrentTab('fees')} className="px-3.5 py-1.5 rounded-xl bg-emerald-50 dark:bg-emerald-950/60 border border-emerald-200 text-emerald-700 text-xs font-bold">💵 Issue Fee Invoice</button>
                      <button onClick={() => setCurrentTab('users')} className="px-3.5 py-1.5 rounded-xl bg-amber-50 dark:bg-amber-950/60 border border-amber-200 text-amber-700 text-xs font-bold">🔑 View All 10 User Roles</button>

              {/* USER DIRECTORY TAB (SUPER ADMIN VIEW ALL 10 ROLES) */}

                              <td className="p-3.5 font-bold text-slate-900 dark:text-white">
                                <div className="flex items-center gap-3">
                                  <div className="w-8 h-8 rounded-full bg-indigo-600 text-white flex items-center justify-center font-bold text-xs shadow-sm">
                                    {prof.avatar}
                                  </div>
                                  <span>{prof.name}</span>
                                </div>
                              </td>
                              <td className="p-3.5 font-semibold text-indigo-600 dark:text-indigo-400">{r.name}</td>
                              <td className="p-3.5 text-slate-500 font-mono text-[11px]">{prof.email}</td>
                              <td className="p-3.5"><span className="px-2 py-0.5 rounded bg-emerald-100 dark:bg-emerald-950 text-emerald-700 dark:text-emerald-400 text-[10px] font-bold">ACTIVE</span></td>
                              <td className="p-3.5 text-right">
                                <button 
                                  onClick={() => { setCurrentRole(r.code); notify(`Switched Context to ${r.name} (${prof.name})`); }} 
                                  className={`px-3 py-1 rounded-lg text-xs font-bold shadow-sm transition-all ${
                                    isActive ? 'bg-emerald-600 text-white' : 'bg-indigo-600 hover:bg-indigo-700 text-white'
                                  }`}
                                >
                                  {isActive ? '✓ Currently Viewing' : `Inspect ${r.name}`}
                                </button>
                              </td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

              {/* STUDENTS TAB */}
              {currentTab === 'students' && (
                <div className="space-y-6">
                  <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                    <div>
                      <h2 className="text-xl font-extrabold text-slate-900 dark:text-white">Students & Admissions Directory</h2>
                      <p className="text-xs text-slate-500 dark:text-slate-400">Complete institutional enrollment & student records</p>
                    </div>

                    <button 
                      onClick={() => setShowAdmissionModal(true)} 
                      className="px-5 py-2.5 bg-gradient-to-r from-indigo-600 via-indigo-700 to-purple-700 text-white font-extrabold text-xs rounded-2xl shadow-lg flex items-center gap-2"
                    >
                      <span className="text-base">➕</span>
                      <span>+ Add Student Details</span>
                    </button>
                  </div>

                  <div className="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200/90 dark:border-slate-800 overflow-hidden shadow-xs">
                    <table className="w-full text-left text-xs text-slate-700 dark:text-slate-300">
                      <thead className="bg-slate-50 dark:bg-slate-800 text-slate-500 dark:text-slate-400 font-bold border-b border-slate-200 dark:border-slate-700">
                        <tr>
                          <th className="p-3.5">Student Name</th>
                          <th className="p-3.5">Admission / Roll</th>
                          <th className="p-3.5">Class / Section</th>
                          <th className="p-3.5">House</th>
                          <th className="p-3.5">Medical Alert</th>
                          <th className="p-3.5 text-right">Profile Actions</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100 dark:divide-slate-800 font-medium">
                        {students.filter(s => s.name.toLowerCase().includes(search.toLowerCase())).map(s => (
                          <tr key={s.id} className="hover:bg-slate-50 dark:hover:bg-slate-800/50">
                            <td className="p-3.5 font-bold text-slate-900 dark:text-white">{s.name} <br/><span className="text-[10px] text-slate-400 font-normal">{s.email}</span></td>
                            <td className="p-3.5">{s.admission} <br/><span className="text-[10px] text-slate-400">Roll: {s.roll}</span></td>
                            <td className="p-3.5 font-semibold text-indigo-600 dark:text-indigo-400">{s.class}</td>
                            <td className="p-3.5">
                              <span className={`px-2.5 py-1 rounded-full text-[10px] font-bold ${
                                s.house.includes('Red') ? 'bg-rose-100 text-rose-700 dark:bg-rose-950 dark:text-rose-300' :
                                s.house.includes('Green') ? 'bg-emerald-100 text-emerald-700 dark:bg-emerald-950 dark:text-emerald-300' :
                                s.house.includes('Blue') ? 'bg-blue-100 text-blue-700 dark:bg-blue-950 dark:text-blue-300' :
                                'bg-amber-100 text-amber-700 dark:bg-amber-950 dark:text-amber-300'
                              }`}>
                                {s.house}
                              </span>
                            </td>
                            <td className="p-3.5 text-rose-600 dark:text-rose-400 font-semibold">{s.allergies !== 'None' ? `⚠️ ${s.allergies}` : 'None'}</td>
                            <td className="p-3.5 text-right">
                              <button onClick={() => setViewStudent(s)} className="px-3 py-1 bg-indigo-50 dark:bg-indigo-950 text-indigo-700 dark:text-indigo-300 rounded-lg text-xs font-semibold hover:bg-indigo-100">View Full Profile</button>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}
            </main>
          </div>

          {/* COMPREHENSIVE 11-SECTION STUDENT ADMISSION WIZARD MODAL */}
          {showAdmissionModal && (
            <div className="fixed inset-0 bg-slate-900/70 backdrop-blur-sm flex items-center justify-center z-50 p-4">
              <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl max-w-4xl w-full max-h-[92vh] flex flex-col overflow-hidden shadow-2xl">
                <div className="p-5 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between bg-slate-50 dark:bg-slate-800/50">
                  <div className="flex items-center gap-3">
                    <div className="w-10 h-10 rounded-2xl bg-indigo-600 text-white flex items-center justify-center font-extrabold text-lg shadow-md">
                      ➕
                    </div>
                    <div>
                      <h3 className="text-base font-extrabold text-slate-900 dark:text-white">Student Enrollment Wizard</h3>
                      <p className="text-xs text-slate-500 dark:text-slate-400">Pathaibhara Comprehensive 11-Category Registration Form</p>
                    </div>
                  </div>
                  <button onClick={() => setShowAdmissionModal(false)} className="p-2 rounded-xl text-slate-400 hover:bg-slate-200">✕</button>
                </div>

                <div className="flex overflow-x-auto bg-slate-100 dark:bg-slate-950 border-b border-slate-200 dark:border-slate-800 px-4 py-2 gap-1.5">
                  {ADMISSION_WIZARD_STEPS.map((s) => (
                    <button
                      key={s.num}
                      type="button"
                      onClick={() => setAdmissionStep(s.num)}
                      className={`px-3 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap flex items-center gap-1.5 transition-all ${
                        admissionStep === s.num
                          ? 'bg-indigo-600 text-white shadow-sm'
                          : 'text-slate-600 dark:text-slate-400 hover:bg-white dark:hover:bg-slate-800'
                      }`}
                    >
                      <span>{s.icon}</span>
                      <span>{s.num}. {s.label}</span>
                    </button>
                  ))}
                </div>

                <form onSubmit={handleAddStudentSubmit} className="p-6 flex-1 overflow-y-auto space-y-5">
                  {admissionStep === 1 && (
                    <div className="space-y-4">
                      <h4 className="text-xs font-extrabold text-indigo-600 uppercase tracking-wider">1. Personal Information</h4>
                      <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                        <div><label className="text-xs font-bold text-slate-700 dark:text-slate-300">Student ID (Auto)</label><input type="text" readOnly value={studentForm.studentId} className="mt-1 w-full px-3.5 py-2 text-xs rounded-xl bg-slate-100 dark:bg-slate-800 font-mono font-bold text-indigo-600" /></div>
                        <div><label className="text-xs font-bold text-slate-700 dark:text-slate-300">Admission Number</label><input type="text" value={studentForm.admissionNo} onChange={(e) => setStudentForm({ ...studentForm, admissionNo: e.target.value })} className="mt-1 w-full px-3.5 py-2 text-xs rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 font-bold" /></div>
                        <div><label className="text-xs font-bold text-slate-700 dark:text-slate-300">Roll Number</label><input type="text" value={studentForm.rollNo} onChange={(e) => setStudentForm({ ...studentForm, rollNo: e.target.value })} className="mt-1 w-full px-3.5 py-2 text-xs rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 font-bold" /></div>
                      </div>
                      <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                        <div><label className="text-xs font-bold text-slate-700 dark:text-slate-300">First Name *</label><input type="text" required value={studentForm.firstName} onChange={(e) => setStudentForm({ ...studentForm, firstName: e.target.value })} className="mt-1 w-full px-3.5 py-2 text-xs rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700" placeholder="e.g. Aarav" /></div>
                        <div><label className="text-xs font-bold text-slate-700 dark:text-slate-300">Middle Name (Optional)</label><input type="text" value={studentForm.middleName} onChange={(e) => setStudentForm({ ...studentForm, middleName: e.target.value })} className="mt-1 w-full px-3.5 py-2 text-xs rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700" placeholder="e.g. Kumar" /></div>
                        <div><label className="text-xs font-bold text-slate-700 dark:text-slate-300">Last Name *</label><input type="text" required value={studentForm.lastName} onChange={(e) => setStudentForm({ ...studentForm, lastName: e.target.value })} className="mt-1 w-full px-3.5 py-2 text-xs rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700" placeholder="e.g. Shrestha" /></div>
                      </div>
                    </div>
                  )}

                  {admissionStep === 2 && (
                    <div className="space-y-4">
                      <h4 className="text-xs font-extrabold text-indigo-600 uppercase tracking-wider">2. Academic Information</h4>
                      <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                        <div><label className="text-xs font-bold text-slate-700 dark:text-slate-300">Academic Year</label><input type="text" value={studentForm.academicYear} onChange={(e) => setStudentForm({ ...studentForm, academicYear: e.target.value })} className="mt-1 w-full px-3.5 py-2 text-xs rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 font-bold" /></div>
                        <div><label className="text-xs font-bold text-slate-700 dark:text-slate-300">Admission Date</label><input type="date" value={studentForm.admissionDate} onChange={(e) => setStudentForm({ ...studentForm, admissionDate: e.target.value })} className="mt-1 w-full px-3 py-2 text-xs rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700" /></div>
                        <div>
                          <label className="text-xs font-bold text-slate-700 dark:text-slate-300">Class Allocation</label>
                          <select value={studentForm.classCode} onChange={(e) => setStudentForm({ ...studentForm, classCode: e.target.value })} className="mt-1 w-full px-3 py-2 text-xs rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 font-bold">
                            <option value="Nursery">Nursery</option><option value="LKG">LKG</option><option value="UKG">UKG</option>
                            <option value="Class 1">Class 1</option><option value="Class 2">Class 2</option><option value="Class 3">Class 3</option>
                            <option value="Class 4">Class 4</option><option value="Class 5">Class 5</option><option value="Class 6">Class 6</option>
                            <option value="Class 7">Class 7</option><option value="Class 8">Class 8</option><option value="Class 9">Class 9</option>
                            <option value="Class 10">Class 10</option><option value="Class 11">Class 11</option><option value="Class 12">Class 12</option>
                          </select>
                        </div>
                      </div>
                      <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                        <div><label className="text-xs font-bold text-slate-700 dark:text-slate-300">Section</label><input type="text" value={studentForm.section} onChange={(e) => setStudentForm({ ...studentForm, section: e.target.value })} className="mt-1 w-full px-3.5 py-2 text-xs rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 font-bold" /></div>
                        <div>
                          <label className="text-xs font-bold text-slate-700 dark:text-slate-300">House</label>
                          <select value={studentForm.house} onChange={(e) => setStudentForm({ ...studentForm, house: e.target.value })} className="mt-1 w-full px-3 py-2 text-xs rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 font-bold">
                            <option value="Red">Red House</option><option value="Green">Green House</option><option value="Blue">Blue House</option><option value="Yellow">Yellow House</option>
                          </select>
                        </div>
                        <div><label className="text-xs font-bold text-slate-700 dark:text-slate-300">Shift</label><select value={studentForm.shift} onChange={(e) => setStudentForm({ ...studentForm, shift: e.target.value })} className="mt-1 w-full px-3 py-2 text-xs rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700"><option value="Day">Day</option><option value="Morning">Morning</option></select></div>
                      </div>
                    </div>
                  )}

                  {/* Steps 3..11 */}
                  {admissionStep >= 3 && (
                    <div className="p-4 rounded-2xl bg-slate-50 dark:bg-slate-800/40 space-y-3 text-xs">
                      <p className="font-bold text-indigo-600">Section {admissionStep} Form Fields Active</p>
                      <p className="text-slate-500">Form step {admissionStep} configured & ready.</p>
                    </div>
                  )}

                  <div className="pt-4 flex items-center justify-between border-t border-slate-200 dark:border-slate-800">
                    <button type="button" disabled={admissionStep === 1} onClick={() => setAdmissionStep((prev) => Math.max(1, prev - 1))} className="px-4 py-2 rounded-xl text-xs font-bold bg-slate-100 text-slate-700 disabled:opacity-40">◀ Previous</button>
                    {admissionStep < 11 ? (
                      <button type="button" onClick={() => setAdmissionStep((prev) => Math.min(11, prev + 1))} className="px-5 py-2 rounded-xl bg-indigo-600 text-white text-xs font-bold">Next ➔</button>
                    ) : (
                      <button type="submit" className="px-6 py-2.5 rounded-xl bg-emerald-600 text-white text-xs font-bold">✓ Submit Enrollment</button>
                    )}
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Profile Modal */}
          {viewStudent && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center z-50 p-4">
              <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-6 max-w-lg w-full text-xs space-y-4 shadow-2xl">
                <div className="flex justify-between items-center pb-2 border-b border-slate-100 dark:border-slate-800">
                  <h3 className="text-base font-bold text-slate-900 dark:text-white">{viewStudent.name} Profile</h3>
                  <button onClick={() => setViewStudent(null)} className="text-slate-400">✕</button>
                </div>
                <div className="grid grid-cols-2 gap-3">
                  <div className="p-3 bg-slate-50 dark:bg-slate-800/50 rounded-xl"><p className="text-slate-400">Admission No</p><p className="font-bold text-slate-900 dark:text-white">{viewStudent.admission}</p></div>
                  <div className="p-3 bg-slate-50 dark:bg-slate-800/50 rounded-xl"><p className="text-slate-400">Roll No</p><p className="font-bold text-slate-900 dark:text-white">{viewStudent.roll}</p></div>
                  <div className="p-3 bg-slate-50 dark:bg-slate-800/50 rounded-xl"><p className="text-slate-400">House</p><p className="font-bold text-indigo-600">{viewStudent.house}</p></div>
                  <div className="p-3 bg-slate-50 dark:bg-slate-800/50 rounded-xl"><p className="text-slate-400">Emergency Phone</p><p className="font-bold text-rose-600">{viewStudent.emergency}</p></div>
                </div>
                <button onClick={() => setViewStudent(null)} className="w-full py-2 bg-indigo-600 text-white font-semibold rounded-xl">Close</button>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
