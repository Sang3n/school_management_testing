                    'अष्टमी', 'नवमी', 'दशमी', 'एकादशी', 'द्वादशी', 
                    'त्रयोदशी', 'चतुर्दशी', 'औंसी', 'प्रतिपदा', 'द्वितीया', 
                    'तृतीया'
                  ];
                  return list[nepaliDay - 1] || 'तृतीया';
                };

                const translateEvent = (text) => {
                  const translations = {
                    'Parent-Teacher Meeting': 'गोरखकाली पूजा',
                    'Independence Day (Holiday)': 'स्वतन्त्रता दिवस (बिदा)',
                    'Q3 Mid-Term Exams Start': 'परीक्षा सुरु',
                    'Q3 Mid-Term Exams End': 'परीक्षा समाप्त',
                    'Sports Day': 'खेलकुद दिवस',
                    'Science Exhibition': 'विज्ञान प्रदर्शनी',
                    'Staff Training Day': 'गोरखकाली पूजा',
                    'New Academic Month Begins': 'नयाँ शैक्षिक सत्र',
                    'Teachers Day Celebration': 'शिक्षक दिवस',
                    'Inter-House Quiz Competition': 'क्विज प्रतियोगिता',
                    'Dashain Holiday Begins': 'दशैं बिदा सुरु',
                    'Summer Term Begins': 'गर्मी सत्र सुरु',
                    'Annual Day Rehearsal': 'वार्षिकोत्सव पूर्वाभ्यास',
                    'Annual Day Celebration': 'वार्षिकोत्सव समारोह'
                  };
                  return translations[text] || text;
                };

                const getEventsForDay = (day) => {
                  const dateStr = `${calYear}-${String(calMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                  return calendarNotes.filter(n => {
                    if (n.date !== dateStr) return false;
                    if (n.type === 'GLOBAL') return true;
                    if (n.type === 'ROLE' && n.role === currentRole) return true;
                    return false;
                  });
                };

                const monthGlobalNotes = calendarNotes
                  .filter(n => n.type === 'GLOBAL')
                  .filter(n => { const [y, m] = n.date.split('-'); return parseInt(y) === calYear && parseInt(m) === calMonth + 1; })
                  .sort((a, b) => a.date.localeCompare(b.date));

                const monthRoleNotes = calendarNotes
                  .filter(n => n.type === 'ROLE' && n.role === currentRole)
                  .filter(n => { const [y, m] = n.date.split('-'); return parseInt(y) === calYear && parseInt(m) === calMonth + 1; })
                  .sort((a, b) => a.date.localeCompare(b.date));

                const prevMonth = () => { if (calMonth === 0) { setCalMonth(11); setCalYear(calYear - 1); } else setCalMonth(calMonth - 1); };
                const nextMonth = () => { if (calMonth === 11) { setCalMonth(0); setCalYear(calYear + 1); } else setCalMonth(calMonth + 1); };
                const goToday = () => { setCalMonth(today.getMonth()); setCalYear(today.getFullYear()); };

                return (
                  <div className="space-y-6 animate-in fade-in duration-300">

                    {/* CALENDAR HEADER */}
                    <div className="flex flex-col md:flex-row items-start md:items-center justify-between gap-4">

                        <h2 className="text-xl font-black text-slate-900 dark:text-white tracking-tight">📆 School Calendar</h2>
                        <p className="text-xs text-slate-400 font-medium mt-1">Academic Year {academicYear} • View events, holidays & schedules</p>
                      </div>
                      <div className="flex items-center gap-2">

                        <button onClick={prevMonth} className="px-3 py-2 bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 text-xs font-bold rounded-xl border border-slate-200 dark:border-slate-700 hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors">◀</button>

                        <button onClick={nextMonth} className="px-3 py-2 bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 text-xs font-bold rounded-xl border border-slate-200 dark:border-slate-700 hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors">▶</button>
                      </div>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-4 gap-6">

                      {/* CALENDAR GRID (3 cols) */}
                      <div className="lg:col-span-3 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl shadow-xs overflow-hidden">
                        {/* Day Headers */}
                        <div className="grid grid-cols-7 border-b border-slate-100 dark:border-slate-800">
                          {DAY_NAMES.map(d => (
                            <div key={d} className={`py-3 text-center text-[11px] font-extrabold uppercase tracking-wider ${d === 'Sun' ? 'text-rose-500' : d === 'Sat' ? 'text-blue-500' : 'text-slate-400'}`}>{d}</div>
                          ))}
                        </div>
                        {/* Day Cells */}
                        <div className="grid grid-cols-7">
                          {Array.from({ length: firstDay }).map((_, i) => (
                            <div key={`empty-${i}`} className="h-24 border-b border-r border-slate-50 dark:border-slate-800/50 bg-slate-50/50 dark:bg-slate-950/30" />
                          ))}
                          {Array.from({ length: daysInMonth }).map((_, i) => {
                            const day = i + 1;
                            const dayOfWeek = (firstDay + i) % 7;
                            const isSun = dayOfWeek === 0;
                            const isSat = dayOfWeek === 6;
                            const nepaliDate = getNepaliDate(day, calMonth, calYear);
                            const dayEvents = getEventsForDay(day);
                            return (
                              <div key={day} className={`h-24 border-b border-r border-slate-50 dark:border-slate-800/50 p-1.5 relative transition-colors hover:bg-emerald-50/50 dark:hover:bg-emerald-950/20 ${isToday(day) ? 'bg-emerald-800 text-white shadow-md' : isSun ? 'bg-rose-50/40 dark:bg-rose-950/10' : isSat ? 'bg-blue-50/30 dark:bg-blue-950/10' : ''}`}>
                                
                                {/* English Date (Top Right) */}
                                <span className={`absolute top-1.5 right-1.5 text-[9px] font-extrabold ${isToday(day) ? 'text-emerald-100' : 'text-slate-400'}`}>
                                  {day}
                                </span>

                                {/* Event Text (Center Top) */}
                                <div className="text-center text-[9px] font-black mt-1 h-7 overflow-hidden leading-tight select-none">
                                  {dayEvents.length > 0 && (
                                    <span className={isToday(day) ? 'text-white' : 'text-emerald-700 dark:text-emerald-450 font-extrabold'}>
                                      {translateEvent(dayEvents[0].text)}
                                    </span>
                                  )}
                                </div>

                                {/* Nepali Numeral (Center) */}
                                <div className="text-center -mt-1 font-black text-xl select-none">
                                  <span className={isToday(day) ? 'text-white' : isSun ? 'text-rose-500' : isSat ? 'text-blue-500' : 'text-slate-800 dark:text-slate-200'}>
                                    {toDevanagari(nepaliDate)}
                                  </span>
                                </div>

                                {/* Tithi Text (Bottom Center) */}
                                <div className={`text-center text-[9px] font-extrabold mt-0.5 select-none ${isToday(day) ? 'text-emerald-200 font-black' : isSun || nepaliDate === 3 || nepaliDate === 5 || nepaliDate === 10 || nepaliDate === 23 || nepaliDate === 16 ? 'text-rose-500/90 dark:text-rose-400/90' : 'text-slate-400 dark:text-slate-500'}`}>
                                  {getTithi(nepaliDate)}
                                </div>

                              </div>
                            );
                          })}
                        </div>
                      </div>

                      {/* UPCOMING EVENTS & NOTES SIDEBAR (1 col) */}

                        {/* 1. Global Events list for this month */}

                          <div className="px-5 py-3.5 border-b border-slate-100 dark:border-slate-800 bg-slate-50 dark:bg-slate-800/50">
                            <h3 className="text-xs font-black text-slate-900 dark:text-white">📢 School Global Events</h3>
                          </div>
                          <div className="p-4 space-y-2.5 max-h-[220px] overflow-y-auto">
                            {monthGlobalNotes.length === 0 ? (
                              <p className="text-xs text-slate-400 font-medium text-center py-4">No global events this month</p>

                              const dayNum = parseInt(evt.date.split('-')[2]);
                              return (
                                <div key={i} className="flex items-start gap-3 p-2.5 rounded-2xl bg-slate-50 dark:bg-slate-850 border border-slate-100 dark:border-slate-800/80">

                                    <p className="font-extrabold text-slate-900 dark:text-white truncate">{evt.text}</p>
                                    <p className="text-[9px] text-slate-400 font-bold">{MONTH_NAMES[calMonth]} {dayNum}, {calYear}</p>
                                  </div>
                                </div>

                          </div>

                            <h3 className="text-xs font-black text-purple-700 dark:text-purple-300">📓 {currentRole.replace('_', ' ')} Private Notes</h3>
                          </div>
                          <div className="p-4 space-y-2.5 max-h-[220px] overflow-y-auto">
                            {monthRoleNotes.length === 0 ? (
                              <p className="text-xs text-slate-400 font-medium text-center py-4">No specific notes for this role</p>

                              const dayNum = parseInt(evt.date.split('-')[2]);
                              return (
                                <div key={i} className="flex items-start gap-3 p-2.5 rounded-2xl bg-purple-50/20 dark:bg-purple-950/10 border border-purple-100/30">
                                  <div className={`w-8 h-8 rounded-xl ${evt.color} flex items-center justify-center text-white text-base shrink-0`}>{evt.icon}</div>
                                  <div className="min-w-0 text-xs">
                                    <p className="font-extrabold text-slate-900 dark:text-white truncate">{evt.text}</p>
                                    <p className="text-[9px] text-purple-600 dark:text-purple-400 font-bold">{MONTH_NAMES[calMonth]} {dayNum}, {calYear}</p>
                                  </div>
                                </div>
                              );
                            })}
                          </div>
                        </div>

                        {/* 3. Interactive Form to Add Notes */}
                        <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-5 space-y-3.5">
                          <h3 className="text-xs font-black text-slate-900 dark:text-white flex items-center gap-2">✍️ Add Calendar Note</h3>
                          <form onSubmit={(e) => {
                            e.preventDefault();
                            const noteText = e.target.noteText.value.trim();
                            const noteDate = e.target.noteDate.value;
                            const noteScope = e.target.noteScope ? e.target.noteScope.value : 'ROLE';
                            const noteCategory = e.target.noteCategory.value;

                            if (!noteText || !noteDate) return;

                            const catMapping = {
                              holiday: { color: 'bg-rose-500', icon: '🎌' },
                              exam: { color: 'bg-amber-500', icon: '📝' },
                              activity: { color: 'bg-emerald-500', icon: '🏅' },
                              meeting: { color: 'bg-purple-500', icon: '👨‍👩‍👧' },
                              exhibition: { color: 'bg-blue-500', icon: '🔬' },
                              training: { color: 'bg-indigo-500', icon: '👨‍🏫' },
                              private: { color: 'bg-indigo-600', icon: '📓' }
                            };

                            const newNote = {
                              id: 'n-' + Date.now(),
                              date: noteDate,
                              text: noteText,
                              type: noteScope,
                              role: noteScope === 'ROLE' ? currentRole : null,
                              color: catMapping[noteCategory].color,
                              icon: catMapping[noteCategory].icon
                            };

                            setCalendarNotes([...calendarNotes, newNote]);
                            e.target.reset();
                            notify(`📆 Note added successfully!`);
                          }} className="space-y-2.5 text-[11px]">
                            <div>
                              <label className="block text-slate-400 font-bold mb-1">Note Date</label>
                              <input type="date" required name="noteDate" defaultValue={new Date().toISOString().split('T')[0]} className="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white outline-none font-bold" />
                            </div>
                            <div>
                              <label className="block text-slate-400 font-bold mb-1">Note / Event Text</label>
                              <input type="text" required name="noteText" placeholder="e.g. Submit reports" className="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white outline-none font-medium" />
                            </div>
                            <div className="grid grid-cols-2 gap-2">
                              <div>
                                <label className="block text-slate-400 font-bold mb-1">Category</label>
                                <select name="noteCategory" className="w-full px-2.5 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white font-bold outline-none">
                                  <option value="private">Private Note</option>
                                  <option value="meeting">Meeting</option>
                                  <option value="exam">Examination</option>
                                  <option value="holiday">Holiday</option>
                                  <option value="activity">Activity</option>
                                  <option value="exhibition">Exhibition</option>
                                  <option value="training">Training</option>
                                </select>
                              </div>
                              {['SUPER_ADMIN', 'SCHOOL_ADMIN', 'PRINCIPAL', 'VICE_PRINCIPAL', 'ACCOUNTANT'].includes(currentRole) ? (
                                <div>
                                  <label className="block text-slate-400 font-bold mb-1">Visibility</label>
                                  <select name="noteScope" className="w-full px-2.5 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white font-bold outline-none">
                                    <option value="GLOBAL">Global (Everyone)</option>
                                    <option value="ROLE">Role Only</option>
                                  </select>
                                </div>
                              ) : (
                                <div>
                                  <label className="block text-slate-400 font-bold mb-1">Visibility</label>
                                  <input type="text" readOnly value={`${currentRole.replace('_', ' ')} Only`} className="w-full px-2.5 py-2 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-400 font-extrabold outline-none" />
                                </div>
                              )}
                            </div>
                            <button type="submit" className="w-full py-2.5 bg-purple-600 hover:bg-purple-700 text-white font-black rounded-xl shadow-md transition-colors mt-2">
                              Add Note
                            </button>
                          </form>
                        </div>

                        {/* 4. Legend */}
                        <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl shadow-xs p-5 space-y-3">
                          <h3 className="text-xs font-extrabold text-slate-900 dark:text-white">🏷️ Event Legend</h3>
                          <div className="grid grid-cols-2 gap-2">
                            {[
                              { color: 'bg-rose-500', label: 'Holidays' },
                              { color: 'bg-amber-500', label: 'Exams' },
                              { color: 'bg-emerald-500', label: 'Activities' },
                              { color: 'bg-purple-500', label: 'Meetings' },
                              { color: 'bg-blue-500', label: 'Exhibitions' },
                              { color: 'bg-indigo-500', label: 'Staff' },
                            ].map((l, i) => (
                              <div key={i} className="flex items-center gap-1.5">
                                <div className={`w-2.5 h-2.5 rounded-full ${l.color} shrink-0`} />
                                <span className="text-[10px] text-slate-500 dark:text-slate-400 font-bold">{l.label}</span>
                              </div>
                            ))}
                          </div>
                        </div>
                      </div>

                    </div>
                  </div>
                );
              })()}

              {/* ========== DEDICATED MY PROFILE DASHBOARD ========== */}
              {currentTab === 'profile' && (
                <div className="space-y-6 animate-in fade-in duration-300">

                  {/* PROFILE HEADER */}
                  <div className="p-6 bg-gradient-to-r from-purple-700 via-indigo-700 to-blue-700 rounded-3xl text-white shadow-xl flex flex-col md:flex-row items-center gap-6">
                    <div className="w-24 h-24 rounded-full bg-white/20 backdrop-blur-md border-4 border-white/30 flex items-center justify-center text-5xl shadow-lg">
                      {currentUser.avatar}
                    </div>
                    <div className="text-center md:text-left space-y-1">
                      <h2 className="text-2xl font-black tracking-tight">{currentUser.name}</h2>
                      <p className="text-sm text-purple-200 font-medium">{currentUser.email}</p>
                      <span className="inline-block mt-1 px-3 py-0.5 bg-white/20 backdrop-blur-md rounded-full text-xs font-bold">{currentRole.replace('_', ' ')}</span>
                    </div>
                  </div>

                  {/* PROFILE INFO CARD */}
                  <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl shadow-xs overflow-hidden">
                    <div className="px-6 py-4 border-b border-slate-100 dark:border-slate-800">
                      <h3 className="text-sm font-extrabold text-slate-900 dark:text-white flex items-center gap-2">👤 Profile Information</h3>
                    </div>
                    <div className="p-6 space-y-5">
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                        <div className="space-y-1.5">
                          <label className="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Full Name</label>
                          <p className="text-sm font-bold text-slate-900 dark:text-white">{currentUser.name}</p>
                        </div>
                        <div className="space-y-1.5">
                          <label className="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Email Address</label>

                        </div>
                        <div className="space-y-1.5">

                          <p className="text-sm font-bold text-slate-900 dark:text-white">+977 9801234567</p>
                        </div>
                        <div className="space-y-1.5">

                    </div>
                    <div className="flex flex-col sm:flex-row sm:items-center gap-2 sm:gap-4">
                      <label className="sm:w-1/3 text-left sm:text-right font-bold text-slate-500 dark:text-slate-400">Last Name *</label>
                      <input type="text" required value={otherForm.lastName} onChange={(e) => setOtherForm({ ...otherForm, lastName: e.target.value })} className="sm:w-2/3 px-3.5 py-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white font-medium focus:ring-2 focus:ring-emerald-500 focus:border-transparent outline-none transition-all" placeholder="Last name" />
                    </div>
                    <div className="flex flex-col sm:flex-row sm:items-center gap-2 sm:gap-4">
                      <label className="sm:w-1/3 text-left sm:text-right font-bold text-slate-500 dark:text-slate-400">Mobile Contact</label>
                      <input type="text" value={otherForm.phone} onChange={(e) => setOtherForm({ ...otherForm, phone: e.target.value })} className="sm:w-2/3 px-3.5 py-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white font-medium focus:ring-2 focus:ring-emerald-500 focus:border-transparent outline-none transition-all" />
                    </div>
                  </div>

                  <div className="pt-4 border-t border-slate-200 dark:border-slate-800 flex justify-end gap-2.5">
                    <button type="button" onClick={() => setShowAddOtherModal(false)} className="px-4 py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 font-bold hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors">Cancel</button>
                    <button type="submit" className="px-5 py-2.5 rounded-xl bg-emerald-600 text-white font-extrabold shadow-md hover:bg-emerald-700 transition-colors">✓ Register User</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* VIEW USER PROFILE MODAL */}
          {viewedUserProfile && (
            <div className="fixed inset-0 bg-slate-900/70 backdrop-blur-sm flex items-center justify-center z-50 p-4">
              <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl max-w-lg w-full overflow-hidden shadow-2xl animate-in zoom-in-95 duration-200">
                
                {/* Header Banner */}
                <div className="h-28 bg-gradient-to-r from-purple-600 to-indigo-600 relative flex items-end px-6 pb-4">
                  <button onClick={() => setViewedUserProfile(null)} className="absolute top-4 right-4 w-8 h-8 rounded-full bg-white/20 backdrop-blur-md text-white hover:bg-white/30 flex items-center justify-center font-bold transition-all">✕</button>
                  <div className="absolute -bottom-10 left-6">
                    <div className="w-20 h-20 rounded-2xl bg-slate-100 dark:bg-slate-850 border-4 border-white dark:border-slate-900 flex items-center justify-center text-3xl shadow-md font-extrabold">
                      {viewedUserProfile.type === 'STUDENT' ? '🎓' : '👨‍🏫'}
                    </div>
                  </div>
                </div>

                {/* Profile Details Container */}
                <div className="pt-14 px-6 pb-6 space-y-6">
                  {/* Name and Email */}
                  <div>
                    <div className="flex items-center gap-2">
                      <h3 className="text-lg font-black text-slate-900 dark:text-white">{viewedUserProfile.name}</h3>
                      <span className={`px-2.5 py-0.5 rounded-full text-[10px] font-black tracking-wide ${viewedUserProfile.type === 'STUDENT' ? 'bg-purple-100 text-purple-700 dark:bg-purple-950 dark:text-purple-300' : 'bg-indigo-100 text-indigo-700 dark:bg-indigo-950 dark:text-indigo-300'}`}>
                        {viewedUserProfile.type}
                      </span>
                    </div>
                    <p className="text-xs text-slate-400 font-medium mt-0.5">{viewedUserProfile.email}</p>
                  </div>

                  {/* Profile Info Cards Grid */}
                  <div className="bg-slate-50 dark:bg-slate-950 border border-slate-100 dark:border-slate-850 rounded-2xl p-4 space-y-3.5">
                    <h4 className="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Account Specifications</h4>
                    
                    <div className="grid grid-cols-2 gap-y-3.5 gap-x-4 text-xs">
                      {viewedUserProfile.type === 'STUDENT' ? (
                        <>
                          <div>
                            <span className="text-[10px] text-slate-400 font-bold block">Admission Number</span>
                            <span className="font-extrabold text-slate-700 dark:text-slate-300">{viewedUserProfile.admission}</span>
                          </div>
                          <div>
                            <span className="text-[10px] text-slate-400 font-bold block">Roll Number</span>
                            <span className="font-extrabold text-slate-700 dark:text-slate-300">{viewedUserProfile.roll}</span>
                          </div>
                          <div>
                            <span className="text-[10px] text-slate-400 font-bold block">Class & Section</span>
                            <span className="font-extrabold text-purple-600">{viewedUserProfile.class}</span>
                          </div>
                          <div>
                            <span className="text-[10px] text-slate-400 font-bold block">House Allocation</span>
                            <span className="font-extrabold text-slate-700 dark:text-slate-300">{viewedUserProfile.house}</span>
                          </div>
                          <div>
                            <span className="text-[10px] text-slate-400 font-bold block">Medical Alert / Allergies</span>
                            <span className={`font-extrabold ${viewedUserProfile.allergies !== 'None' ? 'text-rose-500' : 'text-slate-700 dark:text-slate-300'}`}>
                              {viewedUserProfile.allergies}
                            </span>
                          </div>
                          <div>
                            <span className="text-[10px] text-slate-400 font-bold block">Emergency Phone</span>
                            <span className="font-extrabold text-slate-700 dark:text-slate-300">{viewedUserProfile.emergency}</span>
                          </div>
                        </>
                      ) : (
                        <>
                          <div>
                            <span className="text-[10px] text-slate-400 font-bold block">Employee ID</span>
                            <span className="font-extrabold text-indigo-600">{viewedUserProfile.employeeId}</span>
                          </div>
                          <div>
                            <span className="text-[10px] text-slate-400 font-bold block">Primary Subject</span>
                            <span className="font-extrabold text-slate-700 dark:text-slate-300">{viewedUserProfile.subject}</span>
                          </div>
                          <div>
                            <span className="text-[10px] text-slate-400 font-bold block">Qualification</span>
                            <span className="font-extrabold text-slate-700 dark:text-slate-300">{viewedUserProfile.qualification}</span>
                          </div>
                          <div>
                            <span className="text-[10px] text-slate-400 font-bold block">Mobile Phone</span>
                            <span className="font-extrabold text-slate-700 dark:text-slate-300">{viewedUserProfile.phone}</span>
                          </div>
                          <div className="col-span-2">
                            <span className="text-[10px] text-slate-400 font-bold block">Assigned Classes</span>
                            <span className="font-extrabold text-slate-700 dark:text-slate-300">{viewedUserProfile.assignedClass}</span>
                          </div>
                        </>
                      )}

                      <div className="col-span-2 border-t border-slate-100 dark:border-slate-800/80 pt-3 flex items-center justify-between">
                        <div>
                          <span className="text-[10px] text-slate-400 font-bold block">System Status</span>
                          <span className={`inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded text-[10px] font-black ${viewedUserProfile.status === 'BLOCKED' ? 'bg-rose-100 text-rose-700 dark:bg-rose-950 dark:text-rose-300 animate-pulse' : 'bg-emerald-100 text-emerald-700 dark:bg-emerald-950 dark:text-emerald-300'}`}>
                            {viewedUserProfile.status === 'BLOCKED' ? '🚫 BLOCKED' : '✅ ACTIVE'}
                          </span>
                        </div>
                        {viewedUserProfile.type === 'STUDENT' ? (
                          <span className="text-[10px] text-slate-400 font-bold text-right">Academic Year 2025-2026</span>
                        ) : (
                          <span className="text-[10px] text-slate-400 font-bold text-right">Full-Time Faculty</span>
                        )}
                      </div>
                    </div>
                  </div>

                  {/* Actions / Close Button */}
                  <div className="flex justify-end pt-2 border-t border-slate-100 dark:border-slate-800">
                    <button 
                      onClick={() => setViewedUserProfile(null)} 
                      className="px-6 py-2 bg-purple-600 hover:bg-purple-700 text-white text-xs font-bold rounded-xl shadow-md transition-colors"
                    >
                      Close Profile
                    </button>
                  </div>
                </div>

              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
