<!DOCTYPE html>

<head>

  <script>

        extend: {

      }

  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

      const [sidebarCollapsed, setSidebarCollapsed] = useState(false);
      const [openSidebarCategory, setOpenSidebarCategory] = useState({ Students: true, Academics: true, Examinations: true, Finance: true, Communication: true });

      const [studentForm, setStudentForm] = useState({

        mobileNumber: '+977 9801234567', email: '', currentAddress: 'Baneshwor-10, Kathmandu', permanentAddress: 'Dharan-05, Sunsari', district: 'Kathmandu', province: 'Bagmati Province', country: 'Nepal', postalCode: '44600',

        emergencyContactPerson: '', emergencyRelation: 'Father', emergencyPhone: '+977 9801234567', emergencyAltPhone: '+977 9841000000', emergencyAddress: 'Baneshwor-10, Kathmandu',
        allergies: 'None', medicalConditions: 'None', disabilities: 'None', medications: 'None', doctorName: 'Dr. S. K. Sharma', hospitalName: 'Norvic Hospital', emergencyMedicalNotes: 'No chronic illness.',
        usesTransport: 'Yes', route: 'Route #4 (Koteshwor - Baneshwor)', pickupPoint: 'Baneshwor Chowk', dropoffPoint: 'Baneshwor Chowk', busNumber: 'BA 3 KHA 4589', driverName: 'Ram Bahadur',
        hostelRequired: 'No', hostelName: 'N/A', roomNumber: 'N/A', bedNumber: 'N/A', wardenName: 'N/A',
        admissionFee: '$500', monthlyFeePlan: '$250 / Month', scholarship: '10% Merit Waiver', discount: '$50', paymentMethod: 'Direct Transfer', feeStatus: 'PAID',
        studentPhotoUploaded: true, birthCertUploaded: true, citizenshipCertUploaded: false, transferCertUploaded: true, markSheetUploaded: true, characterCertUploaded: true, medicalCertUploaded: false, passportCopyUploaded: false, parentCitizenshipCopyUploaded: true,
        username: '', tempPassword: 'SMS-' + Math.random().toString(36).slice(-8).toUpperCase(), sendCredentialsSMS: true,
      });

      const chartRefAttendance = useRef(null);
      const chartRefFees = useRef(null);
      const chartRefPerformance = useRef(null);

      const currentUser = ROLE_USER_PROFILES[currentRole] || ROLE_USER_PROFILES.SUPER_ADMIN;

      const IS_ADMIN = currentRole === 'SUPER_ADMIN' || currentRole === 'SCHOOL_ADMIN';

      const CAN_ADMIT_STUDENTS = ['SUPER_ADMIN', 'SCHOOL_ADMIN', 'PRINCIPAL', 'VICE_PRINCIPAL', 'ACCOUNTANT'].includes(currentRole);

      // ENHANCED SIDEBAR TREE WITH EXPANDABLE SUB-ITEMS
      const ENHANCED_SIDEBAR = [
        { id: 'dashboard', label: 'Dashboard Overview', icon: '📊' },
        {
          group: 'Students', icon: '🎓', subItems: [
            { id: 'students', label: 'All Students' },
            { id: 'admissions', label: 'Admissions' },
            { id: 'promotions', label: 'Student Promotion' },
            { id: 'alumni', label: 'Alumni' },
          ]
        },
        {
          group: 'Academics', icon: '📚', subItems: [
            { id: 'classes', label: 'Classes & Sections' },
            { id: 'timetable', label: 'Timetable' },
            { id: 'attendance', label: 'Attendance' },
            { id: 'assignments', label: 'Assignments' },
          ]
        },
        {
          group: 'Examinations', icon: '📝', subItems: [
            { id: 'exams', label: 'Upcoming Exams' },
            { id: 'marks', label: 'Marks Entry' },
            { id: 'results', label: 'Results & Grade Cards' },
          ]
        },
        {
          group: 'Communication', icon: '💬', subItems: [
            { id: 'notices', label: 'Notice Board' },
            { id: 'messages', label: 'Messages & Mail' },
            { id: 'announcements', label: 'Announcements' },
          ]
        },
        {
          group: 'Finance', icon: '💵', subItems: [
            { id: 'fees', label: 'Fees & Invoicing' },
            { id: 'scholarships', label: 'Scholarships' },
          ]
        },
        { id: 'users', label: 'User Directory (All Roles)', icon: '🔑' },
        { id: 'reports', label: 'Reports Exporter', icon: '📈' },
        { id: 'settings', label: 'School Settings', icon: '⚙️' },
      ];

      const ADMISSION_WIZARD_STEPS = [
        { num: 1, label: 'Personal Info', icon: '👤' },
        { num: 2, label: 'Academic Info', icon: '🎓' },
        { num: 3, label: 'Contact Details', icon: '📞' },
        { num: 4, label: 'Parent / Guardian', icon: '👨‍👩‍👧' },
        { num: 5, label: 'Emergency Contact', icon: '🚨' },
        { num: 6, label: 'Medical Info', icon: '🩺' },
        { num: 7, label: 'Transport', icon: '🚌' },
        { num: 8, label: 'Hostel', icon: '🏢' },
        { num: 9, label: 'Fee & Payment', icon: '💵' },
        { num: 10, label: 'Documents Upload', icon: '📁' },
        { num: 11, label: 'Portal Account', icon: '🔐' },
      ];

      useEffect(() => {
        if (isDark) document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
      }, [isDark]);

      // Initialize Charts for Dashboard
      useEffect(() => {
        if (currentTab === 'dashboard' && window.Chart) {
          // Attendance Donut Chart (Row 4)
          const ctxA = document.getElementById('attendanceDonutChart');
          if (ctxA) {
            if (chartRefAttendance.current) chartRefAttendance.current.destroy();
            chartRefAttendance.current = new Chart(ctxA, {
              type: 'doughnut',
              data: {
                labels: ['Present (94%)', 'Absent (3%)', 'On Leave (2%)', 'Late (1%)'],
                datasets: [{
                  data: [94, 3, 2, 1],
                  backgroundColor: ['#10b981', '#f43f5e', '#3b82f6', '#f59e0b'],
                  borderWidth: 0
                }]
              },
              options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } }
            });
          }

          // Fee Bar Chart (Row 8)
          const ctxF = document.getElementById('feeBarChart');
          if (ctxF) {
            if (chartRefFees.current) chartRefFees.current.destroy();
            chartRefFees.current = new Chart(ctxF, {
              type: 'bar',
              data: {
                labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun'],
                datasets: [
                  { label: 'Collected Fees ($)', data: [45000, 52000, 48000, 61000, 68000, 64000], backgroundColor: '#4f46e5', borderRadius: 8 },
                  { label: 'Pending Dues ($)', data: [8000, 6000, 9500, 4000, 3000, 5200], backgroundColor: '#f43f5e', borderRadius: 8 }
                ]
              },
              options: { responsive: true, maintainAspectRatio: false }
            });
          }

          // Performance Line Chart (Row 9)
          const ctxP = document.getElementById('performanceChart');
          if (ctxP) {
            if (chartRefPerformance.current) chartRefPerformance.current.destroy();
            chartRefPerformance.current = new Chart(ctxP, {
              type: 'line',
              data: {
                labels: ['Term 1', 'Mid-Term', 'Term 2', 'Pre-Board', 'Final Exam'],
                datasets: [
                  { label: 'Mathematics Avg (%)', data: [82, 85, 88, 91, 94], borderColor: '#6366f1', fill: false, tension: 0.3 },
                  { label: 'Science Avg (%)', data: [78, 81, 84, 87, 90], borderColor: '#10b981', fill: false, tension: 0.3 }
                ]
              },
              options: { responsive: true, maintainAspectRatio: false }
            });
          }
        }
      }, [currentTab, isDark]);

      const notify = (msg) => {
        setNotification(msg);
        setTimeout(() => setNotification(null), 3000);
      };

      const handleAddStudentSubmit = (e) => {
        e.preventDefault();
        const fullName = `${studentForm.firstName} ${studentForm.middleName ? studentForm.middleName + ' ' : ''}${studentForm.lastName}`.trim() || 'New Student';
        const newEntry = {
          id: 's-' + Date.now(),
          name: fullName,
          email: studentForm.email || `${(studentForm.firstName || 'student').toLowerCase()}@sms.edu`,
          roll: studentForm.rollNo,
          admission: studentForm.admissionNo,
          class: `${studentForm.classCode}-${studentForm.section}`,
          house: `${studentForm.house} House`,
          status: 'ACTIVE',
          allergies: studentForm.allergies,
          emergency: studentForm.emergencyPhone,
        };
        setStudents([newEntry, ...students]);
        setShowAdmissionModal(false);
        setAdmissionStep(1);
        notify(`🎉 Student "${fullName}" Successfully Enrolled!`);
      };

      return (
        <div className="flex flex-col min-h-screen bg-slate-100 dark:bg-slate-950 text-slate-900 dark:text-slate-100 transition-colors duration-200">
          
          {/* ROW 15 PREVIEW: TOP WEATHER & SCROLLING ANNOUNCEMENT TICKER */}
          <div className="bg-indigo-900 text-white text-xs px-6 py-1.5 flex items-center justify-between overflow-hidden shadow-inner">
            <div className="flex items-center gap-3 shrink-0">

            <div className="overflow-hidden w-1/2 relative hidden sm:block">

          </div>

                    </div>
                  </div>
                )}

                <nav className="px-3 py-2 space-y-1.5 max-h-[calc(100vh-190px)] overflow-y-auto">
                  {ENHANCED_SIDEBAR.map((item, idx) => {
                    if (item.subItems) {
                      const isOpen = openSidebarCategory[item.group];
                      return (
                        <div key={idx} className="space-y-1">
                          <button
                            onClick={() => setOpenSidebarCategory({ ...openSidebarCategory, [item.group]: !isOpen })}
                            className="w-full flex items-center justify-between px-3.5 py-2 rounded-xl text-xs font-bold text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800"

                            <div className="flex items-center gap-3">

                                  onClick={() => setCurrentTab(sub.id)}
                                  className={`w-full text-left px-3 py-1.5 rounded-lg text-xs font-semibold ${

                    <h1 className="text-base font-extrabold text-slate-900 dark:text-white tracking-tight capitalize">

                  {/* Academic Year Selector */}
                  <select

                      {currentUser.avatar}

                    <div className="hidden md:block">
                      <p className="text-xs font-bold text-slate-900 dark:text-slate-100">{currentUser.name}</p>

                  </div>
                </div>
              </header>

              {/* DASHBOARD CONTENT BODY (15 ROWS) */}

                      </table>
                    </div>
                  </div>
                )}
              </main>

              {/* FOOTER STATISTICS BAR */}
              <footer className="bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 px-8 py-3.5 flex flex-wrap items-center justify-between text-xs text-slate-500 font-semibold">
                <div className="flex flex-wrap items-center gap-6">
                  <span>👨‍🎓 Students: <strong className="text-slate-900 dark:text-white">1,248</strong></span>
                  <span>👨‍🏫 Teachers: <strong className="text-slate-900 dark:text-white">86</strong></span>
                  <span>✅ Attendance: <strong className="text-emerald-600">96.4%</strong></span>
                  <span>📝 Assignments Pending: <strong className="text-amber-600">14</strong></span>
                  <span>🧪 Upcoming Exams: <strong className="text-indigo-600">3</strong></span>
                  <span>🔔 Unread Notifications: <strong className="text-rose-600">5</strong></span>
                </div>
                <p className="text-[11px] text-slate-400">Pathaibhara SMS © 2026</p>
              </footer>
            </div>
          </div>

          {/* 11-SECTION ADMISSION MODAL */}
          {showAdmissionModal && CAN_ADMIT_STUDENTS && (
            <div className="fixed inset-0 bg-slate-900/70 backdrop-blur-sm flex items-center justify-center z-50 p-4">
              <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl max-w-4xl w-full max-h-[92vh] flex flex-col overflow-hidden shadow-2xl">
                <div className="p-5 border-b flex items-center justify-between bg-slate-50 dark:bg-slate-800/50">
                  <div className="flex items-center gap-3">
                    <div className="w-10 h-10 rounded-2xl bg-indigo-600 text-white flex items-center justify-center font-extrabold text-lg">➕</div>
                    <div><h3 className="text-base font-extrabold text-slate-900 dark:text-white">Student Enrollment Wizard</h3><p className="text-xs text-slate-400">11-Category Registration Form</p></div>
                  </div>
                  <button onClick={() => setShowAdmissionModal(false)} className="p-2 rounded-xl text-slate-400">✕</button>
                </div>
                <form onSubmit={handleAddStudentSubmit} className="p-6 flex-1 overflow-y-auto space-y-4 text-xs">
                  <p className="font-bold text-indigo-600">Comprehensive Student Admission Wizard Active</p>
                  <button type="submit" className="px-6 py-2.5 rounded-xl bg-emerald-600 text-white font-bold">✓ Complete Enrollment</button>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
