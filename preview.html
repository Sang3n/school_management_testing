<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pathaibhara</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 50: '#eef2ff', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca', 900: '#1e1b4b' }
          }
        }
      }
    }
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- React 18 & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body { font-family: 'Inter', sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 9999px; }
    .dark ::-webkit-scrollbar-thumb { background: #334155; }
  </style>
</head>
<body class="bg-slate-100 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen transition-colors duration-200">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const ROLE_USER_PROFILES = {
      SUPER_ADMIN: { name: 'Alexander Vance', email: 'superadmin@sms.edu', avatar: 'A' },
      SCHOOL_ADMIN: { name: 'Sarah Jenkins', email: 'admin@sms.edu', avatar: 'S' },
      PRINCIPAL: { name: 'Dr. Robert Langdon', email: 'principal@sms.edu', avatar: 'R' },
      VICE_PRINCIPAL: { name: 'Elena Rostova', email: 'viceprincipal@sms.edu', avatar: 'E' },
      ACCOUNTANT: { name: 'Marcus Goldman', email: 'accountant@sms.edu', avatar: 'M' },
      TEACHER: { name: 'Emily Watson', email: 'teacher@sms.edu', avatar: 'E' },
      LIBRARIAN: { name: 'Arthur Pendelton', email: 'librarian@sms.edu', avatar: 'A' },
      RECEPTIONIST: { name: 'Clara Oswald', email: 'receptionist@sms.edu', avatar: 'C' },
      STUDENT: { name: 'Ethan Hunt', email: 'student@sms.edu', avatar: 'E' },
      PARENT: { name: 'Jonathan Hunt', email: 'parent@sms.edu', avatar: 'J' },
    };

    const ROLES = [
      { code: 'SUPER_ADMIN', name: 'Super Admin' },
      { code: 'SCHOOL_ADMIN', name: 'School Admin' },
      { code: 'PRINCIPAL', name: 'Principal' },
      { code: 'VICE_PRINCIPAL', name: 'Vice Principal' },
      { code: 'ACCOUNTANT', name: 'Accountant' },
      { code: 'TEACHER', name: 'Teacher' },
      { code: 'LIBRARIAN', name: 'Librarian' },
      { code: 'RECEPTIONIST', name: 'Receptionist' },
      { code: 'STUDENT', name: 'Student' },
      { code: 'PARENT', name: 'Parent' },
    ];

    const INITIAL_STUDENTS = [
      { id: 's1', name: 'Ethan Hunt', email: 'ethan@sms.edu', roll: '1001', admission: 'ADM-10045', class: 'Class 10-A', house: 'Red House', status: 'ACTIVE', allergies: 'Peanuts', emergency: '+1 555-999-8888' },
      { id: 's2', name: 'Sophia Miller', email: 'sophia@sms.edu', roll: '1002', admission: 'ADM-10046', class: 'Class 10-A', house: 'Green House', status: 'ACTIVE', allergies: 'None', emergency: '+1 555-888-7777' },
      { id: 's3', name: 'Lucas Davis', email: 'lucas@sms.edu', roll: '1003', admission: 'ADM-10047', class: 'Class 9-B', house: 'Blue House', status: 'ACTIVE', allergies: 'Penicillin', emergency: '+1 555-777-6666' },
      { id: 's4', name: 'Emma Watson', email: 'emma@sms.edu', roll: '1004', admission: 'ADM-10048', class: 'Class 8-A', house: 'Yellow House', status: 'ACTIVE', allergies: 'Pollen', emergency: '+1 555-666-5555' },
    ];

    function App() {
      const [currentRole, setCurrentRole] = useState('TEACHER');
      const [currentTab, setCurrentTab] = useState('students');
      const [isDark, setIsDark] = useState(false);
      const [showRoleDropdown, setShowRoleDropdown] = useState(false);
      const [students, setStudents] = useState(INITIAL_STUDENTS);
      const [search, setSearch] = useState('');
      const [showAdmissionModal, setShowAdmissionModal] = useState(false);
      const [viewStudent, setViewStudent] = useState(null);
      const [showReportCard, setShowReportCard] = useState(null);
      const [notification, setNotification] = useState(null);
      const [sidebarCollapsed, setSidebarCollapsed] = useState(false);

      // Admission Form Multi-Step State (11 Sections)
      const [admissionStep, setAdmissionStep] = useState(1);
      const [studentForm, setStudentForm] = useState({
        // 1. Personal Info
        studentId: 'STU-2026-' + Math.floor(1000 + Math.random() * 9000),
        admissionNo: 'ADM-2026-' + Math.floor(10000 + Math.random() * 90000),
        rollNo: String(Math.floor(100 + Math.random() * 900)),
        firstName: '', middleName: '', lastName: '', dob: '2010-06-12', gender: 'MALE', bloodGroup: 'O+', nationality: 'Nepali', religion: 'Hinduism', citizenshipNo: '', birthCertNo: '',
        // 2. Academic Info (Stream Removed, House Red/Green/Blue/Yellow, Class Nursery..Class 10+)
        academicYear: '2025-2026', admissionDate: new Date().toISOString().split('T')[0], classCode: 'Class 10', section: 'A', faculty: 'Schooling', house: 'Red', shift: 'Day', previousSchool: 'Sunrise Sec. School', previousGrade: '3.85 GPA', studentStatus: 'ACTIVE',
        // 3. Contact Info
        mobileNumber: '+977 9801234567', email: '', currentAddress: 'Baneshwor-10, Kathmandu', permanentAddress: 'Dharan-05, Sunsari', district: 'Kathmandu', province: 'Bagmati Province', country: 'Nepal', postalCode: '44600',
        // 4. Parent / Guardian
        fatherName: '', fatherMobile: '+977 9841000000', fatherEmail: '', fatherOccupation: 'Business', fatherCitizenshipNo: '12-01-75-09876', motherName: '', motherMobile: '+977 9841111111', motherEmail: '', motherOccupation: 'Educator', motherCitizenshipNo: '12-01-78-01234', guardianName: '', guardianRelation: 'Uncle', guardianMobile: '', guardianEmail: '', guardianAddress: '',
        // 5. Emergency Contact
        emergencyContactPerson: '', emergencyRelation: 'Father', emergencyPhone: '+977 9801234567', emergencyAltPhone: '+977 9841000000', emergencyAddress: 'Baneshwor-10, Kathmandu',
        // 6. Medical Info
        allergies: 'None', medicalConditions: 'None', disabilities: 'None', medications: 'None', doctorName: 'Dr. S. K. Sharma', hospitalName: 'Norvic Hospital', emergencyMedicalNotes: 'No chronic illness.',
        // 7. Transport
        usesTransport: 'Yes', route: 'Route #4 (Koteshwor - Baneshwor)', pickupPoint: 'Baneshwor Chowk', dropoffPoint: 'Baneshwor Chowk', busNumber: 'BA 3 KHA 4589', driverName: 'Ram Bahadur',
        // 8. Hostel
        hostelRequired: 'No', hostelName: 'N/A', roomNumber: 'N/A', bedNumber: 'N/A', wardenName: 'N/A',
        // 9. Fees
        admissionFee: '$500', monthlyFeePlan: '$250 / Month', scholarship: '10% Merit Waiver', discount: '$50', paymentMethod: 'Direct Transfer', feeStatus: 'PAID',
        // 10. Documents
        studentPhotoUploaded: true, birthCertUploaded: true, citizenshipCertUploaded: false, transferCertUploaded: true, markSheetUploaded: true, characterCertUploaded: true, medicalCertUploaded: false, passportCopyUploaded: false, parentCitizenshipCopyUploaded: true,
        // 11. Login Account
        username: '', tempPassword: 'SMS-' + Math.random().toString(36).slice(-8).toUpperCase(), sendCredentialsSMS: true,
      });

      const currentUser = ROLE_USER_PROFILES[currentRole] || ROLE_USER_PROFILES.SUPER_ADMIN;

      const IS_ADMIN = currentRole === 'SUPER_ADMIN' || currentRole === 'SCHOOL_ADMIN';

      const CAN_ADMIT_STUDENTS = ['SUPER_ADMIN', 'SCHOOL_ADMIN', 'PRINCIPAL', 'VICE_PRINCIPAL', 'ACCOUNTANT', 'TEACHER', 'RECEPTIONIST'].includes(currentRole);

      const NAV_SECTIONS = [
        {
          category: 'CORE MODULES',
          items: [
            { id: 'dashboard', label: 'Dashboard Overview', icon: '📊' },
            { id: 'students', label: 'Students & Admissions', icon: '🎓' },
            { id: 'teachers', label: 'Faculty & Staff', icon: '👥' },
            { id: 'attendance', label: 'Daily Attendance', icon: '📅' },
          ]
        },
        {
          category: 'ACADEMICS & FINANCE',
          items: [
            { id: 'exams', label: 'Exams & Grade Cards', icon: '📝' },
            { id: 'fees', label: 'Fees & Invoicing', icon: '💵' },
            { id: 'notices', label: 'Notice Board', icon: '🔔' },
          ]
        },
        {
          category: 'SYSTEM & REPORTS',
          items: [
            ...(IS_ADMIN ? [{ id: 'users', label: 'User Directory (Admins Only)', icon: '🔑' }] : []),
            { id: 'reports', label: 'Reports Exporter', icon: '📈' },
            { id: 'settings', label: 'School Settings', icon: '⚙️' },
          ]
        }
      ];

      const ADMISSION_WIZARD_STEPS = [
        { num: 1, label: 'Personal Info', icon: '👤' },
        { num: 2, label: 'Academic Info', icon: '🎓' },
        { num: 3, label: 'Contact Details', icon: '📞' },
        { num: 4, label: 'Parent / Guardian', icon: '👨‍👩‍👧' },
        { num: 5, label: 'Emergency Contact', icon: '🚨' },
        { num: 6, label: 'Medical Info', icon: '🩺' },
        { num: 7, label: 'Transport', icon: '🚌' },
        { num: 8, label: 'Hostel', icon: '🏢' },
        { num: 9, label: 'Fee & Payment', icon: '💵' },
        { num: 10, label: 'Documents Upload', icon: '📁' },
        { num: 11, label: 'Portal Account', icon: '🔐' },
      ];

      useEffect(() => {
        if (isDark) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      }, [isDark]);

      const notify = (msg) => {
        setNotification(msg);
        setTimeout(() => setNotification(null), 3000);
      };

      const handleAddStudentSubmit = (e) => {
        e.preventDefault();
        const fullName = `${studentForm.firstName} ${studentForm.middleName ? studentForm.middleName + ' ' : ''}${studentForm.lastName}`.trim() || 'New Student';
        const newEntry = {
          id: 's-' + Date.now(),
          name: fullName,
          email: studentForm.email || `${(studentForm.firstName || 'student').toLowerCase()}@sms.edu`,
          roll: studentForm.rollNo,
          admission: studentForm.admissionNo,
          class: `${studentForm.classCode}-${studentForm.section}`,
          house: `${studentForm.house} House`,
          status: 'ACTIVE',
          allergies: studentForm.allergies,
          emergency: studentForm.emergencyPhone,
        };
        setStudents([newEntry, ...students]);
        setShowAdmissionModal(false);
        setAdmissionStep(1);
        notify(`🎉 Student "${fullName}" Successfully Enrolled! Assigned to ${studentForm.classCode} (${studentForm.house} House).`);
      };

      return (
        <div className="flex min-h-screen bg-slate-100 dark:bg-slate-950 text-slate-900 dark:text-slate-100 transition-colors duration-200">
          
          {/* Sidebar Navigation */}
          <aside className={`${sidebarCollapsed ? 'w-20' : 'w-64'} bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 flex flex-col justify-between h-screen sticky top-0 z-30 transition-all duration-300 shadow-sm`}>
            <div>
              <div 
                onClick={() => setCurrentTab('dashboard')} 
                className="h-16 flex items-center px-5 border-b border-slate-200 dark:border-slate-800 gap-3 cursor-pointer hover:opacity-85 transition-opacity"
                title="Return to Dashboard Overview"
              >
                <div className="w-9 h-9 rounded-xl bg-gradient-to-tr from-rose-500 to-indigo-600 flex items-center justify-center text-white shadow-md font-extrabold text-lg shrink-0">
                  🏫
                </div>
                {!sidebarCollapsed && (
                  <span className="font-extrabold text-lg text-slate-900 dark:text-white tracking-tight">
                    <span className="text-rose-600 dark:text-rose-400">Pathaibhara</span>
                  </span>
                )}
              </div>

              {!sidebarCollapsed && (
                <div className="px-4 py-3 mx-3 my-3 bg-indigo-50 dark:bg-indigo-950/50 rounded-2xl border border-indigo-100 dark:border-indigo-900/60 flex items-center gap-2.5">
                  <span className="text-indigo-600 dark:text-indigo-400 text-sm shrink-0">🛡️</span>
                  <div className="overflow-hidden">
                    <p className="text-[10px] text-indigo-600 dark:text-indigo-400 uppercase font-bold tracking-wider">Active Context</p>
                    <p className="text-xs font-bold text-slate-900 dark:text-slate-100 truncate">{currentRole.replace('_', ' ')}</p>
                  </div>
                </div>
              )}

              <nav className="px-3 py-2 space-y-4 max-h-[calc(100vh-190px)] overflow-y-auto">
                {NAV_SECTIONS.map((sec, idx) => (
                  <div key={idx} className="space-y-1">
                    {!sidebarCollapsed && (
                      <p className="px-3 text-[10px] uppercase font-bold text-slate-400 dark:text-slate-500 tracking-wider">
                        {sec.category}
                      </p>
                    )}
                    {sec.items.map((item) => (
                      <button
                        key={item.id}
                        onClick={() => setCurrentTab(item.id)}
                        className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-bold transition-all ${
                          currentTab === item.id
                            ? 'bg-slate-700 dark:bg-indigo-600 text-white shadow-md'
                            : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 hover:text-slate-900 dark:hover:text-white'
                        }`}
                        title={item.label}
                      >
                        <span className="text-sm shrink-0">{item.icon}</span>
                        {!sidebarCollapsed && <span>{item.label}</span>}
                      </button>
                    ))}
                  </div>
                ))}
              </nav>
            </div>

            <div className="p-4 border-t border-slate-200 dark:border-slate-800 flex items-center justify-between">
              {!sidebarCollapsed && (
                <p className="text-[11px] text-slate-400 dark:text-slate-500 font-semibold">v2.5 Production Ready</p>
              )}
              <button 
                onClick={() => setSidebarCollapsed(!sidebarCollapsed)}
                className="p-1.5 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 text-xs font-bold"
              >
                {sidebarCollapsed ? '➔' : '◀'}
              </button>
            </div>
          </aside>

          {/* Main Workspace */}
          <div className="flex-1 flex flex-col min-w-0">
            <header className="h-16 bg-white/90 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 sticky top-0 z-20 px-6 flex items-center justify-between shadow-xs">
              <div className="flex items-center gap-4">
                <div className="flex items-center gap-2">
                  <div className="w-8 h-8 rounded-lg bg-slate-100 dark:bg-slate-800 flex items-center justify-center font-bold text-slate-700 dark:text-slate-200 text-sm">
                    🎓
                  </div>
                  <h1 className="text-base font-extrabold text-slate-900 dark:text-white tracking-tight capitalize">
                    {currentTab.replace('_', ' ')}
                  </h1>
                </div>

                <div className="relative hidden md:block w-72">
                  <input
                    type="text"
                    placeholder="Search student, roll no, admission ID..."
                    value={search}
                    onChange={(e) => setSearch(e.target.value)}
                    className="w-full pl-8 pr-4 py-1.5 text-xs rounded-xl bg-slate-100 dark:bg-slate-800 border-none text-slate-900 dark:text-slate-100 placeholder-slate-400 focus:ring-2 focus:ring-indigo-500"
                  />
                  <span className="absolute left-2.5 top-2 text-xs text-slate-400">🔍</span>
                </div>
              </div>

              <div className="flex items-center gap-3">
                {IS_ADMIN ? (
                  <div className="relative">
                    <button
                      onClick={() => setShowRoleDropdown(!showRoleDropdown)}
                      className="flex items-center gap-2 px-3 py-1.5 rounded-xl bg-indigo-50 dark:bg-indigo-950/80 border border-indigo-200 dark:border-indigo-800 text-indigo-700 dark:text-indigo-300 text-xs font-bold hover:bg-indigo-100"
                    >
                      <span>✨ Switch Portal: {currentRole}</span>
                      <span>▼</span>
                    </button>
                    {showRoleDropdown && (
                      <div className="absolute right-0 mt-2 w-56 bg-white dark:bg-slate-800 rounded-2xl shadow-2xl border border-slate-200 dark:border-slate-700 py-2 z-50">
                        {ROLES.map((r) => (
                          <button
                            key={r.code}
                            onClick={() => { setCurrentRole(r.code); setShowRoleDropdown(false); }}
                            className={`w-full text-left px-3.5 py-2 text-xs font-medium hover:bg-slate-100 dark:hover:bg-slate-700 ${currentRole === r.code ? 'text-indigo-600 font-bold' : 'text-slate-700 dark:text-slate-300'}`}
                          >
                            {r.name}
                          </button>
                        ))}
                      </div>
                    )}
                  </div>
                ) : (
                  <div className="px-3 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-300 text-xs font-bold">
                    <span>🛡️ Role: {currentRole.replace('_', ' ')}</span>
                  </div>
                )}

                <button onClick={() => setIsDark(!isDark)} className="p-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-amber-500 hover:bg-slate-200">
                  {isDark ? '☀️ Light' : '🌙 Dark'}
                </button>

                <div className="flex items-center gap-3 pl-3 border-l border-slate-200 dark:border-slate-800">
                  <div className="w-8 h-8 rounded-full bg-gradient-to-tr from-indigo-600 to-rose-500 flex items-center justify-center font-bold text-xs text-white shadow-md">
                    {currentUser.avatar}
                  </div>
                  <div className="hidden md:block">
                    <p className="text-xs font-bold text-slate-900 dark:text-slate-100">{currentUser.name}</p>
                    <p className="text-[10px] text-slate-400">{currentUser.email}</p>
                  </div>
                </div>
              </div>
            </header>

            <main className="p-8 max-w-7xl w-full mx-auto space-y-6">
              {notification && (
                <div className="p-3.5 rounded-2xl bg-indigo-50 dark:bg-indigo-950 border border-indigo-200 dark:border-indigo-800 text-indigo-700 dark:text-indigo-200 text-xs font-semibold flex items-center gap-2">
                  <span>ℹ️</span> {notification}
                </div>
              )}

              {/* STUDENTS TAB */}
              {currentTab === 'students' && (
                <div className="space-y-6">
                  <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                    <div>
                      <h2 className="text-xl font-extrabold text-slate-900 dark:text-white">Students & Admissions Directory</h2>
                      <p className="text-xs text-slate-500 dark:text-slate-400">Complete institutional enrollment & student records</p>
                    </div>

                    <button 
                      onClick={() => setShowAdmissionModal(true)} 
                      className="px-5 py-2.5 bg-gradient-to-r from-indigo-600 via-indigo-700 to-purple-700 hover:from-indigo-700 hover:to-purple-800 text-white font-extrabold text-xs rounded-2xl shadow-lg shadow-indigo-600/30 flex items-center gap-2 transition-all transform hover:-translate-y-0.5"
                    >
                      <span className="text-base">➕</span>
                      <span>+ Add Student Details (11-Step Enrollment)</span>
                    </button>
                  </div>

                  <div className="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200/90 dark:border-slate-800 overflow-hidden shadow-xs">
                    <table className="w-full text-left text-xs text-slate-700 dark:text-slate-300">
                      <thead className="bg-slate-50 dark:bg-slate-800 text-slate-500 dark:text-slate-400 font-bold border-b border-slate-200 dark:border-slate-700">
                        <tr>
                          <th className="p-3.5">Student Name</th>
                          <th className="p-3.5">Admission / Roll</th>
                          <th className="p-3.5">Class / Section</th>
                          <th className="p-3.5">House</th>
                          <th className="p-3.5">Medical Alert</th>
                          <th className="p-3.5 text-right">Profile Actions</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100 dark:divide-slate-800 font-medium">
                        {students.filter(s => s.name.toLowerCase().includes(search.toLowerCase())).map(s => (
                          <tr key={s.id} className="hover:bg-slate-50 dark:hover:bg-slate-800/50">
                            <td className="p-3.5 font-bold text-slate-900 dark:text-white">{s.name} <br/><span className="text-[10px] text-slate-400 font-normal">{s.email}</span></td>
                            <td className="p-3.5">{s.admission} <br/><span className="text-[10px] text-slate-400">Roll: {s.roll}</span></td>
                            <td className="p-3.5 font-semibold text-indigo-600 dark:text-indigo-400">{s.class}</td>
                            <td className="p-3.5">
                              <span className={`px-2.5 py-1 rounded-full text-[10px] font-bold ${
                                s.house.includes('Red') ? 'bg-rose-100 text-rose-700 dark:bg-rose-950 dark:text-rose-300' :
                                s.house.includes('Green') ? 'bg-emerald-100 text-emerald-700 dark:bg-emerald-950 dark:text-emerald-300' :
                                s.house.includes('Blue') ? 'bg-blue-100 text-blue-700 dark:bg-blue-950 dark:text-blue-300' :
                                'bg-amber-100 text-amber-700 dark:bg-amber-950 dark:text-amber-300'
                              }`}>
                                {s.house}
                              </span>
                            </td>
                            <td className="p-3.5 text-rose-600 dark:text-rose-400 font-semibold">{s.allergies !== 'None' ? `⚠️ ${s.allergies}` : 'None'}</td>
                            <td className="p-3.5 text-right">
                              <button onClick={() => setViewStudent(s)} className="px-3 py-1 bg-indigo-50 dark:bg-indigo-950 text-indigo-700 dark:text-indigo-300 rounded-lg text-xs font-semibold hover:bg-indigo-100">View Full Profile</button>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}
            </main>
          </div>

          {/* COMPREHENSIVE 11-SECTION STUDENT ADMISSION WIZARD MODAL */}
          {showAdmissionModal && (
            <div className="fixed inset-0 bg-slate-900/70 backdrop-blur-sm flex items-center justify-center z-50 p-4">
              <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl max-w-4xl w-full max-h-[92vh] flex flex-col overflow-hidden shadow-2xl">
                
                {/* Modal Header */}
                <div className="p-5 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between bg-slate-50 dark:bg-slate-800/50">
                  <div className="flex items-center gap-3">
                    <div className="w-10 h-10 rounded-2xl bg-indigo-600 text-white flex items-center justify-center font-extrabold text-lg shadow-md">
                      ➕
                    </div>
                    <div>

                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                          <div><label className="text-xs font-bold text-slate-700 dark:text-slate-300">Generated Student Username</label><input type="text" readOnly value={(studentForm.firstName || 'student').toLowerCase() + '.' + studentForm.rollNo} className="mt-1 w-full px-3.5 py-2 text-xs rounded-xl bg-white dark:bg-slate-800 font-mono font-bold text-indigo-600" /></div>
                          <div><label className="text-xs font-bold text-slate-700 dark:text-slate-300">Temporary Password</label><input type="text" readOnly value={studentForm.tempPassword} className="mt-1 w-full px-3.5 py-2 text-xs rounded-xl bg-white dark:bg-slate-800 font-mono font-bold text-emerald-600" /></div>
                        </div>
                        <div className="flex items-center gap-2 pt-2">
                          <input type="checkbox" checked={studentForm.sendCredentialsSMS} onChange={(e) => setStudentForm({ ...studentForm, sendCredentialsSMS: e.target.checked })} id="sendSmsModal" className="rounded text-indigo-600" />
                          <label htmlFor="sendSmsModal" className="text-xs font-semibold text-slate-700 dark:text-slate-300">Send Login Credentials via SMS & Email</label>
                        </div>
                      </div>
                    </div>
                  )}

                  {/* Modal Footer Controls */}
                  <div className="pt-4 flex items-center justify-between border-t border-slate-200 dark:border-slate-800">
                    <button
                      type="button"
                      disabled={admissionStep === 1}
                      onClick={() => setAdmissionStep((prev) => Math.max(1, prev - 1))}
                      className="px-4 py-2 rounded-xl text-xs font-bold bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:bg-slate-200 disabled:opacity-40"
                    >
                      ◀ Previous Step
                    </button>

                    {admissionStep < 11 ? (
                      <button
                        type="button"
                        onClick={() => setAdmissionStep((prev) => Math.min(11, prev + 1))}
                        className="px-5 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold shadow-md"
                      >
                        Next Step ➔
                      </button>
                    ) : (
                      <button
                        type="submit"
                        className="px-6 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold shadow-lg shadow-emerald-600/30"
                      >
                        ✓ Complete Student Enrollment
                      </button>
                    )}
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Profile Modal */}
          {viewStudent && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center z-50 p-4">
              <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-6 max-w-lg w-full text-xs space-y-4 shadow-2xl">
                <div className="flex justify-between items-center pb-2 border-b border-slate-100 dark:border-slate-800">
                  <h3 className="text-base font-bold text-slate-900 dark:text-white">{viewStudent.name} Profile</h3>
                  <button onClick={() => setViewStudent(null)} className="text-slate-400">✕</button>
                </div>
                <div className="grid grid-cols-2 gap-3">
                  <div className="p-3 bg-slate-50 dark:bg-slate-800/50 rounded-xl"><p className="text-slate-400">Admission No</p><p className="font-bold text-slate-900 dark:text-white">{viewStudent.admission}</p></div>
                  <div className="p-3 bg-slate-50 dark:bg-slate-800/50 rounded-xl"><p className="text-slate-400">Roll No</p><p className="font-bold text-slate-900 dark:text-white">{viewStudent.roll}</p></div>
                  <div className="p-3 bg-slate-50 dark:bg-slate-800/50 rounded-xl"><p className="text-slate-400">House</p><p className="font-bold text-indigo-600 dark:text-indigo-400">{viewStudent.house}</p></div>
                  <div className="p-3 bg-slate-50 dark:bg-slate-800/50 rounded-xl"><p className="text-slate-400">Emergency Phone</p><p className="font-bold text-rose-600 dark:text-rose-400">{viewStudent.emergency}</p></div>
                </div>
                <button onClick={() => setViewStudent(null)} className="w-full py-2 bg-indigo-600 text-white font-semibold rounded-xl">Close</button>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
